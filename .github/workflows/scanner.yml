name: Flight Hunter Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  scanner:
    name: Run Flight Hunter Scanner
    runs-on: ubuntu-latest

    env:
      FH_BACKEND_URL: ${{ secrets.FH_BACKEND_URL }}
      FH_PUBLISHABLE_KEY: ${{ secrets.FH_PUBLISHABLE_KEY }}
      FH_EMAIL: ${{ secrets.FH_EMAIL }}
      FH_PASSWORD: ${{ secrets.FH_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check repository structure
        run: |
          echo "========================================"
          echo "STRUTTURA REPOSITORY"
          echo "========================================"

          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            | sort

          echo ""
          echo "Verifica main.py..."

          if [ -f main.py ]; then
            echo "OK: main.py trovato"
          else
            echo "ERRORE: main.py non trovato"
            exit 1
          fi

          echo ""
          echo "Verifica cartella scanners..."

          if [ -d scanners ]; then
            echo "OK: cartella scanners trovata"
            find scanners -maxdepth 2 -type f | sort
          else
            echo "ERRORE: cartella scanners non trovata"
            exit 1
          fi

      - name: Check required secrets
        run: |
          echo "========================================"
          echo "VERIFICA CONFIGURAZIONE"
          echo "========================================"

          if [ -z "$FH_BACKEND_URL" ]; then
            echo "ERRORE: FH_BACKEND_URL non configurato"
            exit 1
          fi

          if [ -z "$FH_PUBLISHABLE_KEY" ]; then
            echo "ERRORE: FH_PUBLISHABLE_KEY non configurato"
            exit 1
          fi

          if [ -z "$FH_EMAIL" ]; then
            echo "ERRORE: FH_EMAIL non configurato"
            exit 1
          fi

          if [ -z "$FH_PASSWORD" ]; then
            echo "ERRORE: FH_PASSWORD non configurato"
            exit 1
          fi

          echo "OK: tutti i secret richiesti sono presenti"

      - name: Run Flight Hunter
        run: |
          echo "========================================"
          echo "AVVIO FLIGHT HUNTER"
          echo "========================================"

          python main.py

      - name: Scanner completed
        if: success()
        run: |
          echo "========================================"
          echo "FLIGHT HUNTER COMPLETATO CON SUCCESSO"
          echo "========================================"

      - name: Scanner failed
        if: failure()
        run: |
          echo "========================================"
          echo "ERRORE: FLIGHT HUNTER FALLITO"
          echo "========================================"
          exit 1
