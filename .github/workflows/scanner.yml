name: Flight Hunter Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Test Volotea real search
        env:
          VOLOTEA_API_KEY: ${{ secrets.VOLOTEA_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "TEST VOLOTEA - RICERCA REALE"
          echo "========================================"

          cat > /tmp/test_volotea.py <<'PYTHON'
          import json
          import os
          import sys
          from datetime import date, timedelta

          import requests
          from playwright.sync_api import sync_playwright


          STATIONS_URL = (
              "https://json.volotea.com/"
              "dist/stations/stations.json"
          )

          BOOKING_URL = "https://book.volotea.com/"

          SEARCH_PATH = "/api/spa/voe/v1/flights/search"

          ORIGIN = "VRN"
          DESTINATION = "CTA"

          USER_AGENT = (
              "Mozilla/5.0 "
              "(Linux; Android 6.0; Nexus 5 Build/MRA58N) "
              "AppleWebKit/537.36 "
              "(KHTML, like Gecko) "
              "Chrome/147.0.0.0 "
              "Mobile Safari/537.36"
          )


          def log(message=""):
              print(message, flush=True)


          def dump_json(label, data, limit=30000):
              log("")
              log(label)
              log("----------------------------------------")

              try:
                  text = json.dumps(
                      data,
                      indent=2,
                      ensure_ascii=False,
                  )
              except Exception:
                  text = str(data)

              if len(text) > limit:
                  text = text[:limit] + "\n...[TRONCATO]..."

              log(text)


          def safe_click(locator, description):
              """
              Prova prima il click normale.
              Se un overlay intercetta il puntatore,
              utilizza il click forzato.
              """
              try:
                  locator.click(timeout=5000)
                  log(f"{description}: click normale riuscito.")
                  return True
              except Exception as first_error:
                  log(
                      f"{description}: click normale non riuscito."
                  )
                  log(f"Motivo: {first_error}")

              try:
                  locator.click(
                      timeout=5000,
                      force=True,
                  )
                  log(
                      f"{description}: click forzato riuscito."
                  )
                  return True
              except Exception as second_error:
                  log(
                      f"{description}: click forzato non riuscito."
                  )
                  log(f"Motivo: {second_error}")

              return False


          def focus_input(page, locator, description):
              """
              Porta il focus sul campo tramite DOM,
              evitando problemi causati da overlay grafici.
              """
              try:
                  locator.evaluate(
                      """
                      el => {
                          el.scrollIntoView({
                              block: "center",
                              inline: "center"
                          });
                          el.focus();
                      }
                      """
                  )

                  log(
                      f"{description}: focus DOM riuscito."
                  )

                  return True

              except Exception as exc:
                  log(
                      f"{description}: errore focus DOM:"
                  )
                  log(repr(exc))
                  return False


          def clear_and_type(page, locator, value, description):
              """
              Compila un campo autocomplete usando il focus
              DOM e la tastiera del browser.
              """
              if not focus_input(
                  page,
                  locator,
                  description,
              ):
                  return False

              try:
                  page.keyboard.press("Control+A")
                  page.keyboard.press("Backspace")
                  page.keyboard.type(value, delay=100)

                  log(
                      f"{description}: valore '{value}' digitato."
                  )

                  return True

              except Exception as exc:
                  log(
                      f"{description}: errore digitazione:"
                  )
                  log(repr(exc))
                  return False


          def inspect_visible_text(page, terms):
              for term in terms:
                  try:
                      locator = page.get_by_text(
                          term,
                          exact=False,
                      )

                      count = locator.count()

                      if count:
                          log(
                              f"Testo '{term}': "
                              f"{count} elemento/i."
                          )

                          shown = 0

                          for index in range(
                              min(count, 20)
                          ):
                              element = locator.nth(index)

                              try:
                                  if not element.is_visible():
                                      continue

                                  text = (
                                      element.inner_text()
                                      .strip()
                                  )

                                  if text:
                                      log(
                                          f"  [{shown}] "
                                          f"{text[:300]}"
                                      )

                                      shown += 1

                              except Exception:
                                  pass

                  except Exception:
                      pass


          def select_airport(
              page,
              code,
              city,
              description,
          ):
              """
              Seleziona un aeroporto dall'autocomplete.
              Prova vari meccanismi senza affidarsi al click
              fisico sull'input.
              """

              log("")
              log(description)
              log("----------------------------------------")

              # --------------------------------------------------
              # 1. Ricerca elementi autocomplete
              # --------------------------------------------------

              selectors = [
                  "[role='option']",
                  "li",
                  "[role='listbox'] li",
                  "[class*='option']",
                  "[class*='suggestion']",
                  "[class*='autocomplete'] li",
              ]

              candidates = []

              for selector in selectors:
                  try:
                      locator = page.locator(selector)

                      count = locator.count()

                      for index in range(
                          min(count, 100)
                      ):
                          element = locator.nth(index)

                          try:
                              if not element.is_visible():
                                  continue

                              text = (
                                  element.inner_text()
                                  .strip()
                              )

                              if not text:
                                  continue

                              upper = text.upper()

                              if (
                                  code.upper() in upper
                                  or city.upper() in upper
                                  or "VERONA" in upper
                              ):
                                  candidates.append(element)

                          except Exception:
                              pass

                  except Exception:
                      pass

              log(
                  f"Candidati trovati per {code}: "
                  f"{len(candidates)}"
              )

              # --------------------------------------------------
              # 2. Prova click sui candidati
              # --------------------------------------------------

              for index, candidate in enumerate(
                  candidates[:20]
              ):
                  try:
                      text = (
                          candidate.inner_text()
                          .strip()
                      )

                      log(
                          f"Candidato {index}: "
                          f"{text[:300]}"
                      )

                      if safe_click(
                          candidate,
                          f"Selezione {code}",
                      ):
                          page.wait_for_timeout(1000)

                          return True

                  except Exception:
                      pass

              # --------------------------------------------------
              # 3. Prova tastiera
              # --------------------------------------------------

              log(
                  f"Nessun candidato cliccabile per {code}. "
                  "Provo selezione da tastiera."
              )

              try:
                  page.keyboard.press("ArrowDown")
                  page.wait_for_timeout(300)
                  page.keyboard.press("Enter")
                  page.wait_for_timeout(1000)

                  log(
                      f"{code}: selezione tastiera eseguita."
                  )

                  return True

              except Exception as exc:
                  log(
                      f"{code}: errore selezione tastiera:"
                  )
                  log(repr(exc))

              return False


          def main():

              # ==================================================
              # 1. DOWNLOAD STATIONS
              # ==================================================

              log("")
              log("1. DOWNLOAD STATIONS")
              log("----------------------------------------")

              try:
                  response = requests.get(
                      STATIONS_URL,
                      timeout=60,
                      headers={
                          "User-Agent": USER_AGENT,
                          "Accept": "application/json",
                          "Accept-Language":
                              "it-IT,it;q=0.9,en;q=0.8",
                      },
                  )

                  log(
                      f"HTTP status: "
                      f"{response.status_code}"
                  )

                  response.raise_for_status()

                  stations = response.json()

              except Exception as exc:
                  log("")
                  log("ERRORE DOWNLOAD STATIONS")
                  log(repr(exc))
                  return 1

              if not isinstance(stations, dict):
                  log(
                      "ERRORE: stations.json "
                      "non è un dizionario."
                  )
                  return 1

              log(
                  f"Stazioni presenti: "
                  f"{len(stations)}"
              )

              if ORIGIN not in stations:
                  log(
                      f"ERRORE: {ORIGIN} "
                      "non trovato."
                  )
                  return 1

              origin_data = stations[ORIGIN]

              markets = (
                  origin_data.get("Markets")
                  or {}
              )

              log(
                  f"Mercati {ORIGIN}: "
                  f"{len(markets)}"
              )

              if DESTINATION not in markets:
                  log(
                      f"ERRORE: {DESTINATION} "
                      "non presente nei Markets "
                      f"di {ORIGIN}."
                  )
                  return 1

              market = markets[DESTINATION]

              log("")
              log(
                  f"{ORIGIN} -> {DESTINATION}"
              )
              log("----------------------------------------")

              log(
                  f"Enabled: "
                  f"{market.get('Enabled')}"
              )

              log(
                  f"FlightType: "
                  f"{market.get('FlightType')}"
              )

              log(
                  f"MinFlightDate: "
                  f"{market.get('MinFlightDate')}"
              )

              log(
                  f"MaxFlightDate: "
                  f"{market.get('MaxFlightDate')}"
              )

              if not market.get("Enabled"):
                  log(
                      "ERRORE: tratta non abilitata."
                  )
                  return 1

              min_date = market.get(
                  "MinFlightDate"
              )

              max_date = market.get(
                  "MaxFlightDate"
              )

              test_date = (
                  date.today()
                  + timedelta(days=1)
              )

              if min_date:
                  test_date = max(
                      test_date,
                      date.fromisoformat(
                          min_date
                      ),
                  )

              if max_date:
                  max_date_obj = date.fromisoformat(
                      max_date
                  )

                  if test_date > max_date_obj:
                      log(
                          "ERRORE: nessuna data "
                          "valida disponibile."
                      )
                      return 1

              departure_date = (
                  test_date.isoformat()
              )

              log("")
              log("RICERCA DI TEST")
              log("----------------------------------------")
              log(
                  f"Origine:      {ORIGIN}"
              )
              log(
                  f"Destinazione: {DESTINATION}"
              )
              log(
                  f"Data:         {departure_date}"
              )
              log(
                  "Tipo:         SOLO ANDATA"
              )
              log(
                  "Passeggeri:   1"
              )

              # ==================================================
              # 2. BROWSER
              # ==================================================

              log("")
              log(
                  "2. APERTURA FRONTEND VOLOTEA"
              )
              log("----------------------------------------")

              api_key = os.environ.get(
                  "VOLOTEA_API_KEY",
                  "",
              ).strip()

              if api_key:
                  log(
                      "VOLOTEA_API_KEY: configurata"
                  )
              else:
                  log(
                      "VOLOTEA_API_KEY: "
                      "non configurata"
                  )

              captured_requests = []
              captured_responses = []

              with sync_playwright() as p:

                  browser = p.chromium.launch(
                      headless=True
                  )

                  context = browser.new_context(
                      locale="it-IT",
                      user_agent=USER_AGENT,
                      viewport={
                          "width": 1366,
                          "height": 900,
                      },
                      extra_http_headers={
                          "Accept-Language":
                              "it-IT,it;q=0.9,en;q=0.8",
                      },
                  )

                  page = context.new_page()

                  # ==================================================
                  # REQUEST INTERCEPTION
                  # ==================================================

                  def handle_request(request):

                      url = request.url

                      if SEARCH_PATH not in url:
                          return

                      headers = request.all_headers()

                      safe_headers = {}

                      for key, value in headers.items():

                          lower = key.lower()

                          if lower in (
                              "authorization",
                              "x-api-key",
                              "x-session-token",
                              "cookie",
                          ):
                              safe_headers[key] = (
                                  "[PRESENTE]"
                              )
                          else:
                              safe_headers[key] = value

                      item = {
                          "method": request.method,
                          "url": url,
                          "headers": safe_headers,
                      }

                      post_data = request.post_data

                      if post_data:

                          try:
                              item["post_data"] = (
                                  json.loads(
                                      post_data
                                  )
                              )

                          except Exception:
                              item["post_data"] = (
                                  post_data[:30000]
                              )

                      captured_requests.append(
                          item
                      )

                      log("")
                      log(
                          "========================================"
                      )
                      log(
                          "FLIGHTS/SEARCH INTERCETTATA"
                      )
                      log(
                          "========================================"
                      )

                      log(
                          f"METHOD: "
                          f"{request.method}"
                      )

                      log(
                          f"URL: "
                          f"{url}"
                      )

                      log("")

                      dump_json(
                          "HEADER:",
                          safe_headers,
                          20000,
                      )

                      if "post_data" in item:
                          dump_json(
                              "PAYLOAD:",
                              item["post_data"],
                              30000,
                          )
                      else:
                          log("")
                          log("PAYLOAD:")
                          log(
                              "Payload non disponibile."
                          )

                  # ==================================================
                  # RESPONSE INTERCEPTION
                  # ==================================================

                  def handle_response(response):

                      url = response.url

                      if SEARCH_PATH not in url:
                          return

                      item = {
                          "status": response.status,
                          "url": url,
                      }

                      try:
                          body = response.body()

                          item["size"] = len(body)

                          content_type = (
                              response.headers.get(
                                  "content-type",
                                  "",
                              )
                          )

                          item["content_type"] = (
                              content_type
                          )

                          if (
                              "json"
                              in content_type.lower()
                          ):
                              try:
                                  item["json"] = (
                                      json.loads(
                                          body
                                      )
                                  )

                              except Exception:
                                  pass

                      except Exception as exc:
                          item["error"] = repr(exc)

                      captured_responses.append(
                          item
                      )

                      log("")
                      log(
                          "========================================"
                      )
                      log(
                          "RISPOSTA FLIGHTS/SEARCH"
                      )
                      log(
                          "========================================"
                      )

                      log(
                          f"HTTP STATUS: "
                          f"{response.status}"
                      )

                      log(
                          f"URL: "
                          f"{url}"
                      )

                      log(
                          f"SIZE: "
                          f"{item.get('size', 0)} bytes"
                      )

                      if "json" in item:
                          dump_json(
                              "RISPOSTA JSON:",
                              item["json"],
                              30000,
                          )

                  page.on(
                      "request",
                      handle_request
                  )

                  page.on(
                      "response",
                      handle_response
                  )

                  # ==================================================
                  # 3. APERTURA
                  # ==================================================

                  log("")
                  log(
                      f"Apertura: {BOOKING_URL}"
                  )

                  try:
                      page.goto(
                          BOOKING_URL,
                          wait_until="domcontentloaded",
                          timeout=90000,
                      )

                  except Exception as exc:
                      log("")
                      log(
                          "ATTENZIONE apertura "
                          "frontend:"
                      )
                      log(repr(exc))

                  page.wait_for_timeout(
                      8000
                  )

                  log("")
                  log(
                      f"URL finale: {page.url}"
                  )

                  log(
                      f"Titolo: {page.title()}"
                  )

                  # ==================================================
                  # 4. COOKIE
                  # ==================================================

                  log("")
                  log(
                      "3. GESTIONE COOKIE"
                  )
                  log("----------------------------------------")

                  cookie_selectors = [
                      "button:has-text('Aceptar sólo las esenciales')",
                      "button:has-text('Accept only necessary')",
                      "button:has-text('Accetta solo i necessari')",
                      "button:has-text('Accept essential only')",
                      "button[aria-label*='necessary']",
                      "button[aria-label*='essenziali']",
                  ]

                  cookie_closed = False

                  for selector in cookie_selectors:

                      try:
                          locator = page.locator(
                              selector
                          ).first

                          if locator.count() == 0:
                              continue

                          if not locator.is_visible():
                              continue

                          log(
                              f"Cookie banner trovato: "
                              f"{selector}"
                          )

                          if safe_click(
                              locator,
                              "Chiusura cookie",
                          ):
                              cookie_closed = True
                              page.wait_for_timeout(
                                  1500
                              )
                              break

                      except Exception:
                          pass

                  if not cookie_closed:
                      log(
                          "Cookie banner non rilevato "
                          "o già chiuso."
                      )

                  # ==================================================
                  # 5. FORM VISIBILE
                  # ==================================================

                  log("")
                  log(
                      "4. ANALISI FORM VISIBILE"
                  )
                  log("----------------------------------------")

                  visible_inputs = page.locator(
                      "input:visible"
                  ).all()

                  log(
                      f"Input visibili: "
                      f"{len(visible_inputs)}"
                  )

                  for index, element in enumerate(
                      visible_inputs[:40]
                  ):
                      try:
                          attrs = element.evaluate(
                              """
                              el => ({
                                  type: el.type,
                                  name: el.name,
                                  id: el.id,
                                  placeholder: el.placeholder,
                                  value: el.value,
                                  aria:
                                      el.getAttribute(
                                          "aria-label"
                                      )
                              })
                              """
                          )

                          log(
                              f"VISIBLE INPUT {index}: "
                              + json.dumps(
                                  attrs,
                                  ensure_ascii=False,
                              )
                          )

                      except Exception:
                          pass

                  # ==================================================
                  # 6. LOCATOR CAMPI
                  # ==================================================

                  log("")
                  log(
                      "5. INDIVIDUAZIONE CAMPI"
                  )
                  log("----------------------------------------")

                  origin_field = page.locator(
                      "#input-text_sf-origin:visible"
                  ).first

                  destination_field = page.locator(
                      "#input-text_sf-destination:visible"
                  ).first

                  departure_field = page.locator(
                      "#input-text_sf-departure:visible"
                  ).first

                  return_field = page.locator(
                      "#input-text_sf-return:visible"
                  ).first

                  log(
                      f"Origin visibile: "
                      f"{origin_field.count()}"
                  )

                  log(
                      f"Destination visibile: "
                      f"{destination_field.count()}"
                  )

                  log(
                      f"Departure visibile: "
                      f"{departure_field.count()}"
                  )

                  log(
                      f"Return visibile: "
                      f"{return_field.count()}"
                  )

                  if origin_field.count() == 0:
                      log(
                          "ERRORE: campo partenza "
                          "non trovato."
                      )

                      page.screenshot(
                          path="/tmp/volotea-origin-error.png",
                          full_page=True,
                      )

                      browser.close()
                      return 1

                  if destination_field.count() == 0:
                      log(
                          "ERRORE: campo destinazione "
                          "non trovato."
                      )

                      page.screenshot(
                          path="/tmp/volotea-destination-error.png",
                          full_page=True,
                      )

                      browser.close()
                      return 1

                  # ==================================================
                  # 7. PARTENZA
                  # ==================================================

                  log("")
                  log(
                      "6. COMPILAZIONE PARTENZA"
                  )
                  log("----------------------------------------")

                  if not clear_and_type(
                      page,
                      origin_field,
                      ORIGIN,
                      "Campo partenza",
                  ):
                      log(
                          "ERRORE: impossibile "
                          "compilare VRN."
                      )

                      page.screenshot(
                          path="/tmp/volotea-origin-fill-error.png",
                          full_page=True,
                      )

                      browser.close()
                      return 1

                  page.wait_for_timeout(
                      2000
                  )

                  inspect_visible_text(
                      page,
                      [
                          "VRN",
                          "Verona",
                          "Italy",
                      ],
                  )

                  # ==================================================
                  # 8. SELEZIONE PARTENZA
                  # ==================================================

                  if not select_airport(
                      page,
                      ORIGIN,
                      "Verona",
                      "7. SELEZIONE PARTENZA",
                  ):
                      log(
                          "ATTENZIONE: selezione "
                          "automatica VRN non confermata."
                      )

                  page.wait_for_timeout(
                      1500
                  )

                  log("")
                  log(
                      "Valore campo partenza dopo "
                      "selezione:"
                  )

                  try:
                      log(
                          str(
                              origin_field.input_value()
                          )
                      )
                  except Exception as exc:
                      log(repr(exc))

                  # ==================================================
                  # 9. DESTINAZIONE
                  # ==================================================

                  log("")
                  log(
                      "8. COMPILAZIONE DESTINAZIONE"
                  )
                  log("----------------------------------------")

                  if not clear_and_type(
                      page,
                      destination_field,
                      DESTINATION,
                      "Campo destinazione",
                  ):
                      log(
                          "ERRORE: impossibile "
                          "compilare CTA."
                      )

                      page.screenshot(
                          path="/tmp/volotea-destination-fill-error.png",
                          full_page=True,
                      )

                      browser.close()
                      return 1

                  page.wait_for_timeout(
                      2000
                  )

                  inspect_visible_text(
                      page,
                      [
                          "CTA",
                          "Catania",
                          "Italy",
                      ],
                  )

                  # ==================================================
                  # 10. SELEZIONE DESTINAZIONE
                  # ==================================================

                  if not select_airport(
                      page,
                      DESTINATION,
                      "Catania",
                      "9. SELEZIONE DESTINAZIONE",
                  ):
                      log(
                          "ATTENZIONE: selezione "
                          "automatica CTA non confermata."
                      )

                  page.wait_for_timeout(
                      1500
                  )

                  log("")
                  log(
                      "Valore campo destinazione dopo "
                      "selezione:"
                  )

                  try:
                      log(
                          str(
                              destination_field.input_value()
                          )
                      )
                  except Exception as exc:
                      log(repr(exc))

                  # ==================================================
                  # 11. DATA PARTENZA
                  # ==================================================

                  log("")
                  log(
                      "10. ANALISI DATA PARTENZA"
                  )
                  log("----------------------------------------")

                  departure_field = page.locator(
                      "#input-text_sf-departure:visible"
                  ).first

                  log(
                      f"Campo data partenza visibile: "
                      f"{departure_field.count()}"
                  )

                  if departure_field.count():

                      log(
                          "Tentativo apertura "
                          "calendario..."
                      )

                      try:
                          departure_field.evaluate(
                              """
                              el => {
                                  el.scrollIntoView({
                                      block: "center"
                                  });
                                  el.focus();
                                  el.click();
                              }
                              """
                          )

                          log(
                              "Calendario aperto tramite DOM."
                          )

                      except Exception as exc:

                          log(
                              "Click DOM calendario "
                              "non riuscito:"
                          )

                          log(repr(exc))

                          try:
                              departure_field.click(
                                  force=True,
                                  timeout=5000,
                              )

                              log(
                                  "Calendario aperto "
                                  "con force click."
                              )

                          except Exception as exc2:

                              log(
                                  "Impossibile aprire "
                                  "il calendario:"
                              )

                              log(repr(exc2))

                      page.wait_for_timeout(
                          1500
                      )

                      log("")
                      log(
                          "Elementi calendario/data "
                          "visibili:"
                      )

                      date_candidates = page.locator(
                          "[role='gridcell'], "
                          "[role='option'], "
                          "button"
                      ).all()

                      shown_dates = 0

                      for index, element in enumerate(
                          date_candidates[:150]
                      ):
                          try:
                              if not element.is_visible():
                                  continue

                              text = (
                                  element.inner_text()
                                  .strip()
                              )

                              if text:
                                  log(
                                      f"DATE ELEMENT "
                                      f"{shown_dates}: "
                                      f"{text[:100]}"
                                  )

                                  shown_dates += 1

                              if shown_dates >= 50:
                                  break

                          except Exception:
                              pass

                  else:
                      log(
                          "ATTENZIONE: il campo data "
                          "non è attualmente esposto."
                      )

