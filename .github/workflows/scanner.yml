name: Flight Hunter Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Test Volotea real search
        env:
          VOLOTEA_API_KEY: ${{ secrets.VOLOTEA_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "TEST VOLOTEA - RICERCA REALE"
          echo "========================================"

          cat > /tmp/test_volotea.py <<'PYTHON'
          import json
          import os
          import sys
          from datetime import date, timedelta

          import requests
          from playwright.sync_api import sync_playwright


          STATIONS_URL = (
              "https://json.volotea.com/"
              "dist/stations/stations.json"
          )

          BOOKING_URL = "https://book.volotea.com/"

          API_PREFIX = "/api/spa/voe/"

          ORIGIN = "VRN"
          ORIGIN_CITY = "Verona"

          DESTINATION = "CTA"
          DESTINATION_CITY = "Catania"

          USER_AGENT = (
              "Mozilla/5.0 "
              "(Linux; Android 6.0; Nexus 5 Build/MRA58N) "
              "AppleWebKit/537.36 "
              "(KHTML, like Gecko) "
              "Chrome/147.0.0.0 "
              "Mobile Safari/537.36"
          )


          def log(message=""):
              print(message, flush=True)


          def dump_json(label, data, limit=30000):
              log("")
              log(label)
              log("----------------------------------------")

              try:
                  text = json.dumps(
                      data,
                      indent=2,
                      ensure_ascii=False,
                  )
              except Exception:
                  text = str(data)

              if len(text) > limit:
                  text = (
                      text[:limit]
                      + "\n...[TRONCATO]..."
                  )

              log(text)


          def safe_click(locator, description):
              try:
                  locator.click(timeout=5000)

                  log(
                      f"{description}: "
                      "click normale riuscito."
                  )

                  return True

              except Exception as first_error:
                  log(
                      f"{description}: "
                      "click normale non riuscito."
                  )

                  log(
                      f"Motivo: {first_error}"
                  )

              try:
                  locator.click(
                      timeout=5000,
                      force=True,
                  )

                  log(
                      f"{description}: "
                      "click forzato riuscito."
                  )

                  return True

              except Exception as second_error:
                  log(
                      f"{description}: "
                      "click forzato non riuscito."
                  )

                  log(
                      f"Motivo: {second_error}"
                  )

              return False


          def focus_input(
              page,
              locator,
              description,
          ):
              try:
                  locator.evaluate(
                      """
                      el => {
                          el.scrollIntoView({
                              block: "center",
                              inline: "center"
                          });
                          el.focus();
                      }
                      """
                  )

                  log(
                      f"{description}: "
                      "focus DOM riuscito."
                  )

                  return True

              except Exception as exc:
                  log(
                      f"{description}: "
                      "errore focus DOM:"
                  )

                  log(repr(exc))

                  return False


          def clear_and_type(
              page,
              locator,
              value,
              description,
          ):
              if not focus_input(
                  page,
                  locator,
                  description,
              ):
                  return False

              try:
                  locator.fill("")

                  locator.fill(value)

                  log(
                      f"{description}: "
                      f"valore '{value}' digitato."
                  )

                  return True

              except Exception as first_error:
                  log(
                      f"{description}: "
                      "fill non riuscito."
                  )

                  log(repr(first_error))

              try:
                  page.keyboard.press("Control+A")
                  page.keyboard.press("Backspace")

                  page.keyboard.type(
                      value,
                      delay=100,
                  )

                  log(
                      f"{description}: "
                      f"valore '{value}' digitato "
                      "tramite tastiera."
                  )

                  return True

              except Exception as second_error:
                  log(
                      f"{description}: "
                      "errore digitazione:"
                  )

                  log(repr(second_error))

                  return False


          def get_field_value(
              locator,
              description,
          ):
              try:
                  value = locator.input_value()

                  log(
                      f"{description}: "
                      f"valore attuale = '{value}'"
                  )

                  return value

              except Exception as exc:
                  log(
                      f"{description}: "
                      "impossibile leggere valore."
                  )

                  log(repr(exc))

                  return ""


          def find_current_origin(page):
              selectors = [
                  "#origin:visible",
                  "#input-text_sf-origin:visible",
                  "input[name='origin']:visible",
                  "input[placeholder='Select airport']:visible",
              ]

              for selector in selectors:
                  try:
                      locator = page.locator(
                          selector
                      ).first

                      if locator.count() > 0:
                          if locator.is_visible():
                              return locator

                  except Exception:
                      pass

              return None


          def find_current_destination(page):
              selectors = [
                  "#destination:visible",
                  "#input-text_sf-destination:visible",
                  "input[name='destination']:visible",
                  "input[placeholder='Select airport']:visible",
              ]

              for selector in selectors:
                  try:
                      locator = page.locator(
                          selector
                      ).first

                      if locator.count() > 0:
                          if locator.is_visible():
                              return locator

                  except Exception:
                      pass

              return None


          def inspect_visible_inputs(page, title):
              log("")
              log(title)
              log("----------------------------------------")

              try:
                  inputs = page.locator(
                      "input:visible"
                  )

                  count = inputs.count()

                  log(
                      f"Input visibili: {count}"
                  )

                  for index in range(
                      min(count, 50)
                  ):
                      element = inputs.nth(index)

                      try:
                          attrs = element.evaluate(
                              """
                              el => ({
                                  type: el.type,
                                  name: el.name,
                                  id: el.id,
                                  placeholder:
                                      el.placeholder,
                                  value:
                                      el.value,
                                  aria:
                                      el.getAttribute(
                                          "aria-label"
                                      ),
                                  autocomplete:
                                      el.getAttribute(
                                          "autocomplete"
                                      )
                              })
                              """
                          )

                          log(
                              f"INPUT {index}: "
                              + json.dumps(
                                  attrs,
                                  ensure_ascii=False,
                              )
                          )

                      except Exception:
                          pass

              except Exception as exc:
                  log(
                      "Errore analisi input:"
                  )

                  log(repr(exc))


          def inspect_visible_text(
              page,
              terms,
          ):
              for term in terms:
                  try:
                      locator = page.get_by_text(
                          term,
                          exact=False,
                      )

                      count = locator.count()

                      if count:
                          log(
                              f"Testo '{term}': "
                              f"{count} elemento/i."
                          )

                          shown = 0

                          for index in range(
                              min(count, 50)
                          ):
                              element = locator.nth(
                                  index
                              )

                              try:
                                  if not element.is_visible():
                                      continue

                                  text = (
                                      element.inner_text()
                                      .strip()
                                  )

                                  if text:
                                      log(
                                          f"  [{shown}] "
                                          f"{text[:500]}"
                                      )

                                      shown += 1

                              except Exception:
                                  pass

                  except Exception:
                      pass


          def inspect_autocomplete_dom(
              page,
              description,
          ):
              log("")
              log(
                  f"DIAGNOSTICA AUTOCOMPLETE "
                  f"{description}"
              )
              log("----------------------------------------")

              selectors = [
                  "[role='listbox']",
                  "[role='option']",
                  "li",
                  "[class*='option' i]",
                  "[class*='suggestion' i]",
                  "[class*='autocomplete' i]",
                  "[class*='dropdown' i]",
                  "[class*='airport' i]",
              ]

              found = []

              for selector in selectors:
                  try:
                      locator = page.locator(
                          selector
                      )

                      count = locator.count()

                      for index in range(
                          min(count, 100)
                      ):
                          element = locator.nth(index)

                          try:
                              if not element.is_visible():
                                  continue

                              text = (
                                  element.inner_text()
                                  .strip()
                              )

                              if not text:
                                  continue

                              found.append(
                                  (
                                      selector,
                                      index,
                                      text[:500],
                                  )
                              )

                          except Exception:
                              pass

                  except Exception:
                      pass

              log(
                  f"Elementi diagnostici trovati: "
                  f"{len(found)}"
              )

              seen = set()

              shown = 0

              for selector, index, text in found:
                  key = text

                  if key in seen:
                      continue

                  seen.add(key)

                  log(
                      f"[{shown}] "
                      f"{selector} -> {text}"
                  )

                  shown += 1

                  if shown >= 50:
                      break


          def try_click_airport_text(
              page,
              code,
              city,
              description,
          ):
              log("")
              log(description)
              log("----------------------------------------")

              terms = [
                  f"{city}",
                  f"{city} ({code})",
                  f"{city} - {code}",
                  f"{code} - {city}",
                  code,
              ]

              for term in terms:
                  try:
                      locator = page.get_by_text(
                          term,
                          exact=False,
                      )

                      count = locator.count()

                      log(
                          f"Candidati testuali "
                          f"'{term}': {count}"
                      )

                      for index in range(
                          min(count, 20)
                      ):
                          candidate = locator.nth(
                              index
                          )

                          try:
                              if not candidate.is_visible():
                                  continue

                              text = (
                                  candidate.inner_text()
                                  .strip()
                              )

                              log(
                                  f"Candidato: "
                                  f"{text[:500]}"
                              )

                              if safe_click(
                                  candidate,
                                  f"Selezione {code}",
                              ):
                                  page.wait_for_timeout(
                                      1500
                                  )

                                  return True

                          except Exception:
                              pass

                  except Exception:
                      pass

              return False


          def keyboard_select_airport(
              page,
              code,
              city,
              description,
          ):
              log("")
              log(
                  f"{description} - "
                  "SELEZIONE DA TASTIERA"
              )
              log("----------------------------------------")

              try:
                  # Prima proviamo con il nome della città,
                  # perché il frontend mostra nomi umani
                  # e non necessariamente il codice IATA.
                  page.keyboard.press(
                      "Control+A"
                  )

                  page.keyboard.press(
                      "Backspace"
                  )

                  page.keyboard.type(
                      city,
                      delay=100,
                  )

                  page.wait_for_timeout(
                      2500
                  )

                  inspect_autocomplete_dom(
                      page,
                      f"{code} DOPO DIGITAZIONE "
                      f"{city}",
                  )

                  inspect_visible_text(
                      page,
                      [
                          code,
                          city,
                          "Italy",
                          "Italia",
                      ],
                  )

                  # Tentativo standard.
                  page.keyboard.press(
                      "ArrowDown"
                  )

                  page.wait_for_timeout(
                      300
                  )

                  page.keyboard.press(
                      "Enter"
                  )

                  page.wait_for_timeout(
                      1800
                  )

                  log(
                      f"{code}: "
                      "ArrowDown + Enter eseguiti."
                  )

                  return True

              except Exception as exc:
                  log(
                      f"{code}: errore "
                      "selezione tastiera:"
                  )

                  log(repr(exc))

                  return False


          def select_airport(
              page,
              code,
              city,
              description,
              field_finder,
          ):
              log("")
              log(description)
              log("----------------------------------------")

              field = field_finder(page)

              if field is None:
                  log(
                      f"ERRORE: campo "
                      f"{code} non trovato."
                  )

                  return False

              # Prima prova con il codice.
              try:
                  if not clear_and_type(
                      page,
                      field,
                      code,
                      f"Campo {code}",
                  ):
                      return False

                  page.wait_for_timeout(
                      2500
                  )

              except Exception as exc:
                  log(
                      f"Errore digitazione "
                      f"{code}:"
                  )

                  log(repr(exc))

              inspect_autocomplete_dom(
                  page,
                  f"{code} DOPO CODICE",
              )

              inspect_visible_text(
                  page,
                  [
                      code,
                      city,
                      "Italy",
                      "Italia",
                  ],
              )

              # Tentativo di click diretto.
              if try_click_airport_text(
                  page,
                  code,
                  city,
                  "TENTATIVO CLICK RISULTATO",
              ):
                  current = field_finder(page)

                  if current is not None:
                      value = get_field_value(
                          current,
                          f"Verifica {code}",
                      )

                      if value.strip():
                          log(
                              f"{code}: selezione "
                              "confermata."
                          )

                          return True

              # Se il codice non ha prodotto
              # un candidato, proviamo con la città.
              field = field_finder(page)

              if field is None:
                  log(
                      f"{code}: campo non più "
                      "disponibile; il DOM è stato "
                      "ricostruito."
                  )

                  inspect_visible_inputs(
                      page,
                      "INPUT DOPO CAMBIO DOM",
                  )

                  field = field_finder(page)

                  if field is None:
                      return False

              try:
                  if not clear_and_type(
                      page,
                      field,
                      city,
                      f"Campo {city}",
                  ):
                      return False

                  page.wait_for_timeout(
                      2500
                  )

              except Exception as exc:
                  log(
                      f"Errore digitazione "
                      f"{city}:"
                  )

                  log(repr(exc))

              inspect_autocomplete_dom(
                  page,
                  f"{code} DOPO CITTA",
              )

              inspect_visible_text(
                  page,
                  [
                      code,
                      city,
                      "Italy",
                      "Italia",
                  ],
              )

              # Secondo tentativo di click.
              if try_click_airport_text(
                  page,
                  code,
                  city,
                  "SECONDO TENTATIVO CLICK",
              ):
                  current = field_finder(page)

                  if current is not None:
                      value = get_field_value(
                          current,
                          f"Verifica {code}",
                      )

                      if value.strip():
                          log(
                              f"{code}: selezione "
                              "confermata."
                          )

                          return True

              # Ultimo tentativo: tastiera.
              field = field_finder(page)

              if field is None:
                  log(
                      f"{code}: campo non disponibile "
                      "prima della tastiera."
                  )

                  return False

              if not focus_input(
                  page,
                  field,
                  f"Focus {code}",
              ):
                  return False

              if not keyboard_select_airport(
                  page,
                  code,
                  city,
                  f"TENTATIVO FINALE {code}",
              ):
                  return False

              page.wait_for_timeout(
                  1500
              )

              # IMPORTANTISSIMO:
              # il vecchio script considerava
              # ArrowDown + Enter come successo.
              # Ora verifichiamo realmente il campo.
              current = field_finder(page)

              if current is None:
                  log(
                      f"{code}: il DOM ha "
                      "ricostruito il campo."
                  )

                  inspect_visible_inputs(
                      page,
                      f"INPUT DOPO SELEZIONE {code}",
                  )

                  current = field_finder(page)

              if current is None:
                  log(
                      f"ERRORE: campo {code} "
                      "non recuperabile."
                  )

                  return False

              value = get_field_value(
                  current,
                  f"Valore finale {code}",
              )

              if not value.strip():
                  log(
                      f"ERRORE: {code} "
                      "non selezionato realmente. "
                      "Il campo è vuoto."
                  )

                  inspect_visible_inputs(
                      page,
                      f"INPUT FINALI DOPO FALLIMENTO {code}",
                  )

                  inspect_autocomplete_dom(
                      page,
                      f"DOM FINALE {code}",
                  )

                  return False

              # Controllo ulteriore:
              # il valore dovrebbe contenere città
              # oppure codice.
              normalized = value.upper()

              if (
                  code.upper() in normalized
                  or city.upper() in normalized
              ):
                  log(
                      f"{code}: selezione "
                      "REALMENTE confermata."
                  )

                  return True

              log(
                  f"ATTENZIONE: {code} "
                  f"ha valore '{value}', "
                  "ma non contiene né codice "
                  "né città."
              )

              return False


          def find_visible_date_inputs(page):
              selectors = [
                  "input[type='date']:visible",
                  "input[placeholder*='date' i]:visible",
                  "input[placeholder*='data' i]:visible",
                  "input[id*='departure' i]:visible",
                  "input[id*='date' i]:visible",
                  "input[name*='departure' i]:visible",
                  "input[name*='date' i]:visible",
              ]

              found = []

              for selector in selectors:
                  try:
                      locator = page.locator(
                          selector
                      )

                      count = locator.count()

                      for index in range(count):
                          element = locator.nth(
                              index
                          )

                          if not element.is_visible():
                              continue

                          found.append(element)

                  except Exception:
                      pass

              return found


          def inspect_buttons(page):
              log("")
              log("BUTTON E CONTROLLI")
              log("----------------------------------------")

              try:
                  buttons = page.locator(
                      "button:visible"
                  )

                  count = buttons.count()

                  log(
                      f"Button visibili: {count}"
                  )

                  for index in range(
                      min(count, 80)
                  ):
                      button = buttons.nth(index)

                      try:
                          info = button.evaluate(
                              """
                              el => ({
                                  text:
                                      el.innerText,
                                  aria:
                                      el.getAttribute(
                                          "aria-label"
                                      ),
                                  type:
                                      el.type,
                                  disabled:
                                      el.disabled,
                                  id:
                                      el.id,
                                  className:
                                      el.className
                              })
                              """
                          )

                          log(
                              f"BUTTON {index}: "
                              + json.dumps(
                                  info,
                                  ensure_ascii=False,
                              )
                          )

                      except Exception:
                          pass

              except Exception as exc:
                  log(
                      "Errore analisi button:"
                  )

                  log(repr(exc))


          def main():

              # ==================================================
              # 1. DOWNLOAD STATIONS
              # ==================================================

              log("")
              log("1. DOWNLOAD STATIONS")
              log("----------------------------------------")

              try:
                  response = requests.get(
                      STATIONS_URL,
                      timeout=60,
                      headers={
                          "User-Agent": USER_AGENT,
                          "Accept": "application/json",
                          "Accept-Language":
                              "it-IT,it;q=0.9,en;q=0.8",
                      },
                  )

                  log(
                      f"HTTP status: "
                      f"{response.status_code}"
                  )

                  response.raise_for_status()

                  stations = response.json()

              except Exception as exc:
                  log("")
                  log(
                      "ERRORE DOWNLOAD STATIONS"
                  )

                  log(repr(exc))

                  return 1


              if not isinstance(
                  stations,
                  dict,
              ):
                  log(
                      "ERRORE: stations.json "
                      "non è un dizionario."
                  )

                  return 1


              log(
                  f"Stazioni presenti: "
                  f"{len(stations)}"
              )


              if ORIGIN not in stations:
                  log(
                      f"ERRORE: {ORIGIN} "
                      "non trovato."
                  )

                  return 1


              origin_data = stations[ORIGIN]

              markets = (
                  origin_data.get("Markets")
                  or {}
              )


              log(
                  f"Mercati {ORIGIN}: "
                  f"{len(markets)}"
              )


              if DESTINATION not in markets:
                  log(
                      f"ERRORE: {DESTINATION} "
                      "non presente nei Markets "
                      f"di {ORIGIN}."
                  )

                  return 1


              market = markets[DESTINATION]


              log("")
              log(
                  f"{ORIGIN} -> {DESTINATION}"
              )
              log("----------------------------------------")


              log(
                  f"Enabled: "
                  f"{market.get('Enabled')}"
              )

              log(
                  f"FlightType: "
                  f"{market.get('FlightType')}"
              )

              log(
                  f"MinFlightDate: "
                  f"{market.get('MinFlightDate')}"
              )

              log(
                  f"MaxFlightDate: "
                  f"{market.get('MaxFlightDate')}"
              )


              if not market.get("Enabled"):
                  log(
                      "ERRORE: "
                      "tratta non abilitata."
                  )

                  return 1


              min_date = market.get(
                  "MinFlightDate"
              )

              max_date = market.get(
                  "MaxFlightDate"
              )


              test_date = (
                  date.today()
                  + timedelta(days=1)
              )


              if min_date:
                  test_date = max(
                      test_date,
                      date.fromisoformat(
                          min_date
                      ),
                  )


              if max_date:
                  max_date_obj = (
                      date.fromisoformat(
                          max_date
                      )
                  )

                  if test_date > max_date_obj:
                      log(
                          "ERRORE: nessuna data "
                          "valida disponibile."
                      )

                      return 1


              departure_date = (
                  test_date.isoformat()
              )


              log("")
              log("RICERCA DI TEST")
              log("----------------------------------------")

              log(
                  f"Origine:      {ORIGIN}"
              )

              log(
                  f"Destinazione: {DESTINATION}"
              )

              log(
                  f"Data:         {departure_date}"
              )

              log(
                  "Tipo:         SOLO ANDATA"
              )

              log(
                  "Passeggeri:   1"
              )


              # ==================================================
              # 2. BROWSER
              # ==================================================

              log("")
              log(
                  "2. APERTURA FRONTEND VOLOTEA"
              )
              log("----------------------------------------")


              api_key = os.environ.get(
                  "VOLOTEA_API_KEY",
                  "",
              ).strip()


              if api_key:
                  log(
                      "VOLOTEA_API_KEY: configurata"
                  )
              else:
                  log(
                      "VOLOTEA_API_KEY: "
                      "non configurata"
                  )


              captured_requests = []
              captured_responses = []


              with sync_playwright() as p:

                  browser = p.chromium.launch(
                      headless=True
                  )


                  context = browser.new_context(
                      locale="it-IT",
                      user_agent=USER_AGENT,
                      viewport={
                          "width": 1366,
                          "height": 900,
                      },
                      extra_http_headers={
                          "Accept-Language":
                              "it-IT,it;q=0.9,en;q=0.8",
                      },
                  )


                  page = context.new_page()


                  # ==================================================
                  # REQUEST INTERCEPTION
                  # ==================================================

                  def handle_request(request):

                      url = request.url

                      if API_PREFIX not in url:
                          return


                      headers = (
                          request.all_headers()
                      )

                      safe_headers = {}


                      for key, value in headers.items():

                          lower = key.lower()

                          if lower in (
                              "authorization",
                              "x-api-key",
                              "x-session-token",
                              "cookie",
                          ):
                              safe_headers[key] = (
                                  "[PRESENTE]"
                              )

                          else:
                              safe_headers[key] = (
                                  value
                              )


                      item = {
                          "method":
                              request.method,

                          "url":
                              url,

                          "headers":
                              safe_headers,
                      }


                      post_data = (
                          request.post_data
                      )


                      if post_data:

                          try:
                              item["post_data"] = (
                                  json.loads(
                                      post_data
                                  )
                              )

                          except Exception:
                              item["post_data"] = (
                                  post_data[:30000]
                              )


                      captured_requests.append(
                          item
                      )


                      log("")
                      log(
                          "========================================"
                      )

                      log(
                          "API VOLOTEA INTERCETTATA"
                      )

                      log(
                          "========================================"
                      )

                      log(
                          f"METHOD: "
                          f"{request.method}"
                      )

                      log(
                          f"URL: "
                          f"{url}"
                      )


                      dump_json(
                          "HEADER:",
                          safe_headers,
                          20000,
                      )


                      if "post_data" in item:
                          dump_json(
                              "PAYLOAD:",
                              item["post_data"],
                              30000,
                          )

                      else:
                          log("")
                          log("PAYLOAD:")
                          log(
                              "Payload non disponibile."
                          )


                  # ==================================================
                  # RESPONSE INTERCEPTION
                  # ==================================================

                  def handle_response(response):

                      url = response.url

                      if API_PREFIX not in url:
                          return


                      item = {
                          "status":
                              response.status,

                          "url":
                              url,
                      }


                      try:

                          body = response.body()

                          item["size"] = len(
                              body
                          )


                          content_type = (
                              response.headers.get(
                                  "content-type",
                                  "",
                              )
                          )


                          item[
                              "content_type"
                          ] = content_type


                          if (
                              "json"
                              in content_type.lower()
                          ):

                              try:
                                  item["json"] = (
                                      json.loads(
                                          body
                                      )
                                  )

                              except Exception:
                                  pass


                      except Exception as exc:

                          item["error"] = (
                              repr(exc)
                          )


                      captured_responses.append(
                          item
                      )


                      log("")
                      log(
                          "========================================"
                      )

                      log(
                          "RISPOSTA API VOLOTEA"
                      )

                      log(
                          "========================================"
                      )

                      log(
                          f"HTTP STATUS: "
                          f"{response.status}"
                      )

                      log(
                          f"URL: "
                          f"{url}"
                      )

                      log(
                          f"SIZE: "
                          f"{item.get('size', 0)} bytes"
                      )


                      if "json" in item:

                          dump_json(
                              "RISPOSTA JSON:",
                              item["json"],
                              30000,
                          )


                  page.on(
                      "request",
                      handle_request,
                  )

                  page.on(
                      "response",
                      handle_response,
                  )


