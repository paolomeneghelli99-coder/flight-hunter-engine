name: Flight Hunter Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Test Volotea airport selector
        env:
          VOLOTEA_API_KEY: ${{ secrets.VOLOTEA_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "FLIGHT HUNTER - TEST VOLOTEA"
          echo "DIAGNOSTICA SELETTORE AEROPORTI"
          echo "========================================"

          cat > /tmp/test_volotea.py <<'PYTHON'
          import json
          import os
          import sys
          from datetime import date, timedelta

          import requests
          from playwright.sync_api import sync_playwright


          # ============================================================
          # CONFIGURAZIONE
          # ============================================================

          STATIONS_URL = (
              "https://json.volotea.com/"
              "dist/stations/stations.json"
          )

          BOOKING_URL = "https://book.volotea.com/"

          API_PREFIX = "/api/spa/voe/"

          ORIGIN = "VRN"
          ORIGIN_CITY = "Verona"

          DESTINATION = "CTA"
          DESTINATION_CITY = "Catania"

          USER_AGENT = (
              "Mozilla/5.0 "
              "(Linux; Android 6.0; Nexus 5 Build/MRA58N) "
              "AppleWebKit/537.36 "
              "(KHTML, like Gecko) "
              "Chrome/147.0.0.0 "
              "Mobile Safari/537.36"
          )


          # ============================================================
          # LOG
          # ============================================================

          def log(message=""):
              print(message, flush=True)


          def dump_json(label, data, limit=30000):
              log("")
              log(label)
              log("----------------------------------------")

              try:
                  text = json.dumps(
                      data,
                      indent=2,
                      ensure_ascii=False,
                  )
              except Exception:
                  text = str(data)

              if len(text) > limit:
                  text = (
                      text[:limit]
                      + "\n...[TRONCATO]..."
                  )

              log(text)


          # ============================================================
          # SAFE CLICK
          # ============================================================

          def safe_click(locator, description):
              try:
                  locator.click(timeout=5000)

                  log(
                      f"{description}: "
                      "CLICK NORMALE RIUSCITO"
                  )

                  return True

              except Exception as exc:
                  log(
                      f"{description}: "
                      "click normale fallito"
                  )

                  log(
                      f"Motivo: {exc}"
                  )

              try:
                  locator.click(
                      timeout=5000,
                      force=True,
                  )

                  log(
                      f"{description}: "
                      "CLICK FORZATO RIUSCITO"
                  )

                  return True

              except Exception as exc:
                  log(
                      f"{description}: "
                      "click forzato fallito"
                  )

                  log(
                      f"Motivo: {exc}"
                  )

              return False


          # ============================================================
          # INPUT VISIBILI
          # ============================================================

          def inspect_visible_inputs(page, title):
              log("")
              log(title)
              log("----------------------------------------")

              inputs = page.locator("input:visible")

              try:
                  count = inputs.count()
              except Exception:
                  count = 0

              log(
                  f"Input visibili: {count}"
              )

              for index in range(min(count, 50)):
                  element = inputs.nth(index)

                  try:
                      info = element.evaluate(
                          """
                          el => ({
                              tag: el.tagName,
                              type: el.type,
                              id: el.id,
                              name: el.name,
                              placeholder: el.placeholder,
                              value: el.value,
                              readonly: el.readOnly,
                              disabled: el.disabled,
                              aria: el.getAttribute("aria-label"),
                              autocomplete:
                                  el.getAttribute("autocomplete"),
                              className: el.className,
                              outerHTML: el.outerHTML
                          })
                          """
                      )

                      dump_json(
                          f"INPUT {index}:",
                          info,
                          8000,
                      )

                  except Exception as exc:
                      log(
                          f"Errore INPUT {index}: "
                          f"{exc}"
                      )


          # ============================================================
          # ELEMENTI VISIBILI DOPO IL CLICK
          # ============================================================

          def inspect_visible_elements(page):
              log("")
              log("ELEMENTI VISIBILI DOPO CLICK")
              log("----------------------------------------")

              selectors = [
                  "button:visible",
                  "[role='button']:visible",
                  "[role='option']:visible",
                  "[role='listbox']:visible",
                  "[role='combobox']:visible",
                  "[aria-selected]:visible",
                  "[data-testid]:visible",
                  "[class*='airport' i]:visible",
                  "[class*='autocomplete' i]:visible",
                  "[class*='suggestion' i]:visible",
                  "[class*='dropdown' i]:visible",
                  "[class*='listbox' i]:visible",
                  "[class*='modal' i]:visible",
                  "[class*='dialog' i]:visible",
              ]

              seen = set()
              total = 0

              for selector in selectors:

                  try:
                      locator = page.locator(selector)
                      count = locator.count()

                  except Exception:
                      continue

                  for index in range(min(count, 100)):

                      element = locator.nth(index)

                      try:
                          if not element.is_visible():
                              continue

                          text = (
                              element.inner_text()
                              .strip()
                          )

                          outer_html = (
                              element.get_attribute(
                                  "outerHTML"
                              )
                              or ""
                          )

                          key = (
                              selector,
                              text,
                              outer_html[:500],
                          )

                          if key in seen:
                              continue

                          seen.add(key)

                          total += 1

                          log("")
                          log(
                              f"ELEMENTO {total}"
                          )

                          log(
                              f"Selector: {selector}"
                          )

                          log(
                              f"Testo: "
                              f"{text[:1000]}"
                          )

                          log(
                              f"HTML: "
                              f"{outer_html[:3000]}"
                          )

                      except Exception:
                          pass

              log("")
              log(
                  f"Totale elementi diagnostici: "
                  f"{total}"
              )


          # ============================================================
          # RICERCA TESTUALE
          # ============================================================

          def search_text(page, terms):
              log("")
              log("RICERCA TESTUALE DOPO CLICK")
              log("----------------------------------------")

              for term in terms:

                  try:
                      locator = page.get_by_text(
                          term,
                          exact=False,
                      )

                      count = locator.count()

                      visible = 0

                      for index in range(
                          min(count, 50)
                      ):

                          element = locator.nth(index)

                          try:
                              if not element.is_visible():
                                  continue

                              text = (
                                  element.inner_text()
                                  .strip()
                              )

                              if not text:
                                  continue

                              visible += 1

                              log("")
                              log(
                                  f"TERMINE: {term}"
                              )

                              log(
                                  f"Visibile: "
                                  f"{visible}"
                              )

                              log(
                                  f"Testo: "
                                  f"{text[:1000]}"
                              )

                              attrs = element.evaluate(
                                  """
                                  el => ({
                                      tag: el.tagName,
                                      id: el.id,
                                      role:
                                          el.getAttribute("role"),
                                      aria:
                                          el.getAttribute(
                                              "aria-label"
                                          ),
                                      className:
                                          el.className,
                                      dataTestId:
                                          el.getAttribute(
                                              "data-testid"
                                          ),
                                      outerHTML:
                                          el.outerHTML
                                  })
                                  """
                              )

                              dump_json(
                                  "ATTRIBUTI:",
                                  attrs,
                                  6000,
                              )

                          except Exception:
                              pass

                      log(
                          f"'{term}': "
                          f"{count} elementi, "
                          f"{visible} visibili"
                      )

                  except Exception as exc:
                      log(
                          f"Errore ricerca '{term}': "
                          f"{exc}"
                      )


          # ============================================================
          # DOM BODY
          # ============================================================

          def inspect_body(page):
              log("")
              log("BODY TEXT DOPO CLICK")
              log("----------------------------------------")

              try:
                  body = page.locator("body").inner_text()

                  if len(body) > 20000:
                      body = (
                          body[:20000]
                          + "\n...[TRONCATO]..."
                      )

                  log(body)

              except Exception as exc:
                  log(
                      f"Errore body text: {exc}"
                  )


          # ============================================================
          # HTML SELETTORE AEROPORTO
          # ============================================================

          def inspect_origin_field(page):
              log("")
              log("ANALISI CAMPO ORIGINE")
              log("----------------------------------------")

              selectors = [
                  "#input-text_sf-origin:visible",
                  "#origin:visible",
                  "input[name='origin']:visible",
                  "input[placeholder='Select airport']:visible",
              ]

              for selector in selectors:

                  try:
                      locator = page.locator(
                          selector
                      ).first

                      if locator.count() == 0:
                          continue

                      if not locator.is_visible():
                          continue

                      log(
                          f"Campo trovato con: "
                          f"{selector}"
                      )

                      info = locator.evaluate(
                          """
                          el => ({
                              tag: el.tagName,
                              type: el.type,
                              id: el.id,
                              name: el.name,
                              value: el.value,
                              placeholder: el.placeholder,
                              readonly: el.readOnly,
                              disabled: el.disabled,
                              className: el.className,
                              parentHTML:
                                  el.parentElement
                                  ? el.parentElement.outerHTML
                                  : null,
                              outerHTML:
                                  el.outerHTML
                          })
                          """
                      )

                      dump_json(
                          "DETTAGLI CAMPO ORIGINE:",
                          info,
                          15000,
                      )

                      return locator

                  except Exception as exc:
                      log(
                          f"Errore selector "
                          f"{selector}: {exc}"
                      )

              log(
                  "Campo origine NON trovato."
              )

              return None


          # ============================================================
          # TEST CLICK PURO
          # ============================================================

          def test_origin_click(page):
              log("")
              log("5. TEST CLICK PURO CAMPO ORIGINE")
              log("========================================")

              field = inspect_origin_field(page)

              if field is None:
                  return False

              log("")
              log("STATO PRIMA DEL CLICK")
              log("----------------------------------------")

              try:
                  log(
                      f"Valore: "
                      f"{field.input_value()}"
                  )

                  log(
                      f"Readonly: "
                      f"{field.get_attribute('readonly')}"
                  )

                  log(
                      f"Disabled: "
                      f"{field.get_attribute('disabled')}"
                  )

              except Exception:
                  pass

              # --------------------------------------------------------
              # CLICK
              # --------------------------------------------------------

              log("")
              log("ESECUZIONE CLICK...")
              log("----------------------------------------")

              clicked = safe_click(
                  field,
                  "Campo aeroporto origine",
              )

              if not clicked:
                  log(
                      "ERRORE: impossibile cliccare "
                      "il campo origine."
                  )

                  return False

              # --------------------------------------------------------
              # ATTESA
              # --------------------------------------------------------

              log("")
              log(
                  "Attendo 2 secondi "
                  "per apertura componente..."
              )

              page.wait_for_timeout(2000)

              # --------------------------------------------------------
              # STATO DOPO CLICK
              # --------------------------------------------------------

              log("")
              log("STATO CAMPO DOPO CLICK")
              log("----------------------------------------")

              try:
                  info = field.evaluate(
                      """
                      el => ({
                          value: el.value,
                          readonly: el.readOnly,
                          disabled: el.disabled,
                          className: el.className,
                          outerHTML: el.outerHTML
                      })
                      """
                  )

                  dump_json(
                      "CAMPO DOPO CLICK:",
                      info,
                      10000,
                  )

              except Exception as exc:
                  log(
                      f"Errore stato dopo click: "
                      f"{exc}"
                  )

              # --------------------------------------------------------
              # DIAGNOSTICA
              # --------------------------------------------------------

              inspect_visible_inputs(
                  page,
                  "INPUT DOPO CLICK",
              )

              search_text(
                  page,
                  [
                      "Verona",
                      "VRN",
                      "Verona (VRN)",
                      "La Palma",
                      "Catania",
                      "CTA",
                  ],
              )

              inspect_visible_elements(
                  page,
              )

              inspect_body(
                  page,
              )

              # --------------------------------------------------------
              # SCREENSHOT
              # --------------------------------------------------------

              try:
                  page.screenshot(
                      path="/tmp/volotea-after-origin-click.png",
                      full_page=True,
                  )

                  log("")
                  log(
                      "Screenshot salvato:"
                  )

                  log(
                      "/tmp/volotea-after-origin-click.png"
                  )

              except Exception as exc:
                  log(
                      f"Screenshot non disponibile: "
                      f"{exc}"
                  )

              return True


          # ============================================================
          # MAIN
          # ============================================================

          def main():

              # ========================================================
              # 1. DOWNLOAD STATIONS
              # ========================================================

              log("")
              log("1. DOWNLOAD STATIONS")
              log("========================================")

              try:
                  response = requests.get(
                      STATIONS_URL,
                      timeout=60,
                      headers={
                          "User-Agent": USER_AGENT,
                          "Accept": "application/json",
                          "Accept-Language":
                              "it-IT,it;q=0.9,en;q=0.8",
                      },
                  )

                  log(
                      f"HTTP status: "
                      f"{response.status_code}"
                  )

                  response.raise_for_status()

                  stations = response.json()

              except Exception as exc:
                  log("")
                  log(
                      "ERRORE DOWNLOAD STATIONS"
                  )

                  log(repr(exc))

                  return 1

              if not isinstance(
                  stations,
                  dict,
              ):
                  log(
                      "ERRORE: stations.json "
                      "non è un dizionario."
                  )

                  return 1

              log(
                  f"Stazioni presenti: "
                  f"{len(stations)}"
              )

              if ORIGIN not in stations:
                  log(
                      f"ERRORE: {ORIGIN} "
                      "non trovato."
                  )

                  return 1

              origin_data = stations[ORIGIN]

              markets = (
                  origin_data.get("Markets")
                  or {}
              )

              log(
                  f"Mercati {ORIGIN}: "
                  f"{len(markets)}"
              )

              if DESTINATION not in markets:
                  log(
                      f"ERRORE: {DESTINATION} "
                      "non presente nei Markets "
                      f"di {ORIGIN}."
                  )

                  return 1

              market = markets[DESTINATION]

              log("")
              log(
                  f"{ORIGIN} -> {DESTINATION}"
              )
              log("----------------------------------------")

              log(
                  f"Enabled: "
                  f"{market.get('Enabled')}"
              )

              log(
                  f"FlightType: "
                  f"{market.get('FlightType')}"
              )

              log(
                  f"MinFlightDate: "
                  f"{market.get('MinFlightDate')}"
              )

              log(
                  f"MaxFlightDate: "
                  f"{market.get('MaxFlightDate')}"
              )

              if not market.get("Enabled"):
                  log(
                      "ERRORE: tratta non abilitata."
                  )

                  return 1

              min_date = market.get(
                  "MinFlightDate"
              )

              max_date = market.get(
                  "MaxFlightDate"
              )

              test_date = (
                  date.today()
                  + timedelta(days=1)
              )

              if min_date:
                  test_date = max(
                      test_date,
                      date.fromisoformat(
                          min_date
                      ),
                  )

              if max_date:

                  max_date_obj = (
                      date.fromisoformat(
                          max_date
                      )
                  )

                  if test_date > max_date_obj:
                      log(
                          "ERRORE: nessuna data "
                          "valida disponibile."
                      )

                      return 1

              departure_date = (
                  test_date.isoformat()
              )

              log("")
              log("RICERCA DI TEST")
              log("----------------------------------------")

              log(
                  f"Origine:      {ORIGIN}"
              )

              log(
                  f"Destinazione: {DESTINATION}"
              )

              log(
                  f"Data:         {departure_date}"
              )

              log(
                  "Tipo:         SOLO ANDATA"
              )

              log(
                  "Passeggeri:   1"
              )

              # ========================================================
              # 2. BROWSER
              # ========================================================

              log("")
              log("2. APERTURA FRONTEND VOLOTEA")
              log("========================================")

              api_key = os.environ.get(
                  "VOLOTEA_API_KEY",
                  "",
              ).strip()

              if api_key:
                  log(
                      "VOLOTEA_API_KEY: configurata"
                  )
              else:
                  log(
                      "VOLOTEA_API_KEY: "
                      "non configurata"
                  )

              captured_requests = []
              captured_responses = []

              with sync_playwright() as p:

                  browser = p.chromium.launch(
                      headless=True,
                      args=[
                          "--disable-blink-features=AutomationControlled",
                      ],
                  )

                  context = browser.new_context(
                      locale="it-IT",
                      user_agent=USER_AGENT,
                      viewport={
                          "width": 1366,
                          "height": 900,
                      },
                      extra_http_headers={
                          "Accept-Language":
                              "it-IT,it;q=0.9,en;q=0.8",
                      },
                  )

                  page = context.new_page()

                  # ====================================================
                  # NETWORK REQUEST
                  # ====================================================

                  def handle_request(request):

                      url = request.url

                      if API_PREFIX not in url:
                          return

                      headers = request.all_headers()

                      safe_headers = {}

                      for key, value in headers.items():

                          lower = key.lower()

                          if lower in (
                              "authorization",
                              "x-api-key",
                              "x-session-token",
                              "cookie",
                          ):
                              safe_headers[key] = (
                                  "[PRESENTE]"
                              )

                          else:
                              safe_headers[key] = value

                      item = {
                          "method": request.method,
                          "url": url,
                          "headers": safe_headers,
                      }

                      post_data = request.post_data

                      if post_data:

                          try:
                              item["post_data"] = (
                                  json.loads(
                                      post_data
                                  )
                              )

                          except Exception:
                              item["post_data"] = (
                                  post_data[:30000]
                              )

                      captured_requests.append(
                          item
                      )

                      log("")
                      log(
                          "========================================"
                      )
                      log(
                          "API VOLOTEA INTERCETTATA"
                      )
                      log(
                          "========================================"
                      )

                      log(
                          f"METHOD: "
                          f"{request.method}"
                      )

                      log(
                          f"URL: "
                          f"{url}"
                      )

                      dump_json(
                          "HEADER:",
                          safe_headers,
                          20000,
                      )

                      if "post_data" in item:
                          dump_json(
                              "PAYLOAD:",
                              item["post_data"],
                              30000,
                          )


                  # ====================================================
                  # NETWORK RESPONSE
                  # ====================================================

                  def handle_response(response):

                      url = response.url

                      if API_PREFIX not in url:
                          return

                      item = {
                          "status": response.status,
                          "url": url,
                      }

                      try:
                          body = response.body()

                          item["size"] = len(body)

                          content_type = (
                              response.headers.get(
                                  "content-type",
                                  "",
                              )
                          )

                          item[
                              "content_type"
                          ] = content_type

                          if (
                              "json"
                              in content_type.lower()
                          ):

                              try:
                                  item["json"] = (
                                      json.loads(
                                          body
                                      )
                                  )

                              except Exception:
                                  pass

                      except Exception as exc:
                          item["error"] = repr(exc)

                      captured_responses.append(
                          item
                      )

                      log("")
                      log(
                          "========================================"
                      )
                      log(
                          "RISPOSTA API VOLOTEA"
                      )
                      log(
                          "========================================"
                      )

                      log(
                          f"HTTP STATUS: "
                          f"{response.status}"
                      )

                      log(
                          f"URL: "
                          f"{url}"
                      )

                      log(
                          f"SIZE: "
                          f"{item.get('size', 0)} bytes"
                      )

                      if "json" in item:
                          dump_json(
                              "RISPOSTA JSON:",
                              item["json"],
                              30000,
                          )


                  page.on(
                      "request",
                      handle_request,
                  )

                  page.on(
                      "response",
                      handle_response,
                  )

                  # ====================================================
                  # OPEN
                  # ====================================================

                  log("")
                  log(
                      f"Apertura: {BOOKING_URL}"
                  )

                  try:

                      page.goto(
                          BOOKING_URL,
                          wait_until="domcontentloaded",
                          timeout=90000,
                      )

                  except Exception as exc:

                      log("")
                      log(
                          "ATTENZIONE apertura "
                          "frontend:"
                      )

                      log(repr(exc))

                  log("")
                  log(
                      "Attesa inizializzazione "
                      "frontend: 10 secondi"
                  )

                  page.wait_for_timeout(
                      10000
                  )

                  log("")
                  log(
                      f"URL finale: "
                      f"{page.url}"
                  )

                  log(
                      f"Titolo: "
                      f"{page.title()}"
                  )

                  # ====================================================
                  # COOKIE
                  # ====================================================

                  log("")
                  log("3. GESTIONE COOKIE")
                  log("----------------------------------------")

                  cookie_selectors = [
                      "button:has-text('Aceptar sólo las esenciales')",
                      "button:has-text('Accept only necessary')",
                      "button:has-text('Accetta solo i necessari')",
                      "button:has-text('Accept essential only')",
                      "button[aria-label*='necessary']",
                      "button[aria-label*='essenziali']",
                  ]

                  cookie_closed = False

                  for selector in cookie_selectors:

                      try:

                          locator = page.locator(
                              selector
                          ).first

                          if locator.count() == 0:
                              continue

                          if not locator.is_visible():
                              continue

                          log(
                              f"Cookie banner trovato: "
                              f"{selector}"
                          )

                          if safe_click(
                              locator,
                              "Chiusura cookie",
                          ):

                              cookie_closed = True

                              page.wait_for_timeout(
                                  1500
                              )

                              break

                      except Exception:
                          pass

                  if not cookie_closed:
                      log(
                          "Cookie banner non rilevato "
                          "o già chiuso."
                      )

                  # ====================================================
                  # FORM PRIMA DEL CLICK
                  # ====================================================

                  inspect_visible_inputs(
                      page,
                      "4. FORM PRIMA DEL CLICK",
                  )

                  # ====================================================
                  # TEST CLICK
                  # ====================================================

                  success = test_origin_click(
                      page
                  )

                  # ====================================================
                  # SCREENSHOT FINALE
                  # ====================================================

                  try:

                      page.screenshot(
                          path="/tmp/volotea-final.png",
                          full_page=True,
                      )

                      log("")
                      log(
                          "Screenshot finale salvato."
                      )

                  except Exception as exc:

                      log(
                          f"Screenshot finale "
                          f"non disponibile: {exc}"
                      )

                  # ====================================================
                  # NETWORK SUMMARY
                  # ====================================================

                  log("")
                  log("NETWORK SUMMARY")
                  log("========================================")

                  log(
                      f"Richieste API Volotea: "
                      f"{len(captured_requests)}"
                  )

                  log(
                      f"Risposte API Volotea: "
                      f"{len(captured_responses)}"
                  )

                  # ====================================================
                  # RISULTATO
                  # ====================================================

                  log("")
                  log("RISULTATO TEST")
                  log("========================================")

                  if success:

                      log(
                          "CLICK SUL CAMPO ORIGINE "
                          "ESEGUITO."
                      )

                      log(
                          "Analisi del DOM completata."
                      )

                  else:

                      log(
