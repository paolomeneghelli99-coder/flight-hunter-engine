                  # ==================================================
                  # REQUEST INTERCEPTION
                  # ==================================================

                  def handle_request(request):

                      url = request.url

                      if API_PREFIX not in url:
                          return

                      headers = (
                          request.all_headers()
                      )

                      safe_headers = {}

                      for key, value in headers.items():

                          lower = key.lower()

                          if lower in (
                              "authorization",
                              "x-api-key",
                              "x-session-token",
                              "cookie",
                          ):
                              safe_headers[key] = (
                                  "[PRESENTE]"
                              )

                          else:
                              safe_headers[key] = value

                      item = {
                          "method":
                              request.method,
                          "url":
                              url,
                          "headers":
                              safe_headers,
                      }

                      post_data = (
                          request.post_data
                      )

                      if post_data:

                          try:
                              item["post_data"] = (
                                  json.loads(
                                      post_data
                                  )
                              )

                          except Exception:
                              item["post_data"] = (
                                  post_data[:30000]
                              )

                      captured_requests.append(
                          item
                      )

                      log("")
                      log(
                          "========================================"
                      )

                      log(
                          "API VOLOTEA INTERCETTATA"
                      )

                      log(
                          "========================================"
                      )

                      log(
                          f"METHOD: "
                          f"{request.method}"
                      )

                      log(
                          f"URL: "
                          f"{url}"
                      )

                      dump_json(
                          "HEADER:",
                          safe_headers,
                          20000,
                      )

                      if "post_data" in item:
                          dump_json(
                              "PAYLOAD:",
                              item["post_data"],
                              30000,
                          )
                      else:
                          log("")
                          log("PAYLOAD:")
                          log(
                              "Payload non disponibile."
                          )

                  # ==================================================
                  # RESPONSE INTERCEPTION
                  # ==================================================

                  def handle_response(response):

                      url = response.url

                      if API_PREFIX not in url:
                          return

                      item = {
                          "status":
                              response.status,
                          "url":
                              url,
                      }

                      try:

                          body = response.body()

                          item["size"] = len(
                              body
                          )

                          content_type = (
                              response.headers.get(
                                  "content-type",
                                  "",
                              )
                          )

                          item[
                              "content_type"
                          ] = content_type

                          if (
                              "json"
                              in content_type.lower()
                          ):

                              try:
                                  item["json"] = (
                                      json.loads(
                                          body
                                      )
                                  )

                              except Exception:
                                  pass

                      except Exception as exc:

                          item["error"] = (
                              repr(exc)
                          )

                      captured_responses.append(
                          item
                      )

                      log("")
                      log(
                          "========================================"
                      )

                      log(
                          "RISPOSTA API VOLOTEA"
                      )

                      log(
                          "========================================"
                      )

                      log(
                          f"HTTP STATUS: "
                          f"{response.status}"
                      )

                      log(
                          f"URL: "
                          f"{url}"
                      )

                      log(
                          f"SIZE: "
                          f"{item.get('size', 0)} bytes"
                      )

                      if "json" in item:

                          dump_json(
                              "RISPOSTA JSON:",
                              item["json"],
                              30000,
                          )

                  page.on(
