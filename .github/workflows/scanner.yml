name: Flight Hunter Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Test Volotea real search
        env:
          VOLOTEA_API_KEY: ${{ secrets.VOLOTEA_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "TEST VOLOTEA - RICERCA REALE"
          echo "========================================"

          cat > /tmp/test_volotea.py <<'PYTHON'
          import json
          import os
          import sys
          from datetime import date, timedelta

          import requests
          from playwright.sync_api import sync_playwright


          STATIONS_URL = (
              "https://json.volotea.com/"
              "dist/stations/stations.json"
          )

          BOOKING_URL = "https://book.volotea.com/"

          SEARCH_PATH = "/api/spa/voe/v1/flights/search"

          ORIGIN = "VRN"
          DESTINATION = "CTA"

          USER_AGENT = (
              "Mozilla/5.0 "
              "(Linux; Android 6.0; Nexus 5 Build/MRA58N) "
              "AppleWebKit/537.36 "
              "(KHTML, like Gecko) "
              "Chrome/147.0.0.0 "
              "Mobile Safari/537.36"
          )


          def log(message=""):
              print(message, flush=True)


          def dump_json(label, data, limit=30000):
              log("")
              log(label)
              log("----------------------------------------")

              try:
                  text = json.dumps(
                      data,
                      indent=2,
                      ensure_ascii=False,
                  )
              except Exception:
                  text = str(data)

              if len(text) > limit:
                  text = text[:limit] + "\n...[TRONCATO]..."

              log(text)


          def get_visible_locator(page, selectors):
              """
              Cerca ogni volta il campo nel DOM corrente.
              Non conserva locator potenzialmente diventati stale.
              """

              for selector in selectors:
                  try:
                      locator = page.locator(selector).filter(
                          visible=True
                      ).first

                      if locator.count() > 0:
                          return locator

                  except Exception:
                      pass

              return None


          def focus_input(page, locator, description):
              """
              Tenta di portare il focus sul campo.
              Prima prova il DOM, poi click forzato.
              """

              if locator is None:
                  log(
                      f"{description}: locator non disponibile."
                  )
                  return False

              try:
                  locator.evaluate(
                      """
                      el => {
                          el.scrollIntoView({
                              block: "center",
                              inline: "center"
                          });
                          el.focus();
                      }
                      """
                  )

                  log(
                      f"{description}: focus DOM riuscito."
                  )

                  return True

              except Exception as exc:

                  log(
                      f"{description}: focus DOM fallito."
                  )

                  log(repr(exc))


              try:
                  locator.click(
                      timeout=5000,
                      force=True,
                  )

                  log(
                      f"{description}: click forzato riuscito."
                  )

                  return True

              except Exception as exc:

                  log(
                      f"{description}: click forzato fallito."
                  )

                  log(repr(exc))


              return False


          def clear_and_type(
              page,
              selectors,
              value,
              description,
          ):
              """
              Ricerca nuovamente il campo immediatamente
              prima della compilazione.
              """

              locator = get_visible_locator(
                  page,
                  selectors,
              )

              if locator is None:

                  log(
                      f"{description}: campo non trovato."
                  )

                  return False


              log(
                  f"{description}: campo individuato."
              )


              if not focus_input(
                  page,
                  locator,
                  description,
              ):
                  return False


              try:

                  page.keyboard.press(
                      "Control+A"
                  )

                  page.keyboard.press(
                      "Backspace"
                  )

                  page.keyboard.type(
                      value,
                      delay=100,
                  )

                  log(
                      f"{description}: "
                      f"valore '{value}' digitato."
                  )

                  return True

              except Exception as exc:

                  log(
                      f"{description}: "
                      "errore digitazione:"
                  )

                  log(repr(exc))

                  return False


          def inspect_visible_text(page, terms):

              for term in terms:

                  try:

                      locator = page.get_by_text(
                          term,
                          exact=False,
                      )

                      count = locator.count()

                      if count == 0:
                          continue

                      log(
                          f"Testo '{term}': "
                          f"{count} elemento/i."
                      )

                      shown = 0

                      for index in range(
                          min(count, 30)
                      ):

                          element = locator.nth(
                              index
                          )

                          try:

                              if not element.is_visible():
                                  continue

                              text = (
                                  element.inner_text()
                                  .strip()
                              )

                              if text:

                                  log(
                                      f"  [{shown}] "
                                      f"{text[:300]}"
                                  )

                                  shown += 1

                          except Exception:
                              pass

                  except Exception:
                      pass


          def select_airport(
              page,
              code,
              city,
              description,
          ):

              log("")
              log(description)
              log("----------------------------------------")


              selectors = [
                  "[role='option']",
                  "[role='listbox'] [role='option']",
                  "li",
                  "[class*='option']",
                  "[class*='suggestion']",
                  "[class*='autocomplete'] li",
              ]


              candidates = []


              for selector in selectors:

                  try:

                      locator = page.locator(
                          selector
                      )

                      count = locator.count()


                      for index in range(
                          min(count, 100)
                      ):

                          element = locator.nth(
                              index
                          )

                          try:

                              if not element.is_visible():
                                  continue

                              text = (
                                  element.inner_text()
                                  .strip()
                              )

                              if not text:
                                  continue

                              upper = text.upper()


                              if (
                                  code.upper() in upper
                                  or city.upper() in upper
                              ):

                                  candidates.append(
                                      element
                                  )

                          except Exception:
                              pass

                  except Exception:
                      pass


              log(
                  f"Candidati trovati per {code}: "
                  f"{len(candidates)}"
              )


              for index, candidate in enumerate(
                  candidates[:30]
              ):

                  try:

                      text = (
                          candidate.inner_text()
                          .strip()
                      )

                      log(
                          f"Candidato {index}: "
                          f"{text[:300]}"
                      )


                      try:

                          candidate.click(
                              timeout=3000
                          )

                          log(
                              f"{code}: "
                              "click normale riuscito."
                          )

                          page.wait_for_timeout(
                              1200
                          )

                          return True

                      except Exception:

                          candidate.click(
                              timeout=3000,
                              force=True,
                          )

                          log(
                              f"{code}: "
                              "click forzato riuscito."
                          )

                          page.wait_for_timeout(
                              1200
                          )

                          return True

                  except Exception:
                      pass


              log(
                  f"{code}: nessun candidato "
                  "cliccabile."
              )


              # Prova tastiera
              try:

                  page.keyboard.press(
                      "ArrowDown"
                  )

                  page.wait_for_timeout(
                      300
                  )

                  page.keyboard.press(
                      "Enter"
                  )

                  page.wait_for_timeout(
                      1200
                  )

                  log(
                      f"{code}: "
                      "selezione tastiera eseguita."
                  )

                  return True

              except Exception as exc:

                  log(
                      f"{code}: "
                      "selezione tastiera fallita:"
                  )

                  log(repr(exc))


              return False


          def main():

              # ==================================================
              # 1. DOWNLOAD STATIONS
              # ==================================================

              log("")
              log("1. DOWNLOAD STATIONS")
              log("----------------------------------------")


              try:

                  response = requests.get(
                      STATIONS_URL,
                      timeout=60,
                      headers={
                          "User-Agent": USER_AGENT,
                          "Accept": "application/json",
                          "Accept-Language":
                              "it-IT,it;q=0.9,en;q=0.8",
                      },
                  )


                  log(
                      f"HTTP status: "
                      f"{response.status_code}"
                  )


                  response.raise_for_status()


                  stations = response.json()


              except Exception as exc:

                  log("")
                  log(
                      "ERRORE DOWNLOAD STATIONS"
                  )

                  log(repr(exc))

                  return 1


              if not isinstance(
                  stations,
                  dict,
              ):

                  log(
                      "ERRORE: stations.json "
                      "non è un dizionario."
                  )

                  return 1


              log(
                  f"Stazioni presenti: "
                  f"{len(stations)}"
              )


              if ORIGIN not in stations:

                  log(
                      f"ERRORE: {ORIGIN} "
                      "non trovato."
                  )

                  return 1


              origin_data = stations[
                  ORIGIN
              ]


              markets = (
                  origin_data.get("Markets")
                  or {}
              )


              log(
                  f"Mercati {ORIGIN}: "
                  f"{len(markets)}"
              )


              if DESTINATION not in markets:

                  log(
                      f"ERRORE: {DESTINATION} "
                      "non presente nei Markets "
                      f"di {ORIGIN}."
                  )

                  return 1


              market = markets[
                  DESTINATION
              ]


              log("")
              log(
                  f"{ORIGIN} -> {DESTINATION}"
              )
              log("----------------------------------------")


              log(
                  f"Enabled: "
                  f"{market.get('Enabled')}"
              )


              log(
                  f"FlightType: "
                  f"{market.get('FlightType')}"
              )


              log(
                  f"MinFlightDate: "
                  f"{market.get('MinFlightDate')}"
              )


              log(
                  f"MaxFlightDate: "
                  f"{market.get('MaxFlightDate')}"
              )


              if not market.get("Enabled"):

                  log(
                      "ERRORE: tratta non abilitata."
                  )

                  return 1


              min_date = market.get(
                  "MinFlightDate"
              )

              max_date = market.get(
                  "MaxFlightDate"
              )


              test_date = (
                  date.today()
                  + timedelta(days=1)
              )


              if min_date:

                  test_date = max(
                      test_date,
                      date.fromisoformat(
                          min_date
                      ),
                  )


              if max_date:

                  max_date_obj = (
                      date.fromisoformat(
                          max_date
                      )
                  )


                  if test_date > max_date_obj:

                      log(
                          "ERRORE: nessuna data "
                          "valida disponibile."
                      )

                      return 1


              departure_date = (
                  test_date.isoformat()
              )


              log("")
              log(
                  "RICERCA DI TEST"
              )
              log("----------------------------------------")


              log(
                  f"Origine:      {ORIGIN}"
              )

              log(
                  f"Destinazione: {DESTINATION}"
              )

              log(
                  f"Data:         {departure_date}"
              )

              log(
                  "Tipo:         SOLO ANDATA"
              )

              log(
                  "Passeggeri:   1"
              )


              # ==================================================
              # 2. BROWSER
              # ==================================================

              log("")
              log(
                  "2. APERTURA FRONTEND VOLOTEA"
              )
              log("----------------------------------------")


              api_key = os.environ.get(
                  "VOLOTEA_API_KEY",
                  "",
              ).strip()


              if api_key:

                  log(
                      "VOLOTEA_API_KEY: configurata"
                  )

              else:

                  log(
                      "VOLOTEA_API_KEY: "
                      "non configurata"
                  )


              captured_requests = []
              captured_responses = []


              with sync_playwright() as p:

                  browser = p.chromium.launch(
                      headless=True
                  )


                  context = browser.new_context(
                      locale="it-IT",
                      user_agent=USER_AGENT,
                      viewport={
                          "width": 1366,
                          "height": 900,
                      },
                      extra_http_headers={
                          "Accept-Language":
                              "it-IT,it;q=0.9,en;q=0.8",
                      },
                  )


                  page = context.new_page()


                  # ==================================================
                  # REQUEST INTERCEPTION
                  # ==================================================

                  def handle_request(
                      request
                  ):

                      url = request.url


                      if SEARCH_PATH not in url:
                          return


                      headers = (
                          request.all_headers()
                      )


                      safe_headers = {}


                      for key, value in headers.items():

                          lower = key.lower()


                          if lower in (
                              "authorization",
                              "x-api-key",
                              "x-session-token",
                              "cookie",
                          ):

                              safe_headers[key] = (
                                  "[PRESENTE]"
                              )

                          else:

                              safe_headers[key] = value


                      item = {
                          "method":
                              request.method,
                          "url":
                              url,
                          "headers":
                              safe_headers,
                      }


                      post_data = (
                          request.post_data
                      )


                      if post_data:

                          try:

                              item["post_data"] = (
                                  json.loads(
                                      post_data
                                  )
                              )

                          except Exception:

                              item["post_data"] = (
                                  post_data[:30000]
                              )


                      captured_requests.append(
                          item
                      )


                      log("")
                      log(
                          "========================================"
                      )
                      log(
                          "FLIGHTS/SEARCH INTERCETTATA"
                      )
                      log(
                          "========================================"
                      )


                      log(
                          f"METHOD: "
                          f"{request.method}"
                      )


                      log(
                          f"URL: "
                          f"{url}"
                      )


                      dump_json(
                          "HEADER:",
                          safe_headers,
                          20000,
                      )


                      if "post_data" in item:

                          dump_json(
                              "PAYLOAD:",
                              item["post_data"],
                              30000,
                          )

                      else:

                          log("")
                          log("PAYLOAD:")
                          log(
                              "Payload non disponibile."
                          )


                  # ==================================================
                  # RESPONSE INTERCEPTION
                  # ==================================================

                  def handle_response(
                      response
                  ):

                      url = response.url


                      if SEARCH_PATH not in url:
                          return


                      item = {
                          "status":
                              response.status,
                          "url":
                              url,
                      }


                      try:

                          body = response.body()


                          item["size"] = len(
                              body
                          )


                          content_type = (
                              response.headers.get(
                                  "content-type",
                                  "",
                              )
                          )


                          item[
                              "content_type"
                          ] = content_type


                          if (
                              "json"
                              in content_type.lower()
                          ):

                              try:

                                  item["json"] = (
                                      json.loads(
                                          body
                                      )
                                  )

                              except Exception:
                                  pass


                      except Exception as exc:

                          item["error"] = repr(
                              exc
                          )


                      captured_responses.append(
                          item
                      )


                      log("")
                      log(
                          "========================================"
                      )
                      log(
                          "RISPOSTA FLIGHTS/SEARCH"
                      )
                      log(
                          "========================================"
                      )


                      log(
                          f"HTTP STATUS: "
                          f"{response.status}"
                      )


                      log(
                          f"URL: "
                          f"{url}"
                      )


                      log(
                          f"SIZE: "
                          f"{item.get('size', 0)} bytes"
                      )


                      if "json" in item:

                          dump_json(
                              "RISPOSTA JSON:",
                              item["json"],
                              30000,
                          )


                  page.on(
                      "request",
                      handle_request
                  )

                  page.on(
                      "response",
                      handle_response
                  )


                  # ==================================================
                  # 3. APERTURA
                  # ==================================================

                  log("")
                  log(
                      f"Apertura: {BOOKING_URL}"
                  )


                  try:

                      page.goto(
                          BOOKING_URL,
                          wait_until="domcontentloaded",
                          timeout=90000,
                      )

                  except Exception as exc:

                      log("")
                      log(
                          "ATTENZIONE apertura "
                          "frontend:"
                      )

                      log(repr(exc))


                  page.wait_for_timeout(
                      8000
                  )


                  log("")
                  log(
                      f"URL finale: {page.url}"
                  )


                  log(
                      f"Titolo: {page.title()}"
                  )


                  # ==================================================
                  # 4. COOKIE
                  # ==================================================

                  log("")
                  log(
                      "3. GESTIONE COOKIE"
                  )
                  log("----------------------------------------")


                  cookie_selectors = [
                      "button:has-text('Aceptar sólo las esenciales')",
                      "button:has-text('Accept only necessary')",
                      "button:has-text('Accetta solo i necessari')",
                      "button:has-text('Accept essential only')",
                      "button[aria-label*='necessary']",
                      "button[aria-label*='essenziali']",
                  ]


                  cookie_closed = False


                  for selector in cookie_selectors:

                      try:

                          locator = page.locator(
                              selector
                          ).first


                          if locator.count() == 0:
                              continue


                          if not locator.is_visible():
                              continue


                          log(
                              f"Cookie banner trovato: "
                              f"{selector}"
                          )


                          try:

                              locator.click(
                                  timeout=3000
                              )

                          except Exception:

                              locator.click(
                                  timeout=3000,
                                  force=True,
                              )


                          cookie_closed = True


                          page.wait_for_timeout(
                              1500
                          )


                          log(
                              "Cookie banner chiuso."
                          )


                          break

                      except Exception:
                          pass


                  if not cookie_closed:

                      log(
                          "Cookie banner non rilevato "
                          "o già chiuso."
                      )


                  # ==================================================
                  # 5. FORM VISIBILE
                  # ==================================================

                  log("")
                  log(
                      "4. ANALISI FORM VISIBILE"
                  )
                  log("----------------------------------------")


                  visible_inputs = page.locator(
                      "input:visible"
                  ).all()


                  log(
                      f"Input visibili: "
                      f"{len(visible_inputs)}"
                  )


                  for index, element in enumerate(
                      visible_inputs[:40]
                  ):

                      try:

                          attrs = element.evaluate(
                              """
                              el => ({
                                  type: el.type,
                                  name: el.name,
                                  id: el.id,
                                  placeholder:
                                      el.placeholder,
                                  value:
                                      el.value,
                                  aria:
                                      el.getAttribute(
                                          "aria-label"
                                      )
                              })
                              """
                          )


                          log(
                              f"VISIBLE INPUT {index}: "
                              + json.dumps(
                                  attrs,
                                  ensure_ascii=False,
                              )
                          )


                      except Exception:
                          pass


                  # ==================================================
                  # 6. LOCATOR SELECTORS
                  # ==================================================

                  origin_selectors = [
                      "#input-text_sf-origin",
                      "input[name*='origin']",
                      "input[id*='origin']",
                      "input[placeholder*='Partenza']",
                      "input[placeholder*='partenza']",
                      "input[aria-label*='Partenza']",
                      "input[aria-label*='partenza']",
                  ]


                  destination_selectors = [
                      "#input-text_sf-destination",
                      "input[name*='destination']",
                      "input[id*='destination']",
                      "input[placeholder*='Arrivo']",
                      "input[placeholder*='arrivo']",
                      "input[aria-label*='Arrivo']",
                      "input[aria-label*='arrivo']",
                  ]


                  # ==================================================
                  # 7. PARTENZA
                  # ==================================================

                  log("")
                  log(
                      "5. COMPILAZIONE PARTENZA"
                  )
                  log("----------------------------------------")


                  if not clear_and_type(
                      page,
                      origin_selectors,
                      ORIGIN,
                      "Campo partenza",
                  ):

                      log(
                          "ERRORE: impossibile "
                          "compilare VRN."
                      )


                      page.screenshot(
                          path="/tmp/volotea-origin-error.png",
                          full_page=True,
                      )


                      browser.close()


                      return 1


                  page.wait_for_timeout(
                      2000
                  )


                  inspect_visible_text(
                      page,
                      [
                          "VRN",
                          "Verona",
                          "Italy",
                      ],
                  )


                  # ==================================================
                  # 8. SELEZIONE PARTENZA
                  # ==================================================

                  if not select_airport(
                      page,
                      ORIGIN,
                      "Verona",
                      "6. SELEZIONE PARTENZA",
                  ):

                      log(
                          "ATTENZIONE: selezione "
                          "automatica VRN non confermata."
                      )


                  page.wait_for_timeout(
                      1500
                  )


                  # ==================================================
                  # 9. NUOVA RICERCA DESTINAZIONE
                  # ==================================================

                  log("")
                  log(
                      "7. RICERCA CAMPO DESTINAZIONE "
                      "DOPO SELEZIONE VRN"
                  )
                  log("----------------------------------------")


                  destination_field = (
                      get_visible_locator(
                          page,
                          destination_selectors,
                      )
                  )


                  if destination_field is None:

                      log(
                          "ERRORE: campo destinazione "
                          "non trovato dopo la selezione VRN."
                      )


                      log("")
                      log(
                          "INPUT VISIBILI DOPO VRN:"
                      )


                      visible_inputs = page.locator(
                          "input:visible"
                      ).all()


                      for index, element in enumerate(
                          visible_inputs[:40]
                      ):

                          try:

                              attrs = element.evaluate(
                                  """
                                  el => ({
                                      type: el.type,
                                      name: el.name,
                                      id: el.id,
                                      placeholder:
                                          el.placeholder,
                                      value:
                                          el.value,
                                      aria:
                                          el.getAttribute(
                                              "aria-label"
                                          )
                                  })
                                  """
                              )


                              log(
                                  f"POST-VRN INPUT {index}: "
                                  + json.dumps(
                                      attrs,
                                      ensure_ascii=False,
                                  )
                              )

                          except Exception:
                              pass


                      page.screenshot(
                          path="/tmp/volotea-destination-not-found.png",
                          full_page=True,
                      )


                      browser.close()


                      return 1


                  log(
                      "Campo destinazione "
                      "nuovamente individuato."
                  )


                  # ==================================================
                  # 10. DESTINAZIONE
                  # ==================================================

                  log("")
                  log(
                      "8. COMPILAZIONE DESTINAZIONE"
                  )
                  log("----------------------------------------")


                  if not clear_and_type(
                      page,
                      destination_selectors,
                      DESTINATION,
                      "Campo destinazione",
                  ):

                      log(
                          "ERRORE: impossibile "
                          "compilare CTA."
                      )


                      page.screenshot(
                          path="/tmp/volotea-destination-fill-error.png",
                          full_page=True,
                      )


                      browser.close()


                      return 1


                  page.wait_for_timeout(
                      2000
                  )


                  inspect_visible_text(
                      page,
                      [
                          "CTA",
                          "Catania",
                          "Italy",
                      ],
                  )


                  # ==================================================
                  # 11. SELEZIONE DESTINAZIONE
                  # ==================================================

                  if not select_airport(
                      page,
                      DESTINATION,
                      "Catania",
                      "9. SELEZIONE DESTINAZIONE",
                  ):

                      log(
                          "ATTENZIONE: selezione "
                          "automatica CTA non confermata."
                      )


                  page.wait_for_timeout(
                      1500
                  )


                  # ==================================================
                  # 12. DATA
                  # ==================================================

                  log("")
                  log(
                      "10. RICERCA CAMPO DATA"
                  )
                  log("----------------------------------------")


                  departure_selectors = [
                      "#input-text_sf-departure",
                      "input[name*='departure']",
                      "input[id*='departure']",
