name: Flight Hunter Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

jobs:
  scanner:
    name: Flight Hunter Scanner
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      # ============================================================
      # DIPENDENZE
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "INSTALLAZIONE DIPENDENZE"
          echo "========================================"

          python --version
          python -m pip --version

          python -m pip install --upgrade pip

          python -m pip install -r requirements.txt

          echo ""
          echo "Installazione Chromium per Playwright..."

          python -m playwright install --with-deps chromium

          echo ""
          echo "Dipendenze installate correttamente."


      # ============================================================
      # TEST VOLOTEA
      # ============================================================

      - name: Test Volotea
        shell: bash
        env:
          VOLOTEA_API_KEY: ${{ secrets.VOLOTEA_API_KEY }}
        run: |
          set -e

          echo "========================================"
          echo "TEST VOLOTEA"
          echo "========================================"

          if [ ! -f "scanners/volotea.py" ]; then
            echo ""
            echo "ERRORE: scanners/volotea.py non trovato."
            echo ""
            echo "Contenuto della cartella scanners:"
            find scanners -maxdepth 2 -type f -print
            exit 1
          fi

          echo ""
          echo "Esecuzione:"
          echo "python -u scanners/volotea.py"
          echo ""

          python -u scanners/volotea.py

          EXIT_CODE=$?

          echo ""
          echo "========================================"
          echo "CODICE USCITA TEST VOLOTEA: $EXIT_CODE"
          echo "========================================"

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo ""
            echo "ATTENZIONE:"
            echo "Il test Volotea ha restituito un errore."
            echo "Il workflow viene comunque interrotto."
            exit "$EXIT_CODE"
          fi

          echo ""
          echo "TEST VOLOTEA TERMINATO."


      # ============================================================
      # AUTENTICAZIONE FLIGHT HUNTER
      # ============================================================

      - name: Get Flight Hunter access token
        id: auth
        shell: bash
        env:
          FH_BACKEND_URL: ${{ secrets.FH_BACKEND_URL }}
          FH_PUBLISHABLE_KEY: ${{ secrets.FH_PUBLISHABLE_KEY }}
          FH_EMAIL: ${{ secrets.FH_EMAIL }}
          FH_PASSWORD: ${{ secrets.FH_PASSWORD }}
        run: |
          set -e

          echo "========================================"
          echo "AUTENTICAZIONE FLIGHT HUNTER"
          echo "========================================"

          if [ -z "$FH_BACKEND_URL" ]; then
            echo "ERRORE: FH_BACKEND_URL mancante."
            exit 1
          fi

          if [ -z "$FH_PUBLISHABLE_KEY" ]; then
            echo "ERRORE: FH_PUBLISHABLE_KEY mancante."
            exit 1
          fi

          if [ -z "$FH_EMAIL" ]; then
            echo "ERRORE: FH_EMAIL mancante."
            exit 1
          fi

          if [ -z "$FH_PASSWORD" ]; then
            echo "ERRORE: FH_PASSWORD mancante."
            exit 1
          fi

          AUTH_URL="${FH_BACKEND_URL%/}/auth/v1/token?grant_type=password"

          echo ""
          echo "Endpoint autenticazione:"
          echo "$AUTH_URL"

          RESPONSE_FILE="$(mktemp)"

          HTTP_CODE=$(
            curl \
              --silent \
              --show-error \
              --output "$RESPONSE_FILE" \
              --write-out "%{http_code}" \
              --request POST \
              --header "apikey: ${FH_PUBLISHABLE_KEY}" \
              --header "Authorization: Bearer ${FH_PUBLISHABLE_KEY}" \
              --header "Content-Type: application/json" \
              --data "$(python - <<'PY'
import json
import os

print(
    json.dumps(
        {
            "email": os.environ["FH_EMAIL"],
            "password": os.environ["FH_PASSWORD"],
        }
    )
)
PY
)" \
              "$AUTH_URL"
          )

          echo ""
          echo "HTTP status autenticazione: $HTTP_CODE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo ""
            echo "ERRORE AUTENTICAZIONE"
            echo ""
            echo "Risposta server:"
            cat "$RESPONSE_FILE"
            echo ""

            rm -f "$RESPONSE_FILE"

            exit 1
          fi

          ACCESS_TOKEN=$(
            python - "$RESPONSE_FILE" <<'PY'
import json
import sys

filename = sys.argv[1]

with open(
    filename,
    "r",
    encoding="utf-8"
) as f:
    data = json.load(f)

token = data.get("access_token")

if not token:
    raise SystemExit(
        "access_token non presente "
        "nella risposta di autenticazione"
    )

print(token)
PY
          )

          rm -f "$RESPONSE_FILE"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERRORE: token vuoto."
            exit 1
          fi

          echo ""
          echo "Autenticazione completata."
          echo "Token ottenuto: SI"

          echo "::add-mask::$ACCESS_TOKEN"

          echo "FH_ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"


      # ============================================================
      # ESECUZIONE FLIGHT HUNTER
      # ============================================================

      - name: Run Flight Hunter Scanner
        shell: bash
        env:
          FH_IMPORT_URL: ${{ secrets.FH_IMPORT_URL }}
          FH_ACCESS_TOKEN: ${{ env.FH_ACCESS_TOKEN }}
          FH_BACKEND_URL: ${{ secrets.FH_BACKEND_URL }}
          FH_PUBLISHABLE_KEY: ${{ secrets.FH_PUBLISHABLE_KEY }}
          FH_EMAIL: ${{ secrets.FH_EMAIL }}
          FH_PASSWORD: ${{ secrets.FH_PASSWORD }}
        run: |
          set -o pipefail

          echo "========================================"
          echo "AVVIO FLIGHT HUNTER"
          echo "========================================"

          echo ""
          echo "Esecuzione:"
          echo "python -u main.py"
          echo ""

          python -u main.py 2>&1 | tee flight_hunter.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "CODICE USCITA MAIN.PY: $EXIT_CODE"
          echo "========================================"

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo ""
            echo "========================================"
            echo "ERRORE FLIGHT HUNTER"
            echo "========================================"

            echo ""
            echo "LOG COMPLETO:"
            echo "----------------------------------------"

            cat flight_hunter.log

            echo ""
            echo "----------------------------------------"

            exit "$EXIT_CODE"
          fi

          echo ""
          echo "========================================"
          echo "FLIGHT HUNTER COMPLETATO"
          echo "========================================"


      # ============================================================
      # SALVATAGGIO LOG
      # ============================================================

      - name: Upload scanner log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flight-hunter-log
          path: flight_hunter.log
          if-no-files-found: ignore
