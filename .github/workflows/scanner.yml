name: Flight Hunter Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Test Volotea real search
        env:
          VOLOTEA_API_KEY: ${{ secrets.VOLOTEA_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "TEST VOLOTEA - RICERCA REALE"
          echo "========================================"

          cat > /tmp/test_volotea.py <<'PYTHON'
          import json
          import os
          import sys
          from datetime import date, timedelta

          import requests
          from playwright.sync_api import sync_playwright


          STATIONS_URL = (
              "https://json.volotea.com/"
              "dist/stations/stations.json"
          )

          BOOKING_URL = "https://book.volotea.com/"

          SEARCH_PATH = "/api/spa/voe/v1/flights/search"

          ORIGIN = "VRN"
          DESTINATION = "CTA"

          USER_AGENT = (
              "Mozilla/5.0 "
              "(Linux; Android 6.0; Nexus 5 Build/MRA58N) "
              "AppleWebKit/537.36 "
              "(KHTML, like Gecko) "
              "Chrome/147.0.0.0 "
              "Mobile Safari/537.36"
          )


          def log(message=""):
              print(message, flush=True)


          def main():

              # ==================================================
              # 1. STATIONS
              # ==================================================

              log("")
              log("1. DOWNLOAD STATIONS")
              log("----------------------------------------")

              try:
                  response = requests.get(
                      STATIONS_URL,
                      timeout=60,
                      headers={
                          "User-Agent": USER_AGENT,
                          "Accept": "application/json",
                          "Accept-Language":
                              "it-IT,it;q=0.9,en;q=0.8",
                      },
                  )

                  log(
                      f"HTTP status: "
                      f"{response.status_code}"
                  )

                  response.raise_for_status()

                  stations = response.json()

              except Exception as exc:
                  log("")
                  log("ERRORE DOWNLOAD STATIONS")
                  log(repr(exc))
                  return 1


              if not isinstance(stations, dict):
                  log("ERRORE: stations.json non è un dizionario.")
                  return 1


              log(
                  f"Stazioni presenti: "
                  f"{len(stations)}"
              )


              if ORIGIN not in stations:
                  log(
                      f"ERRORE: {ORIGIN} "
                      "non trovato."
                  )
                  return 1


              origin_data = stations[ORIGIN]

              markets = (
                  origin_data.get("Markets")
                  or {}
              )


              log(
                  f"Mercati {ORIGIN}: "
                  f"{len(markets)}"
              )


              if DESTINATION not in markets:
                  log(
                      f"ERRORE: {DESTINATION} "
                      f"non presente nei Markets "
                      f"di {ORIGIN}."
                  )
                  return 1


              market = markets[DESTINATION]


              log("")
              log(
                  f"{ORIGIN} -> {DESTINATION}"
              )
              log("----------------------------------------")

              log(
                  f"Enabled: "
                  f"{market.get('Enabled')}"
              )

              log(
                  f"FlightType: "
                  f"{market.get('FlightType')}"
              )

              log(
                  f"MinFlightDate: "
                  f"{market.get('MinFlightDate')}"
              )

              log(
                  f"MaxFlightDate: "
                  f"{market.get('MaxFlightDate')}"
              )


              if not market.get("Enabled"):
                  log(
                      "ERRORE: tratta non abilitata."
                  )
                  return 1


              min_date = market.get(
                  "MinFlightDate"
              )

              max_date = market.get(
                  "MaxFlightDate"
              )


              test_date = (
                  date.today()
                  + timedelta(days=1)
              )


              if min_date:
                  test_date = max(
                      test_date,
                      date.fromisoformat(
                          min_date
                      ),
                  )


              if max_date:
                  max_date_obj = date.fromisoformat(
                      max_date
                  )

                  if test_date > max_date_obj:
                      log(
                          "ERRORE: nessuna data "
                          "valida disponibile."
                      )
                      return 1


              departure_date = (
                  test_date.isoformat()
              )


              log("")
              log(
                  "RICERCA DI TEST:"
              )
              log(
                  f"  Origine: {ORIGIN}"
              )
              log(
                  f"  Destinazione: {DESTINATION}"
              )
              log(
                  f"  Data: {departure_date}"
              )


              # ==================================================
              # 2. BROWSER
              # ==================================================

              log("")
              log("2. APERTURA FRONTEND VOLOTEA")
              log("----------------------------------------")


              api_key = os.environ.get(
                  "VOLOTEA_API_KEY",
                  "",
              ).strip()


              if api_key:
                  log(
                      "VOLOTEA_API_KEY: configurata"
                  )
              else:
                  log(
                      "VOLOTEA_API_KEY: "
                      "non configurata"
                  )


              captured_requests = []
              captured_responses = []


              with sync_playwright() as p:

                  browser = p.chromium.launch(
                      headless=True
                  )


                  context = browser.new_context(
                      locale="it-IT",
                      user_agent=USER_AGENT,
                      extra_http_headers={
                          "Accept-Language":
                              "it-IT,it;q=0.9,en;q=0.8",
                      },
                  )


                  page = context.new_page()


                  # ==================================================
                  # REQUEST INTERCEPTION
                  # ==================================================

                  def handle_request(request):

                      url = request.url


                      if SEARCH_PATH not in url:
                          return


                      headers = request.all_headers()


                      safe_headers = {}


                      for key, value in headers.items():

                          lower = key.lower()


                          if lower in (
                              "authorization",
                              "x-api-key",
                              "x-session-token",
                              "cookie",
                          ):

                              safe_headers[key] = (
                                  "[PRESENTE]"
                              )

                          else:

                              safe_headers[key] = value


                      item = {
                          "method":
                              request.method,

                          "url":
                              url,

                          "headers":
                              safe_headers,
                      }


                      post_data = request.post_data


                      if post_data:

                          try:
                              item["post_data"] = (
                                  json.loads(
                                      post_data
                                  )
                              )

                          except Exception:

                              item["post_data"] = (
                                  post_data[:10000]
                              )


                      captured_requests.append(
                          item
                      )


                      log("")
                      log(
                          "========================================"
                      )
                      log(
                          "FLIGHTS/SEARCH INTERCETTATA"
                      )
                      log(
                          "========================================"
                      )


                      log(
                          f"METHOD: "
                          f"{request.method}"
                      )

                      log(
                          f"URL: "
                          f"{url}"
                      )


                      log("")
                      log("HEADER:")


                      for key in sorted(
                          safe_headers
                      ):

                          log(
                              f"  {key}: "
                              f"{safe_headers[key]}"
                          )


                      log("")
                      log("PAYLOAD:")


                      if "post_data" in item:

                          try:
                              log(
                                  json.dumps(
                                      item[
                                          "post_data"
                                      ],
                                      indent=2,
                                      ensure_ascii=False,
                                  )
                              )

                          except Exception:

                              log(
                                  str(
                                      item[
                                          "post_data"
                                      ]
                                  )
                              )

                      else:

                          log(
                              "Payload non disponibile."
                          )


                  # ==================================================
                  # RESPONSE INTERCEPTION
                  # ==================================================

                  def handle_response(response):

                      url = response.url


                      if SEARCH_PATH not in url:
                          return


                      item = {
                          "status":
                              response.status,

                          "url":
                              url,
                      }


                      try:

                          body = response.body()

                          item["size"] = len(
                              body
                          )


                          content_type = (
                              response.headers.get(
                                  "content-type",
                                  "",
                              )
                          )


                          item[
                              "content_type"
                          ] = content_type


                          if (
                              "json"
                              in content_type.lower()
                          ):

                              try:

                                  item["json"] = (
                                      json.loads(
                                          body
                                      )
                                  )

                              except Exception:
                                  pass


                      except Exception as exc:

                          item["error"] = repr(
                              exc
                          )


                      captured_responses.append(
                          item
                      )


                      log("")
                      log(
                          "========================================"
                      )
                      log(
                          "RISPOSTA FLIGHTS/SEARCH"
                      )
                      log(
                          "========================================"
                      )


                      log(
                          f"HTTP STATUS: "
                          f"{response.status}"
                      )

                      log(
                          f"URL: "
                          f"{url}"
                      )

                      log(
                          f"SIZE: "
                          f"{item.get('size', 0)} bytes"
                      )


                      if "json" in item:

                          log("")
                          log(
                              "RISPOSTA JSON:"
                          )

                          try:

                              log(
                                  json.dumps(
                                      item["json"],
                                      indent=2,
                                      ensure_ascii=False,
                                  )[
                                      :20000
                                  ]
                              )

                          except Exception:
                              pass


                  page.on(
                      "request",
                      handle_request
                  )

                  page.on(
                      "response",
                      handle_response
                  )


                  # ==================================================
                  # 3. APERTURA
                  # ==================================================

                  log("")
                  log(
                      f"Apertura: "
                      f"{BOOKING_URL}"
                  )


                  try:

                      page.goto(
                          BOOKING_URL,
                          wait_until=(
                              "domcontentloaded"
                          ),
                          timeout=90000,
                      )

                  except Exception as exc:

                      log("")
                      log(
                          "ATTENZIONE apertura "
                          "frontend:"
                      )

                      log(
                          repr(exc)
                      )


                  log("")
                  log(
                      f"URL finale: "
                      f"{page.url}"
                  )


                  page.wait_for_timeout(
                      8000
                  )


                  # ==================================================
                  # 4. ANALISI DOM
                  # ==================================================

                  log("")
                  log(
                      "3. ANALISI PAGINA SEARCH"
                  )
                  log("----------------------------------------")


                  log(
                      f"Titolo pagina: "
                      f"{page.title()}"
                  )


                  log(
                      f"URL: "
                      f"{page.url}"
                  )


                  # ==================================================
                  # 5. ELEMENTI INTERATTIVI
                  # ==================================================

                  log("")
                  log(
                      "ELEMENTI INPUT"
                  )
                  log("----------------------------------------")


                  try:

                      inputs = page.locator(
                          "input"
                      ).all()


                      log(
                          f"Input trovati: "
                          f"{len(inputs)}"
                      )


                      for index, element in enumerate(
                          inputs[:50]
                      ):

                          try:

                              attrs = (
                                  element.evaluate(
                                      """
                                      el => ({
                                          tag: el.tagName,
                                          type: el.type,
                                          name: el.name,
                                          id: el.id,
                                          placeholder:
                                              el.placeholder,
                                          value:
                                              el.value,
                                          aria:
                                              el.getAttribute(
                                                  "aria-label"
                                              )
                                      })
                                      """
                                  )
                              )


                              log(
                                  f"INPUT {index}: "
                                  + json.dumps(
                                      attrs,
                                      ensure_ascii=False,
                                  )
                              )


                          except Exception:
                              pass


                  except Exception as exc:

                      log(
                          "Errore analisi input:"
                      )

                      log(
                          repr(exc)
                      )


                  # ==================================================
                  # 6. ELEMENTI BUTTON
                  # ==================================================

                  log("")
                  log(
                      "ELEMENTI BUTTON"
                  )
                  log("----------------------------------------")


                  try:

                      buttons = page.locator(
                          "button"
                      ).all()


                      log(
                          f"Button trovati: "
                          f"{len(buttons)}"
                      )


                      for index, button in enumerate(
                          buttons[:50]
                      ):

                          try:

                              info = (
                                  button.evaluate(
                                      """
                                      el => ({
                                          text:
                                              el.innerText,
                                          aria:
                                              el.getAttribute(
                                                  "aria-label"
                                              ),
                                          type:
                                              el.type,
                                          disabled:
                                              el.disabled
                                      })
                                      """
                                  )
                              )


                              log(
                                  f"BUTTON {index}: "
                                  + json.dumps(
                                      info,
                                      ensure_ascii=False,
                                  )
                              )


                          except Exception:
                              pass


                  except Exception as exc:

                      log(
                          "Errore analisi button:"
                      )

                      log(
                          repr(exc)
                      )


                  # ==================================================
                  # 7. SCREENSHOT
                  # ==================================================

                  try:

                      page.screenshot(
                          path="/tmp/volotea-search.png",
                          full_page=True,
                      )

                      log("")
                      log(
                          "Screenshot salvato."
                      )

                  except Exception as exc:

                      log(
                          "Screenshot non disponibile:"
                      )

                      log(
                          repr(exc)
                      )


                  # ==================================================
                  # 8. TENTATIVO DI RICERCA
                  # ==================================================

                  log("")
                  log(
                      "4. TENTATIVO RICERCA REALE"
                  )
                  log("----------------------------------------")


                  log(
                      "In questa fase NON inviamo "
                      "manualmente la API."
                  )

                  log(
                      "La ricerca deve essere "
                      "generata dal frontend."
                  )


                  # --------------------------------------------------
                  # Cerchiamo campi tramite label / placeholder
                  # --------------------------------------------------

                  origin_field = None
                  destination_field = None


                  origin_candidates = [
                      "input[placeholder*='Partenza']",
                      "input[placeholder*='partenza']",
                      "input[aria-label*='Partenza']",
                      "input[aria-label*='partenza']",
                      "input[name*='origin']",
                      "input[name*='Origin']",
                      "input[id*='origin']",
                      "input[id*='Origin']",
                  ]


                  destination_candidates = [
                      "input[placeholder*='Arrivo']",
                      "input[placeholder*='arrivo']",
                      "input[aria-label*='Arrivo']",
                      "input[aria-label*='arrivo']",
                      "input[name*='destination']",
                      "input[name*='Destination']",
                      "input[id*='destination']",
                      "input[id*='Destination']",
                  ]


                  for selector in origin_candidates:

                      try:

                          locator = page.locator(
                              selector
                          ).first


                          if locator.count() > 0:

                              origin_field = (
                                  locator
                              )

                              log(
                                  "Campo partenza "
                                  f"trovato: "
                                  f"{selector}"
                              )

                              break

                      except Exception:
                          pass


                  for selector in destination_candidates:

                      try:

                          locator = page.locator(
                              selector
                          ).first


                          if locator.count() > 0:

                              destination_field = (
                                  locator
                              )

                              log(
                                  "Campo arrivo "
                                  f"trovato: "
                                  f"{selector}"
                              )

                              break

                      except Exception:
                          pass


                  # --------------------------------------------------
                  # NON forziamo la ricerca se il DOM non è chiaro.
                  #
                  # Questo test serve soprattutto a identificare
                  # esattamente la struttura del form.
                  # --------------------------------------------------

                  if (
                      origin_field is None
                      or destination_field is None
                  ):

                      log("")
                      log(
                          "FORM NON ANCORA "
                          "AUTOMATIZZABILE."
                      )

                      log(
                          "Il frontend non espone "
                          "i campi con i selettori "
                          "attesi."
                      )

                      log(
                          "NON viene eseguita "
                          "una richiesta API manuale."
                      )

                  else:

                      log("")
                      log(
                          "Campi base individuati."
                      )

                      log(
                          "Tentativo compilazione "
                          "form..."
                      )


                      try:

                          awaitable = None

                          origin_field.click()

                          origin_field.fill(
                              ORIGIN
                          )

                          page.wait_for_timeout(
                              1000
                          )


                          log(
                              "Partenza compilata."
                          )


                      except Exception as exc:

                          log(
                              "Errore compilazione "
                              "partenza:"
                          )

                          log(
                              repr(exc)
                          )


                  # ==================================================
                  # 9. ATTESA
                  # ==================================================

                  log("")
                  log(
                      "Attesa richieste asincrone..."
                  )

                  page.wait_for_timeout(
                      5000
                  )


                  # ==================================================
                  # 10. RISULTATO
                  # ==================================================

                  log("")
                  log(
                      "5. RISULTATO TEST"
                  )
                  log("----------------------------------------")


                  log(
                      "Richieste flights/search: "
                      f"{len(captured_requests)}"
                  )


                  log(
                      "Risposte flights/search: "
                      f"{len(captured_responses)}"
                  )


                  if captured_requests:

                      log("")
                      log(
                          "RISULTATO: "
                          "flights/search intercettata."
                      )

                  else:

                      log("")
                      log(
                          "RISULTATO: "
                          "flights/search NON ancora "
                          "intercettata."
                      )


                  browser.close()


              log("")
              log(
                  "========================================"
              )

              log(
                  "TEST VOLOTEA COMPLETATO"
              )

              log(
                  "========================================"
              )

              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PYTHON

          python /tmp/test_volotea.py
