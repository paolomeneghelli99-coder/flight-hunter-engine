name: Flight Hunter Scanner

on:
  workflow_dispatch:

jobs:
  scanner:
    runs-on: ubuntu-latest

    env:
      FH_BACKEND_URL: ${{ secrets.FH_BACKEND_URL }}
      FH_PUBLISHABLE_KEY: ${{ secrets.FH_PUBLISHABLE_KEY }}
      FH_EMAIL: ${{ secrets.FH_EMAIL }}
      FH_PASSWORD: ${{ secrets.FH_PASSWORD }}

    steps:
      - name: Scarica codice
        uses: actions/checkout@v5

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Login Flight Hunter
        run: |
          TOKEN=$(curl -s -X POST \
          "${{ secrets.FH_BACKEND_URL }}/auth/v1/token?grant_type=password" \
          -H "apikey: ${{ secrets.FH_PUBLISHABLE_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{"email":"${{ secrets.FH_EMAIL }}","password":"${{ secrets.FH_PASSWORD }}"}' \
          | jq -r .access_token)

          echo "TOKEN ottenuto"
          echo "FH_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Avvia Flight Hunter Engine
        run: |
          python main.py
