on:
workflow_dispatch:

schedule:
- cron: "*/30 * * * *"

jobs:
scanner:
runs-on: ubuntu-latest

```
permissions:
  contents: read

steps:

  # ============================================================
  # CHECKOUT
  # ============================================================

  - name: Checkout repository
    uses: actions/checkout@v5


  # ============================================================
  # PYTHON
  # ============================================================

  - name: Setup Python
    uses: actions/setup-python@v6
    with:
      python-version: "3.11"


  # ============================================================
  # INSTALLAZIONE DIPENDENZE
  # ============================================================

  - name: Install dependencies
    shell: bash
    run: |
      set -e

      echo "========================================"
      echo "INSTALLAZIONE DIPENDENZE"
      echo "========================================"

      python --version
      python -m pip --version

      python -m pip install --upgrade pip

      python -m pip install -r requirements.txt

      echo ""
      echo "Installazione Chromium per Playwright..."

      python -m playwright install --with-deps chromium

      echo ""
      echo "Dipendenze installate correttamente."


  # ============================================================
  # TEST VOLOTEA
  #
  # Il test verifica:
  # 1. stations.json
  # 2. rotta VRN -> CTA
  # 3. apertura del frontend Volotea
  # 4. presenza della sessione browser
  # 5. chiamata Search API dal contesto browser
  #
  # Il test NON deve far fallire il workflow se Volotea
  # risponde 403: in quel caso viene diagnosticato il problema.
  # ============================================================

  - name: Test Volotea API
    shell: bash
    env:
      VOLOTEA_API_KEY: ${{ secrets.VOLOTEA_API_KEY }}
    run: |
      set -o pipefail

      echo "========================================"
      echo "TEST VOLOTEA API"
      echo "========================================"

      python - <<'PY'
      import json
      import os
      import sys
      from datetime import date, timedelta

      import requests
      from playwright.sync_api import sync_playwright


      STATIONS_URL = (
          "https://json.volotea.com/"
          "dist/stations/stations.json"
      )

      SEARCH_URL = (
          "https://api.volotea.com/"
          "api/spa/voe/v1/flights/search"
      )

      BOOKING_URL = "https://book.volotea.com/"


      # ========================================================
      # 1. DOWNLOAD STATIONS
      # ========================================================

      print("")
      print("1. DOWNLOAD STATIONS")
      print("----------------------------------------")

      stations_response = requests.get(
          STATIONS_URL,
          timeout=60,
          headers={
              "User-Agent": (
                  "Mozilla/5.0 "
                  "(Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/147.0 Safari/537.36"
              ),
              "Accept": "application/json",
              "Accept-Language": "it-IT,it;q=0.9,en;q=0.8",
          },
      )

      print(
          "HTTP status:",
          stations_response.status_code
      )

      stations_response.raise_for_status()

      stations = stations_response.json()

      if not isinstance(stations, dict):
          raise RuntimeError(
              "stations.json non contiene un dizionario."
          )

      print(
          "Stazioni presenti:",
          len(stations)
      )

      if "VRN" not in stations:
          raise RuntimeError(
              "VRN non trovato in stations.json."
          )

      vrn = stations["VRN"]

      markets = vrn.get("Markets") or {}

      print(
          "Mercati VRN:",
          len(markets)
      )

      if "CTA" not in markets:
          raise RuntimeError(
              "CTA non presente nei Markets di VRN."
          )

      market = markets["CTA"]

      print("")
      print("VRN -> CTA")
      print("----------------------------------------")

      print(
          "Enabled:",
          market.get("Enabled")
      )

      print(
          "FlightType:",
          market.get("FlightType")
      )

      print(
          "MinFlightDate:",
          market.get("MinFlightDate")
      )

      print(
          "MaxFlightDate:",
          market.get("MaxFlightDate")
      )

      if not market.get("Enabled"):
          raise RuntimeError(
              "La rotta VRN -> CTA non è Enabled."
          )

      min_date = market.get("MinFlightDate")
      max_date = market.get("MaxFlightDate")

      oggi = date.today()

      data_test = oggi + timedelta(days=1)

      if min_date:
          data_test = max(
              data_test,
              date.fromisoformat(min_date)
          )

      if max_date:
          max_date_obj = date.fromisoformat(max_date)

          if data_test > max_date_obj:
              raise RuntimeError(
                  "Nessuna data valida disponibile "
                  "per il test VRN -> CTA."
              )

      data_str = data_test.isoformat()

      print("")
      print(
          "Data utilizzata per il test:",
          data_str
      )


      # ========================================================
      # 2. APERTURA FRONTEND VOLOTEA
      # ========================================================

      print("")
      print("2. APERTURA FRONTEND VOLOTEA")
      print("----------------------------------------")

      api_key = (
          os.environ.get("VOLOTEA_API_KEY")
          or ""
      ).strip()

      if not api_key:
          print("")
          print(
              "ATTENZIONE: VOLOTEA_API_KEY non configurata."
          )

          print(
              "Il test browser verrà comunque eseguito "
              "per verificare il frontend."
          )

      with sync_playwright() as p:

          browser = p.chromium.launch(
              headless=True
          )

          context = browser.new_context(
              locale="it-IT",
              user_agent=(
                  "Mozilla/5.0 "
                  "(Linux; Android 6.0; Nexus 5 "
                  "Build/MRA58N) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/147.0.0.0 "
                  "Mobile Safari/537.36"
              ),
              extra_http_headers={
                  "Accept-Language":
                      "it-IT,it;q=0.9,en;q=0.8",
              },
          )

          page = context.new_page()

          print("")
          print(
              "Apertura:",
              BOOKING_URL
          )

          try:

              page.goto(
                  BOOKING_URL,
                  wait_until="domcontentloaded",
                  timeout=90000,
              )

              page.wait_for_timeout(5000)

          except Exception as exc:

              print("")
              print(
                  "ATTENZIONE: apertura frontend "
                  "Volotea non completata:"
              )

              print(
                  repr(exc)
              )


          print("")
          print(
              "URL finale:",
              page.url
          )

          cookies = context.cookies()

          print(
              "Cookie browser:",
              len(cookies)
          )


          # ====================================================
          # 3. LOCAL STORAGE
          # ====================================================

          print("")
          print("3. ANALISI SESSIONE BROWSER")
          print("----------------------------------------")

          local_storage = {}

          try:

              local_storage = page.evaluate(
                  "() => {"
                  "const r = {};"
                  "for (let i = 0; "
                  "i < localStorage.length; i++) {"
                  "const k = localStorage.key(i);"
                  "r[k] = localStorage.getItem(k);"
                  "}"
                  "return r;"
                  "}"
              )

          except Exception as exc:

              print(
                  "LocalStorage non leggibile:",
                  repr(exc)
              )

          print(
              "Elementi localStorage:",
              len(local_storage)
          )

          interesting_keys = []

          for key in local_storage:

              key_lower = key.lower()

              if (
                  "session" in key_lower
                  or "token" in key_lower
                  or "api" in key_lower
                  or "client" in key_lower
              ):
                  interesting_keys.append(key)

          if interesting_keys:

              print(
                  "Chiavi sessione/token individuate:"
              )

              for key in interesting_keys:
                  print(
                      " -",
                      key
                  )

          else:

              print(
                  "Nessuna chiave evidente "
                  "di sessione/token nel localStorage."
              )


          # ====================================================
          # 4. COOKIE
          # ====================================================

          print("")
          print("Cookie rilevanti:")
          print("----------------------------------------")

          cookie_names = []

          for cookie in cookies:

              name = cookie.get("name")

              if not name:
                  continue

              cookie_names.append(name)

          for name in sorted(cookie_names):

              print(
                  " -",
                  name
              )


          # ====================================================
          # 5. COSTRUZIONE PAYLOAD
          #
          # Usiamo lo stesso formato visto nella richiesta
          # reale del browser.
          # ====================================================

          print("")
          print("4. PAYLOAD SEARCH API")
          print("----------------------------------------")

          payload = {

              "abTastyExperiments": [],

              "codes": {
                  "currency": "EUR",
                  "promotionCode": "",
                  "bookingType": 2,
                  "residentType": "NONE",
              },

              "criteria": [
                  {
                      "beginDate": data_str,
                      "endDate": data_str,
                      "selectedDate": data_str,
                      "origin": "VRN",
                      "destination": "CTA",
                  }
              ],

              "fareTypesToRequest": [
                  "R",
                  "S",
                  "SP",
              ],

              "passengers": [
                  {
                      "type": "ADT",
                      "count": 1,
                  }
              ],
          }

          print(
              json.dumps(
                  payload,
                  indent=2,
                  ensure_ascii=False
              )
          )


          # ====================================================
          # 6. RECUPERO x-session-token
          #
          # Non stampiamo MAI il token.
          # ====================================================

          session_token = None

          token_candidates = [
              "x-session-token",
              "session-token",
              "sessionToken",
              "xSessionToken",
          ]

          for key, value in local_storage.items():

              if not isinstance(value, str):
                  continue

              key_lower = key.lower()

              if (
                  "session" in key_lower
                  and "token" in key_lower
              ):
                  session_token = value
                  break

          if session_token:

              print("")
              print(
                  "x-session-token trovato "
                  "nel localStorage: SI"
              )

          else:

              print("")
              print(
                  "x-session-token nel localStorage: NO"
              )


          # ====================================================
          # 7. TEST SEARCH API
          # ====================================================

          print("")
          print("5. POST FLIGHTS/SEARCH")
          print("----------------------------------------")

          request_headers = {

              "Accept":
                  "application/json",

              "Content-Type":
                  "application/json",

              "Origin":
                  "https://book.volotea.com",

              "Referer":
                  "https://book.volotea.com/",

              "User-Agent":
                  (
                      "Mozilla/5.0 "
                      "(Linux; Android 6.0; Nexus 5 "
                      "Build/MRA58N) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/147.0.0.0 "
                      "Mobile Safari/537.36"
                  ),

              "x-client-type":
                  "spa",
          }


          if api_key:

              request_headers[
                  "x-api-key"
              ] = api_key


          if session_token:

              request_headers[
                  "x-session-token"
              ] = session_token


          print(
              "x-api-key:",
              "PRESENTE"
              if api_key
              else "ASSENTE"
          )

          print(
              "x-session-token:",
              "PRESENTE"
              if session_token
              else "ASSENTE"
          )

          print(
              "x-client-type:",
              request_headers[
                  "x-client-type"
              ]
          )


          # ====================================================
          # ESECUZIONE DAL CONTESTO BROWSER
          # ====================================================

          result = page.evaluate(
              """
              async ({url, payload, headers}) => {

                  try {

                      const response =
                          await fetch(
                              url,
                              {
                                  method: "POST",

                                  headers: headers,

                                  credentials:
                                      "include",

                                  body:
                                      JSON.stringify(
                                          payload
                                      )
                              }
                          );

                      const text =
                          await response.text();

                      return {
                          status:
                              response.status,

                          ok:
                              response.ok,

                          text:
                              text.slice(
                                  0,
                                  10000
                              )
                      };

                  } catch (error) {

                      return {
                          status: 0,

                          ok: false,

                          error:
                              String(error)
                      };
                  }
              }
              """,
              {
                  "url": SEARCH_URL,
                  "payload": payload,
                  "headers": request_headers,
              }
          )


          status = result.get(
              "status",
              0
          )

          print("")
          print(
              "HTTP status:",
              status
          )


          # ====================================================
          # RISPOSTA
          # ====================================================

          if status == 200:

              print("")
              print(
                  "========================================"
              )
              print(
                  "VOLOTEA SEARCH API -> HTTP 200"
              )
              print(
                  "========================================"
              )

              text = result.get(
                  "text",
                  ""
              )

              try:

                  data = json.loads(text)

              except Exception:

                  data = None

              if isinstance(data, (dict, list)):

                  print("")
                  print(
                      "Risposta JSON ricevuta: SI"
                  )

                  print(
                      "Dimensione risposta:",
                      len(text),
                      "caratteri"
                  )

              else:

                  print("")
                  print(
                      "Risposta HTTP 200 "
                      "ma non JSON."
                  )


              print("")
              print(
                  "TEST VOLOTEA RIUSCITO."
              )


          elif status == 403:

              print("")
              print(
                  "========================================"
              )
              print(
                  "VOLOTEA SEARCH API -> HTTP 403"
              )
              print(
                  "========================================"
              )

              print("")
              print(
                  "Il server ha rifiutato la richiesta."
              )

              print("")
              print(
                  "Risposta server:"
              )

              print(
                  result.get(
                      "text",
                      ""
                  )
              )

              print("")
              print(
                  "Il test NON viene considerato "
                  "errore del workflow."
              )

              print(
                  "stations.json funziona."
              )

              print(
                  "La richiesta reale del browser "
                  "richiede ulteriori informazioni "
                  "di sessione."
              )


          else:

              print("")
              print(
                  "Status HTTP:",
                  status
              )

              print("")
              print(
                  "Risposta:"
              )

              print(
                  result.get(
                      "text",
                      ""
                  )
              )


          browser.close()


      print("")
      print("========================================")
      print("TEST VOLOTEA COMPLETATO")
      print("========================================")

  # ============================================================
  # AUTENTICAZIONE FLIGHT HUNTER
  # ============================================================

  - name: Get Flight Hunter access token
    id: auth
    shell: bash
    env:
      FH_BACKEND_URL: ${{ secrets.FH_BACKEND_URL }}
      FH_PUBLISHABLE_KEY: ${{ secrets.FH_PUBLISHABLE_KEY }}
      FH_EMAIL: ${{ secrets.FH_EMAIL }}
      FH_PASSWORD: ${{ secrets.FH_PASSWORD }}
    run: |
      set -e

      echo "========================================"
      echo "AUTENTICAZIONE FLIGHT HUNTER"
      echo "========================================"

      if [ -z "$FH_BACKEND_URL" ]; then
        echo "ERRORE: FH_BACKEND_URL mancante."
        exit 1
      fi

      if [ -z "$FH_PUBLISHABLE_KEY" ]; then
        echo "ERRORE: FH_PUBLISHABLE_KEY mancante."
        exit 1
      fi

      if [ -z "$FH_EMAIL" ]; then
        echo "ERRORE: FH_EMAIL mancante."
        exit 1
      fi

      if [ -z "$FH_PASSWORD" ]; then
        echo "ERRORE: FH_PASSWORD mancante."
        exit 1
      fi

      AUTH_URL="${FH_BACKEND_URL%/}/auth/v1/token?grant_type=password"

      echo ""
      echo "Endpoint autenticazione:"
      echo "$AUTH_URL"

      RESPONSE_FILE="$(mktemp)"

      HTTP_CODE=$(
        curl \
          --silent \
          --show-error \
          --output "$RESPONSE_FILE" \
          --write-out "%{http_code}" \
          --request POST \
          --header "apikey: ${FH_PUBLISHABLE_KEY}" \
          --header "Authorization: Bearer ${FH_PUBLISHABLE_KEY}" \
          --header "Content-Type: application/json" \
          --data "$(python - <<'PY'
      import json
      import os

      print(
          json.dumps(
              {
                  "email":
                      os.environ["FH_EMAIL"],

                  "password":
                      os.environ["FH_PASSWORD"],
              }
          )
      )
      PY
      )" \
          "$AUTH_URL"
      )

      echo ""
      echo "HTTP status autenticazione: $HTTP_CODE"

      if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then

        echo ""
        echo "ERRORE AUTENTICAZIONE"

        echo ""
        echo "Risposta server:"

        cat "$RESPONSE_FILE"

        echo ""

        rm -f "$RESPONSE_FILE"

        exit 1
      fi

      ACCESS_TOKEN=$(
        python - "$RESPONSE_FILE" <<'PY'
      import json
      import sys

      filename = sys.argv[1]

      with open(
          filename,
          "r",
          encoding="utf-8"
      ) as f:

          data = json.load(f)

      token = data.get(
          "access_token"
      )

      if not token:

          raise SystemExit(
              "access_token non presente "
              "nella risposta di autenticazione"
          )

      print(token)
      PY
      )

      rm -f "$RESPONSE_FILE"

      if [ -z "$ACCESS_TOKEN" ]; then
        echo "ERRORE: token vuoto."
        exit 1
      fi

      echo ""
      echo "Autenticazione completata."
      echo "Token ottenuto: SI"

      echo "::add-mask::$ACCESS_TOKEN"

      echo \
        "FH_ACCESS_TOKEN=$ACCESS_TOKEN" \
        >> "$GITHUB_ENV"


  # ============================================================
  # ESECUZIONE FLIGHT HUNTER
  # ============================================================

  - name: Run Flight Hunter Scanner
    shell: bash
    env:
      FH_IMPORT_URL: ${{ secrets.FH_IMPORT_URL }}
      FH_ACCESS_TOKEN: ${{ env.FH_ACCESS_TOKEN }}
      FH_BACKEND_URL: ${{ secrets.FH_BACKEND_URL }}
      FH_PUBLISHABLE_KEY: ${{ secrets.FH_PUBLISHABLE_KEY }}
      FH_EMAIL: ${{ secrets.FH_EMAIL }}
      FH_PASSWORD: ${{ secrets.FH_PASSWORD }}
    run: |
      set -o pipefail

      echo "========================================"
      echo "AVVIO FLIGHT HUNTER"
      echo "========================================"

      echo ""
      echo "Esecuzione:"
      echo "python -u main.py"
      echo ""

      python -u main.py 2>&1 | tee flight_hunter.log

      EXIT_CODE=${PIPESTATUS[0]}

      echo ""
      echo "========================================"
      echo "CODICE USCITA MAIN.PY: $EXIT_CODE"
      echo "========================================"

      if [ "$EXIT_CODE" -ne 0 ]; then

        echo ""
        echo "========================================"
        echo "ERRORE FLIGHT HUNTER"
        echo "========================================"

        echo ""
        echo "LOG COMPLETO:"
        echo "----------------------------------------"

        cat flight_hunter.log

        echo ""
        echo "----------------------------------------"

        exit "$EXIT_CODE"
      fi

      echo ""
      echo "========================================"
      echo "FLIGHT HUNTER COMPLETATO"
      echo "========================================"


  # ============================================================
  # SALVATAGGIO LOG
  # ============================================================

  - name: Upload scanner log
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: flight-hunter-log
      path: flight_hunter.log
      if-no-files-found: ignore
