name: Flight Hunter Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

jobs:
  scanner:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      # ============================================================
      # INSTALLAZIONE DIPENDENZE
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "INSTALLAZIONE DIPENDENZE"
          echo "========================================"

          python --version
          python -m pip --version

          python -m pip install --upgrade pip

          python -m pip install -r requirements.txt

          echo ""
          echo "Installazione Chromium per Playwright..."

          python -m playwright install --with-deps chromium

          echo ""
          echo "Dipendenze installate correttamente."


      # ============================================================
      # TEST VOLОTEA - STATIONS + SEARCH API
      # ============================================================

      - name: Test Volotea API
        shell: bash
        run: |
          set -o pipefail

          echo "========================================"
          echo "TEST VOLOTEA API"
          echo "========================================"

          python - <<'PY'
          import json
          import requests
          from datetime import date, timedelta

          STATIONS_URL = (
              "https://json.volotea.com/"
              "dist/stations/stations.json"
          )

          SEARCH_URL = (
              "https://api.volotea.com/"
              "api/spa/voe/v1/flights/search"
          )

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/124.0 Safari/537.36"
              ),
              "Accept": (
                  "application/json, "
                  "text/plain, */*"
              ),
              "Accept-Language": (
                  "it-IT,it;q=0.9,en;q=0.8"
              ),
              "Content-Type": "application/json",
              "Origin": "https://www.volotea.com",
              "Referer": "https://www.volotea.com/",
          }

          session = requests.Session()
          session.headers.update(HEADERS)

          # ========================================================
          # 1. DOWNLOAD STATIONS
          # ========================================================

          print("")
          print("1. DOWNLOAD STATIONS")
          print("----------------------------------------")

          try:
              response = session.get(
                  STATIONS_URL,
                  timeout=60,
              )

              print(
                  "HTTP status:",
                  response.status_code
              )

              response.raise_for_status()

              stations = response.json()

          except Exception as exc:
              print("")
              print(
                  "ERRORE DOWNLOAD STATIONS:",
                  repr(exc)
              )

              raise SystemExit(1)

          if not isinstance(stations, dict):
              print(
                  "ERRORE: stations.json "
                  "non contiene un dizionario."
              )

              raise SystemExit(1)

          print(
              "Stazioni presenti:",
              len(stations)
          )

          if "VRN" not in stations:
              print(
                  "ERRORE: VRN non trovato "
                  "in stations.json."
              )

              raise SystemExit(1)

          vrn = stations["VRN"]

          markets = vrn.get("Markets") or {}

          print(
              "Mercati VRN:",
              len(markets)
          )

          if "CTA" not in markets:
              print(
                  "ERRORE: CTA non presente "
                  "nei Markets di VRN."
              )

              raise SystemExit(1)

          market = markets["CTA"]

          print("")
          print("VRN -> CTA")
          print("----------------------------------------")

          print(
              "Enabled:",
              market.get("Enabled")
          )

          print(
              "FlightType:",
              market.get("FlightType")
          )

          print(
              "MinFlightDate:",
              market.get("MinFlightDate")
          )

          print(
              "MaxFlightDate:",
              market.get("MaxFlightDate")
          )

          if not market.get("Enabled"):
              print(
                  "ERRORE: VRN -> CTA "
                  "non è Enabled."
              )

              raise SystemExit(1)

          min_date = market.get("MinFlightDate")
          max_date = market.get("MaxFlightDate")

          oggi = date.today()

          data_test = oggi + timedelta(days=1)

          if min_date:
              data_test = max(
                  data_test,
                  date.fromisoformat(min_date)
              )

          if max_date:
              if (
                  data_test
                  > date.fromisoformat(max_date)
              ):
                  print(
                      "ERRORE: nessuna data valida "
                      "disponibile per il test."
                  )

                  raise SystemExit(1)

          data_str = data_test.isoformat()

          print("")
          print(
              "Data utilizzata per il test:",
              data_str
          )

          # ========================================================
          # 2. POST SEARCH API
          # ========================================================

          print("")
          print("2. POST FLIGHTS/SEARCH")
          print("----------------------------------------")

          payload = {
              "codes": {
                  "currency": "EUR",
                  "promotionCode": "",
                  "bookingType": 2,
                  "residentType": "NONE",
              },

              "criteria": [
                  {
                      "beginDate": data_str,
                      "endDate": data_str,
                      "selectedDate": data_str,
                      "origin": "VRN",
                      "destination": "CTA",
                  }
              ],

              "fareTypesToRequest": [
                  "R",
                  "S",
                  "SP",
              ],

              "passengers": [
                  {
                      "type": "ADT",
                      "count": 1,
                  }
              ],
          }

          print("Endpoint:")
          print(SEARCH_URL)

          print("")
          print("Payload:")

          print(
              json.dumps(
                  payload,
                  indent=2,
                  ensure_ascii=False
              )
          )

          try:
              response = session.post(
                  SEARCH_URL,
                  json=payload,
                  timeout=60,
              )

          except Exception as exc:
              print("")
              print(
                  "ERRORE REQUEST SEARCH API:",
                  repr(exc)
              )

              print("")
              print(
                  "Il test stations.json è comunque "
                  "andato a buon fine."
              )

              raise SystemExit(0)

          print("")
          print(
              "HTTP status:",
              response.status_code
          )

          # ========================================================
          # 403
          # ========================================================

          if response.status_code == 403:

              print("")
              print("========================================")
              print("VOLОTEA SEARCH API -> HTTP 403")
              print("========================================")

              print("")
              print(
                  "L'endpoint è raggiungibile, "
                  "ma il server Volotea sta "
                  "rifiutando la richiesta."
              )

              print("")
              print("Risposta server:")

              print(
                  response.text[:5000]
              )

              print("")
              print(
                  "Questo test NON viene considerato "
                  "un errore del workflow."
              )

              print(
                  "stations.json funziona correttamente."
              )

              print(
                  "La Search API richiede probabilmente "
                  "header/sessione/cookie/token "
                  "specifici del frontend Volotea."
              )

              raise SystemExit(0)

          # ========================================================
          # ALTRI STATUS HTTP
          # ========================================================

          if response.status_code != 200:

              print("")
              print("RISPOSTA API:")

              print(
                  response.text[:5000]
              )

              print("")
              print(
                  "Status HTTP inatteso."
              )

              raise SystemExit(0)

          # ========================================================
          # PARSING JSON
          # ========================================================

          try:
              data = response.json()

          except ValueError:

              print("")
              print(
                  "ERRORE: risposta HTTP 200 "
                  "ma non JSON."
              )

              print(
                  response.text[:5000]
              )

              raise SystemExit(0)

          print("")
          print("Risposta JSON ricevuta: SI")

          print(
              "Dimensione risposta:",
              len(response.content),
              "bytes"
          )

          # ========================================================
          # RICERCA RICORSIVA DEI VOLI
          # ========================================================

          voli = []

          def visita(obj):

              if isinstance(obj, dict):

                  if (
                      "fares" in obj
                      and "designator" in obj
                  ):
                      voli.append(obj)

                  for value in obj.values():
                      visita(value)

              elif isinstance(obj, list):

                  for value in obj:
                      visita(value)

          visita(data)

          print("")
          print(
              "Oggetti volo trovati:",
              len(voli)
          )

          if not voli:

              print("")
              print(
                  "Nessun volo trovato per "
                  f"VRN -> CTA del {data_str}."
              )

              raise SystemExit(0)

          # ========================================================
          # PRIMO VOLO
          # ========================================================

          volo = voli[0]

          designator = (
              volo.get("designator")
              or {}
          )

          print("")
          print("3. PRIMO VOLO TROVATO")
          print("----------------------------------------")

          print(
              "Origine:",
              designator.get("origin")
          )

          print(
              "Destinazione:",
              designator.get("destination")
          )

          print(
              "Partenza:",
              designator.get("departure")
          )

          print(
              "Arrivo:",
              designator.get("arrival")
          )

          print(
              "Durata:",
              volo.get("flightDuration")
          )

          segments = (
              volo.get("segments")
              or []
          )

          if segments:

              identifier = (
                  segments[0].get("identifier")
                  or {}
              )

              print(
                  "Numero volo:",
                  identifier.get("identifier")
              )

              print(
                  "Compagnia:",
                  identifier.get("carrierCode")
              )

          # ========================================================
          # PREZZI
          # ========================================================

          prezzi = []

          for fare in volo.get(
              "fares",
              []
          ):

              for passenger in fare.get(
                  "passengerFares",
                  []
              ):

                  if (
                      passenger.get(
                          "passengerType"
                      )
                      != "ADT"
                  ):
                      continue

                  fare_amount = (
                      passenger.get(
                          "fareAmount"
                      )
                      or {}
                  )

                  prezzo = (
                      fare_amount.get(
                          "eurAmount"
                      )
                      or fare_amount.get(
                          "amount"
                      )
                  )

                  if prezzo is not None:

                      try:
                          prezzo = float(prezzo)

                          if prezzo > 0:
                              prezzi.append(
                                  prezzo
                              )

                      except (
                          TypeError,
                          ValueError
                      ):
                          pass

          print("")

          if prezzi:

              print(
                  "Prezzo minimo trovato:",
                  f"{min(prezzi):.2f} EUR"
              )

          else:

              print(
                  "Nessun prezzo ADT trovato."
              )

          print("")
          print("========================================")
          print("TEST VOLOTEA COMPLETATO")
          print("========================================")

          print("")
          print("OK: stations.json funziona.")

          print(
              "OK: rotta VRN -> CTA individuata."
          )

          print(
              "OK: Search API raggiungibile."
          )

          print(
              "OK: risposta JSON interpretata."
          )

          print(
              "OK: struttura volo interpretata."
          )

          if prezzi:
              print(
                  "OK: prezzo interpretato."
              )
          PY


      # ============================================================
      # AUTENTICAZIONE FLIGHT HUNTER
      # ============================================================

      - name: Get Flight Hunter access token
        id: auth
        shell: bash
        env:
          FH_BACKEND_URL: ${{ secrets.FH_BACKEND_URL }}
          FH_PUBLISHABLE_KEY: ${{ secrets.FH_PUBLISHABLE_KEY }}
          FH_EMAIL: ${{ secrets.FH_EMAIL }}
          FH_PASSWORD: ${{ secrets.FH_PASSWORD }}
        run: |
          set -e

          echo "========================================"
          echo "AUTENTICAZIONE FLIGHT HUNTER"
          echo "========================================"

          if [ -z "$FH_BACKEND_URL" ]; then
            echo "ERRORE: FH_BACKEND_URL mancante."
            exit 1
          fi

          if [ -z "$FH_PUBLISHABLE_KEY" ]; then
            echo "ERRORE: FH_PUBLISHABLE_KEY mancante."
            exit 1
          fi

          if [ -z "$FH_EMAIL" ]; then
            echo "ERRORE: FH_EMAIL mancante."
            exit 1
          fi

          if [ -z "$FH_PASSWORD" ]; then
            echo "ERRORE: FH_PASSWORD mancante."
            exit 1
          fi

          AUTH_URL="${FH_BACKEND_URL%/}/auth/v1/token?grant_type=password"

          echo ""
          echo "Endpoint autenticazione:"
          echo "$AUTH_URL"

          RESPONSE_FILE="$(mktemp)"

          HTTP_CODE=$(
            curl \
              --silent \
              --show-error \
              --output "$RESPONSE_FILE" \
              --write-out "%{http_code}" \
              --request POST \
              --header "apikey: ${FH_PUBLISHABLE_KEY}" \
              --header "Authorization: Bearer ${FH_PUBLISHABLE_KEY}" \
              --header "Content-Type: application/json" \
              --data "$(python - <<'PY'
          import json
          import os

          print(
              json.dumps(
                  {
                      "email": os.environ["FH_EMAIL"],
                      "password": os.environ["FH_PASSWORD"],
                  }
              )
          )
          PY
          )" \
              "$AUTH_URL"
          )

          echo ""
          echo "HTTP status autenticazione: $HTTP_CODE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo ""
            echo "ERRORE AUTENTICAZIONE"
            echo "Risposta server:"
            cat "$RESPONSE_FILE"
            echo ""
            rm -f "$RESPONSE_FILE"
            exit 1
          fi

          ACCESS_TOKEN=$(
            python - "$RESPONSE_FILE" <<'PY'
          import json
          import sys

          filename = sys.argv[1]

          with open(
              filename,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          token = data.get("access_token")

          if not token:
              raise SystemExit(
                  "access_token non presente "
                  "nella risposta di autenticazione"
              )

          print(token)
          PY
          )

          rm -f "$RESPONSE_FILE"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERRORE: token vuoto."
            exit 1
          fi

          echo ""
          echo "Autenticazione completata."
          echo "Token ottenuto: SI"

          echo "FH_ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"


      # ============================================================
      # ESECUZIONE FLIGHT HUNTER
      # ============================================================

      - name: Run Flight Hunter Scanner
        shell: bash
        env:
          FH_IMPORT_URL: ${{ secrets.FH_IMPORT_URL }}
          FH_ACCESS_TOKEN: ${{ env.FH_ACCESS_TOKEN }}
          FH_BACKEND_URL: ${{ secrets.FH_BACKEND_URL }}
          FH_PUBLISHABLE_KEY: ${{ secrets.FH_PUBLISHABLE_KEY }}
          FH_EMAIL: ${{ secrets.FH_EMAIL }}
          FH_PASSWORD: ${{ secrets.FH_PASSWORD }}
        run: |
          set -o pipefail

          echo "========================================"
          echo "AVVIO FLIGHT HUNTER"
          echo "========================================"

          echo ""
          echo "Esecuzione:"
          echo "python -u main.py"
          echo ""

          python -u main.py 2>&1 | tee flight_hunter.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "CODICE USCITA MAIN.PY: $EXIT_CODE"
          echo "========================================"

          if [ "$EXIT_CODE" -ne 0 ]; then

            echo ""
            echo "========================================"
            echo "ERRORE FLIGHT HUNTER"
            echo "========================================"

            echo ""
            echo "LOG COMPLETO:"
            echo "----------------------------------------"

            cat flight_hunter.log

            echo ""
            echo "----------------------------------------"

            exit "$EXIT_CODE"
          fi

          echo ""
          echo "========================================"
          echo "FLIGHT HUNTER COMPLETATO"
          echo "========================================"


      # ============================================================
      # SALVATAGGIO LOG
      # ============================================================

      - name: Upload scanner log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flight-hunter-log
          path: flight_hunter.log
          if-no-files-found: ignore
