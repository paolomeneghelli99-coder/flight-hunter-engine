name: Flight Hunter Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  scanner:
    name: Flight Hunter Scanner
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      # ============================================================
      # INSTALLAZIONE DIPENDENZE
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "INSTALLAZIONE DIPENDENZE"
          echo "========================================"

          python --version
          python -m pip --version

          python -m pip install --upgrade pip

          python -m pip install -r requirements.txt

          echo ""
          echo "Installazione Chromium per Playwright..."

          python -m playwright install --with-deps chromium

          echo ""
          echo "Dipendenze installate correttamente."


      # ============================================================
      # TEST VOLOTEA
      # ============================================================

      - name: Test Volotea API
        shell: bash
        env:
          VOLOTEA_API_KEY: ${{ secrets.VOLOTEA_API_KEY }}
        run: |
          set -o pipefail

          echo "========================================"
          echo "TEST VOLOTEA API"
          echo "========================================"

          python - <<'PY'
          import json
          import os
          from datetime import date, timedelta

          import requests
          from playwright.sync_api import sync_playwright


          STATIONS_URL = (
              "https://json.volotea.com/"
              "dist/stations/stations.json"
          )

          SEARCH_URL = (
              "https://api.volotea.com/"
              "api/spa/voe/v1/flights/search"
          )

          BOOKING_URL = "https://book.volotea.com/"


          USER_AGENT = (
              "Mozilla/5.0 "
              "(Linux; Android 6.0; Nexus 5 "
              "Build/MRA58N) "
              "AppleWebKit/537.36 "
              "(KHTML, like Gecko) "
              "Chrome/147.0.0.0 "
              "Mobile Safari/537.36"
          )


          # ========================================================
          # 1. DOWNLOAD STATIONS
          # ========================================================

          print("")
          print("1. DOWNLOAD STATIONS")
          print("----------------------------------------")

          stations_response = requests.get(
              STATIONS_URL,
              timeout=60,
              headers={
                  "User-Agent": USER_AGENT,
                  "Accept": "application/json",
                  "Accept-Language": (
                      "it-IT,it;q=0.9,en;q=0.8"
                  ),
              },
          )

          print(
              "HTTP status:",
              stations_response.status_code
          )

          stations_response.raise_for_status()

          stations = stations_response.json()

          if not isinstance(stations, dict):
              raise RuntimeError(
                  "stations.json non contiene un dizionario."
              )

          print(
              "Stazioni presenti:",
              len(stations)
          )

          if "VRN" not in stations:
              raise RuntimeError(
                  "VRN non trovato in stations.json."
              )

          vrn = stations["VRN"]

          markets = vrn.get("Markets") or {}

          print(
              "Mercati VRN:",
              len(markets)
          )

          if "CTA" not in markets:
              raise RuntimeError(
                  "CTA non presente nei Markets di VRN."
              )

          market = markets["CTA"]

          print("")
          print("VRN -> CTA")
          print("----------------------------------------")

          print(
              "Enabled:",
              market.get("Enabled")
          )

          print(
              "FlightType:",
              market.get("FlightType")
          )

          print(
              "MinFlightDate:",
              market.get("MinFlightDate")
          )

          print(
              "MaxFlightDate:",
              market.get("MaxFlightDate")
          )

          if not market.get("Enabled"):
              raise RuntimeError(
                  "La rotta VRN -> CTA non è Enabled."
              )

          min_date = market.get("MinFlightDate")
          max_date = market.get("MaxFlightDate")

          oggi = date.today()

          data_test = oggi + timedelta(days=1)

          if min_date:
              data_test = max(
                  data_test,
                  date.fromisoformat(min_date)
              )

          if max_date:
              max_date_obj = date.fromisoformat(max_date)

              if data_test > max_date_obj:
                  raise RuntimeError(
                      "Nessuna data valida disponibile "
                      "per il test VRN -> CTA."
                  )

          data_str = data_test.isoformat()

          print("")
          print(
              "Data utilizzata per il test:",
              data_str
          )


          # ========================================================
          # 2. APERTURA FRONTEND VOLOTEA
          # ========================================================

          print("")
          print("2. APERTURA FRONTEND VOLOTEA")
          print("----------------------------------------")

          api_key = (
              os.environ.get("VOLOTEA_API_KEY")
              or ""
          ).strip()

          if api_key:
              print(
                  "VOLOTEA_API_KEY:",
                  "CONFIGURATA"
              )
          else:
              print(
                  "ATTENZIONE: VOLOTEA_API_KEY "
                  "non configurata."
              )

          captured_requests = []

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True
              )

              context = browser.new_context(
                  locale="it-IT",
                  user_agent=USER_AGENT,
                  extra_http_headers={
                      "Accept-Language":
                          "it-IT,it;q=0.9,en;q=0.8",
                  },
              )

              page = context.new_page()


              def intercetta_request(request):
                  if request.method != "POST":
                      return

                  if SEARCH_URL not in request.url:
                      return

                  headers = request.headers

                  captured_requests.append(
                      {
                          "url": request.url,
                          "headers": headers,
                          "post_data": request.post_data,
                      }
                  )


              page.on(
                  "request",
                  intercetta_request
              )


              print("")
              print(
                  "Apertura:",
                  BOOKING_URL
              )

              try:

                  page.goto(
                      BOOKING_URL,
                      wait_until="domcontentloaded",
                      timeout=90000,
                  )

                  page.wait_for_timeout(5000)

              except Exception as exc:

                  print("")
                  print(
                      "ATTENZIONE: apertura frontend "
                      "Volotea non completata:"
                  )

                  print(
                      repr(exc)
                  )


              print("")
              print(
                  "URL finale:",
                  page.url
              )

              cookies = context.cookies()

              print(
                  "Cookie browser:",
                  len(cookies)
              )


              # ====================================================
              # 3. LOCAL STORAGE
              # ====================================================

              print("")
              print("3. ANALISI SESSIONE BROWSER")
              print("----------------------------------------")

              local_storage = {}

              try:

                  local_storage = page.evaluate(
                      """
                      () => {
                          const result = {};

                          for (
                              let i = 0;
                              i < localStorage.length;
                              i++
                          ) {
                              const key =
                                  localStorage.key(i);

                              result[key] =
                                  localStorage.getItem(key);
                          }

                          return result;
                      }
                      """
                  )

              except Exception as exc:

                  print(
                      "LocalStorage non leggibile:",
                      repr(exc)
                  )


              print(
                  "Elementi localStorage:",
                  len(local_storage)
              )


              interesting_keys = []

              for key in local_storage:

                  key_lower = key.lower()

                  if (
                      "session" in key_lower
                      or "token" in key_lower
                      or "api" in key_lower
                      or "client" in key_lower
                  ):

                      interesting_keys.append(key)


              if interesting_keys:

                  print(
                      "Chiavi sessione/token individuate:"
                  )

                  for key in interesting_keys:

                      print(
                          " -",
                          key
                      )

              else:

                  print(
                      "Nessuna chiave evidente "
                      "di sessione/token."
                  )


              # ====================================================
              # 4. COOKIE
              # ====================================================

              print("")
              print("4. COOKIE RILEVANTI")
              print("----------------------------------------")

              for cookie in sorted(
                  cookies,
                  key=lambda item:
                      item.get("name", "")
              ):

                  print(
                      " -",
                      cookie.get("name")
                  )


              # ====================================================
              # 5. PAYLOAD
              # ====================================================

              print("")
              print("5. PAYLOAD SEARCH API")
              print("----------------------------------------")

              payload = {
                  "abTastyExperiments": [],

                  "codes": {
                      "currency": "EUR",
                      "promotionCode": "",
                      "bookingType": 2,
                      "residentType": "NONE",
                  },

                  "criteria": [
                      {
                          "beginDate": data_str,
                          "endDate": data_str,
                          "selectedDate": data_str,
                          "origin": "VRN",
                          "destination": "CTA",
                      }
                  ],

                  "fareTypesToRequest": [
                      "R",
                      "S",
                      "SP",
                  ],

                  "passengers": [
                      {
                          "type": "ADT",
                          "count": 1,
                      }
                  ],
              }

              print(
                  json.dumps(
                      payload,
                      indent=2,
                      ensure_ascii=False
                  )
              )


              # ====================================================
              # 6. TOKEN / SESSIONE
              # ====================================================

              session_token = None
              client_session = None
              captured_api_key = None


              # ----------------------------------------------------
              # Cerca eventuale x-session-token nel localStorage
              # ----------------------------------------------------

              for key, value in local_storage.items():

                  if not isinstance(value, str):
                      continue

                  key_lower = key.lower()

                  if (
                      "session" in key_lower
                      and "token" in key_lower
                  ):

                      session_token = value
                      break


              # ----------------------------------------------------
              # Cerca una richiesta reale del frontend
              # ----------------------------------------------------

              for captured in captured_requests:

                  headers = captured.get(
                      "headers",
                      {}
                  )

                  if not session_token:

                      session_token = (
                          headers.get(
                              "x-session-token"
                          )
                      )

                  if not client_session:

                      client_session = (
                          headers.get(
                              "x-client-session"
                          )
                      )

                  if not captured_api_key:

                      captured_api_key = (
                          headers.get(
                              "x-api-key"
                          )
                      )


              print("")

              print(
                  "x-session-token:",
                  "PRESENTE"
                  if session_token
                  else "ASSENTE"
              )

              print(
                  "x-client-session:",
                  "PRESENTE"
                  if client_session
                  else "ASSENTE"
              )

              print(
                  "x-api-key:",
                  "PRESENTE"
                  if (
                      captured_api_key
                      or api_key
                  )
                  else "ASSENTE"
              )

              print(
                  "Richieste SEARCH intercettate:",
                  len(captured_requests)
              )


              # ====================================================
              # 7. HEADERS
              # ====================================================

              request_headers = {

                  "Accept":
                      "application/json",

                  "Content-Type":
                      "application/json",

                  "Origin":
                      "https://book.volotea.com",

                  "Referer":
                      "https://book.volotea.com/",

                  "User-Agent":
                      USER_AGENT,

                  "x-client-type":
                      "spa",
              }


              effective_api_key = (
                  captured_api_key
                  or api_key
              )

              if effective_api_key:

                  request_headers[
                      "x-api-key"
                  ] = effective_api_key


              if session_token:

                  request_headers[
                      "x-session-token"
                  ] = session_token


              if client_session:

                  request_headers[
                      "x-client-session"
                  ] = client_session


              # ====================================================
              # 8. SEARCH API
              # ====================================================

              print("")
              print("6. POST FLIGHTS/SEARCH")
              print("----------------------------------------")

              result = page.evaluate(
                  """
                  async ({url, payload, headers}) => {

                      try {

                          const response =
                              await fetch(
                                  url,
                                  {
                                      method: "POST",
                                      headers: headers,
                                      credentials: "include",
                                      body:
                                          JSON.stringify(payload)
                                  }
                              );

                          const text =
                              await response.text();

                          return {
                              status:
                                  response.status,

                              ok:
                                  response.ok,

                              text:
                                  text.slice(
                                      0,
                                      10000
                                  )
                          };

                      } catch (error) {

                          return {
                              status: 0,
                              ok: false,
                              error:
                                  String(error)
                          };
                      }
                  }
                  """,
                  {
                      "url": SEARCH_URL,
                      "payload": payload,
                      "headers": request_headers,
                  }
              )


              status = result.get(
                  "status",
                  0
              )


              print("")
              print(
                  "HTTP status:",
                  status
              )


              # ====================================================
              # 9. RISPOSTA
              # ====================================================

              if status == 200:

                  print("")
                  print(
                      "========================================"
                  )

                  print(
                      "VOLOTEA SEARCH API -> HTTP 200"
                  )

                  print(
                      "========================================"
                  )

                  text = result.get(
                      "text",
                      ""
                  )


                  try:

                      data = json.loads(text)

                  except Exception:

                      data = None


                  if isinstance(
                      data,
                      (dict, list)
                  ):

                      print("")
                      print(
                          "Risposta JSON ricevuta: SI"
                      )

                      print(
                          "Dimensione risposta:",
                          len(text),
                          "caratteri"
                      )

                      print("")
                      print(
                          "TEST VOLOTEA RIUSCITO."
                      )

                  else:

                      print("")
                      print(
                          "Risposta HTTP 200 "
                          "ma non JSON."
                      )

                      print(
                          text[:5000]
                      )


              elif status == 403:

                  print("")
                  print(
                      "========================================"
                  )

                  print(
                      "VOLOTEA SEARCH API -> HTTP 403"
                  )

                  print(
                      "========================================"
                  )

                  print("")
                  print(
                      "Il server ha rifiutato "
                      "la richiesta."
                  )

                  print("")
                  print(
                      "Risposta server:"
                  )

                  print(
                      result.get(
                          "text",
                          ""
                      )
                  )

                  print("")
                  print(
                      "Il test NON viene considerato "
                      "errore del workflow."
                  )


              else:

                  print("")
                  print(
                      "Status HTTP inatteso:",
                      status
                  )

                  print("")

                  if result.get("error"):

                      print(
                          "Errore:",
                          result.get("error")
                      )

                  else:

                      print(
                          result.get(
                              "text",
                              ""
                          )
                      )


              browser.close()


          print("")
          print("========================================")
          print("TEST VOLOTEA COMPLETATO")
          print("========================================")
          PY


      # ============================================================
      # AUTENTICAZIONE FLIGHT HUNTER
      # ============================================================

      - name: Get Flight Hunter access token
        id: auth
        shell: bash
        env:
          FH_BACKEND_URL: ${{ secrets.FH_BACKEND_URL }}
          FH_PUBLISHABLE_KEY: ${{ secrets.FH_PUBLISHABLE_KEY }}
          FH_EMAIL: ${{ secrets.FH_EMAIL }}
          FH_PASSWORD: ${{ secrets.FH_PASSWORD }}
        run: |
          set -e

          echo "========================================"
          echo "AUTENTICAZIONE FLIGHT HUNTER"
          echo "========================================"

          if [ -z "$FH_BACKEND_URL" ]; then
            echo "ERRORE: FH_BACKEND_URL mancante."
            exit 1
          fi

          if [ -z "$FH_PUBLISHABLE_KEY" ]; then
            echo "ERRORE: FH_PUBLISHABLE_KEY mancante."
            exit 1
          fi

          if [ -z "$FH_EMAIL" ]; then
            echo "ERRORE: FH_EMAIL mancante."
            exit 1
          fi

          if [ -z "$FH_PASSWORD" ]; then
            echo "ERRORE: FH_PASSWORD mancante."
            exit 1
          fi

          AUTH_URL="${FH_BACKEND_URL%/}/auth/v1/token?grant_type=password"

          echo ""
          echo "Endpoint autenticazione:"
          echo "$AUTH_URL"

          RESPONSE_FILE="$(mktemp)"

          HTTP_CODE=$(
            curl \
              --silent \
              --show-error \
              --output "$RESPONSE_FILE" \
              --write-out "%{http_code}" \
              --request POST \
              --header "apikey: ${FH_PUBLISHABLE_KEY}" \
              --header "Authorization: Bearer ${FH_PUBLISHABLE_KEY}" \
              --header "Content-Type: application/json" \
              --data "$(python -c 'import json,os; print(json.dumps({"email": os.environ["FH_EMAIL"], "password": os.environ["FH_PASSWORD"]}))')" \
              "$AUTH_URL"
          )

          echo ""
          echo "HTTP status autenticazione: $HTTP_CODE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then

            echo ""
            echo "ERRORE AUTENTICAZIONE"

            echo ""
            echo "Risposta server:"

            cat "$RESPONSE_FILE"

            echo ""

            rm -f "$RESPONSE_FILE"

            exit 1
          fi

          ACCESS_TOKEN=$(
            python - "$RESPONSE_FILE" <<'PY'
          import json
          import sys

          filename = sys.argv[1]

          with open(
              filename,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          token = data.get(
              "access_token"
          )

          if not token:
              raise SystemExit(
                  "access_token non presente "
                  "nella risposta di autenticazione"
              )

          print(token)
          PY
          )

          rm -f "$RESPONSE_FILE"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERRORE: token vuoto."
            exit 1
          fi

          echo ""
          echo "Autenticazione completata."
          echo "Token ottenuto: SI"

          echo "::add-mask::$ACCESS_TOKEN"

          echo "FH_ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"


      # ============================================================
      # ESECUZIONE FLIGHT HUNTER
      # ============================================================

      - name: Run Flight Hunter Scanner
        shell: bash
        env:
          FH_IMPORT_URL: ${{ secrets.FH_IMPORT_URL }}
          FH_ACCESS_TOKEN: ${{ env.FH_ACCESS_TOKEN }}
          FH_BACKEND_URL: ${{ secrets.FH_BACKEND_URL }}
          FH_PUBLISHABLE_KEY: ${{ secrets.FH_PUBLISHABLE_KEY }}
          FH_EMAIL: ${{ secrets.FH_EMAIL }}
          FH_PASSWORD: ${{ secrets.FH_PASSWORD }}
        run: |
          set -o pipefail

          echo "========================================"
          echo "AVVIO FLIGHT HUNTER"
          echo "========================================"

          echo ""
          echo "Esecuzione:"
          echo "python -u main.py"
          echo ""

          python -u main.py 2>&1 | tee flight_hunter.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "CODICE USCITA MAIN.PY: $EXIT_CODE"
          echo "========================================"

          if [ "$EXIT_CODE" -ne 0 ]; then

            echo ""
            echo "========================================"
            echo "ERRORE FLIGHT HUNTER"
            echo "========================================"

            echo ""
            echo "LOG COMPLETO:"
            echo "----------------------------------------"

            cat flight_hunter.log

            echo ""
            echo "----------------------------------------"

            exit "$EXIT_CODE"
          fi

          echo ""
          echo "========================================"
          echo "FLIGHT HUNTER COMPLETATO"
          echo "========================================"


      # ============================================================
      # SALVATAGGIO LOG
      # ============================================================

      - name: Upload scanner log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flight-hunter-log
          path: flight_hunter.log
          if-no-files-found: ignore
