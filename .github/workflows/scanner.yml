name: Flight Hunter Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  scanner:
    name: Run Flight Hunter Scanner
    runs-on: ubuntu-latest

    env:
      FH_BACKEND_URL: ${{ secrets.FH_BACKEND_URL }}
      FH_PUBLISHABLE_KEY: ${{ secrets.FH_PUBLISHABLE_KEY }}
      FH_EMAIL: ${{ secrets.FH_EMAIL }}
      FH_PASSWORD: ${{ secrets.FH_PASSWORD }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "INSTALLAZIONE DIPENDENZE"
          echo "========================================"

          python --version
          python -m pip --version

          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

          echo ""
          echo "Installazione Chromium per Playwright..."
          python -m playwright install --with-deps chromium

          echo ""
          echo "Dipendenze installate correttamente."

      - name: Check repository
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "STRUTTURA REPOSITORY"
          echo "========================================"

          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            | sort

          echo ""
          echo "Controllo main.py..."

          test -f main.py
          echo "OK: main.py presente"

          echo ""
          echo "Controllo scanners..."

          test -d scanners
          echo "OK: cartella scanners presente"

          find scanners -maxdepth 2 -type f | sort

      - name: Check required secrets
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFICA SECRET"
          echo "========================================"

          if [ -z "$FH_BACKEND_URL" ]; then
            echo "ERRORE: FH_BACKEND_URL mancante"
            exit 1
          fi

          if [ -z "$FH_PUBLISHABLE_KEY" ]; then
            echo "ERRORE: FH_PUBLISHABLE_KEY mancante"
            exit 1
          fi

          if [ -z "$FH_EMAIL" ]; then
            echo "ERRORE: FH_EMAIL mancante"
            exit 1
          fi

          if [ -z "$FH_PASSWORD" ]; then
            echo "ERRORE: FH_PASSWORD mancante"
            exit 1
          fi

          echo "OK: tutti i secret sono presenti"

      - name: Authenticate with Supabase
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "AUTENTICAZIONE FLIGHT HUNTER"
          echo "========================================"

          AUTH_URL="${FH_BACKEND_URL%/}/auth/v1/token?grant_type=password"

          echo "Endpoint autenticazione:"
          echo "${FH_BACKEND_URL%/}/auth/v1/token"

          RESPONSE=$(curl -sS \
            --fail-with-body \
            -X POST \
            "$AUTH_URL" \
            -H "apikey: $FH_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$FH_EMAIL\",\"password\":\"$FH_PASSWORD\"}")

          ACCESS_TOKEN=$(python -c '
          import json
          import sys

          data = json.loads(sys.stdin.read())

          token = data.get("access_token")

          if not token:
              error = (
                  data.get("error_description")
                  or data.get("msg")
                  or data.get("error")
                  or "Autenticazione fallita"
              )

              print(
                  f"ERRORE AUTENTICAZIONE: {error}",
                  file=sys.stderr
              )

              sys.exit(1)

          print(token)
          ' <<< "$RESPONSE")

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERRORE: JWT non ricevuto"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"

          echo "JWT ottenuto correttamente."

          echo "FH_ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"

          echo "Autenticazione completata."

      - name: Validate JWT lifetime
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CONTROLLO VALIDITÀ JWT"
          echo "========================================"

          python - <<'PY'
          import os
          import base64
          import json
          import time
          from datetime import datetime, timezone

          token = os.environ.get("FH_ACCESS_TOKEN", "")

          if not token:
              print("ERRORE: FH_ACCESS_TOKEN non presente")
              raise SystemExit(1)

          parts = token.split(".")

          if len(parts) != 3:
              print("ERRORE: token non strutturato come JWT")
              raise SystemExit(1)

          payload = parts[1]
          payload += "=" * (-len(payload) % 4)

          try:
              claims = json.loads(
                  base64.urlsafe_b64decode(payload)
              )
          except Exception as exc:
              print(f"ERRORE lettura JWT: {exc}")
              raise SystemExit(1)

          now = int(time.time())

          iat = claims.get("iat")
          exp = claims.get("exp")

          if not exp:
              print("ERRORE: il JWT non contiene exp")
              raise SystemExit(1)

          print("JWT ricevuto: SI")
          print("issuer:", claims.get("iss", "MANCANTE"))
          print("audience:", claims.get("aud", "MANCANTE"))
          print("role:", claims.get("role", "MANCANTE"))

          if iat:
              print(
                  "emesso:",
                  datetime.fromtimestamp(
                      iat,
                      timezone.utc
                  ).isoformat()
              )

          print(
              "scadenza:",
              datetime.fromtimestamp(
                  exp,
                  timezone.utc
              ).isoformat()
          )

          print(
              "ora server:",
              datetime.fromtimestamp(
                  now,
                  timezone.utc
              ).isoformat()
          )

          remaining = exp - now

          print(
              f"validità residua: {remaining} secondi"
          )

          if remaining <= 0:
              print("")
              print("ERRORE: JWT GIÀ SCADUTO")
              print("Il token ottenuto da Supabase non è utilizzabile.")
              raise SystemExit(1)

          if remaining < 60:
              print("")
              print(
                  "ERRORE: JWT scade tra meno di 60 secondi."
              )
              print(
                  "Non è sufficientemente sicuro per eseguire lo scanner."
              )
              raise SystemExit(1)

          print("")
          print("OK: JWT valido e non scaduto.")
          PY

      - name: Verify access token
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFICA ACCESS TOKEN"
          echo "========================================"

          if [ -z "$FH_ACCESS_TOKEN" ]; then
            echo "ERRORE: FH_ACCESS_TOKEN non disponibile"
            exit 1
          fi

          echo "OK: FH_ACCESS_TOKEN disponibile"
          echo "Il valore del token non verrà mostrato."

      - name: Test Volotea stations
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "TEST VOLOTEA STATIONS"
          echo "========================================"

          python - <<'PY'
          import json
          import requests

          URL = "https://json.volotea.com/dist/stations/stations.json"

          print("")
          print("Download:")
          print(URL)
          print("")

          response = requests.get(
              URL,
              timeout=60,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "application/json",
              },
          )

          print("HTTP status:", response.status_code)
          print(
              "Content-Type:",
              response.headers.get("content-type")
          )
          print(
              "Dimensione:",
              len(response.content),
              "bytes"
          )

          response.raise_for_status()

          data = response.json()

          print("")
          print(
              "Tipo JSON:",
              type(data).__name__
          )

          if isinstance(data, dict):

              print(
                  "Numero elementi principali:",
                  len(data)
              )

              print("")
              print("Prime 10 chiavi:")

              for key in list(data.keys())[:10]:
                  print(" -", key)

              print("")
              print("Ricerca VRN...")

              vrn = data.get("VRN")

              if vrn is None:

                  print(
                      "VRN non trovato come chiave principale."
                  )

                  for key, value in data.items():

                      if isinstance(value, dict):

                          if (
                              value.get("iata") == "VRN"
                              or value.get("code") == "VRN"
                          ):

                              vrn = value

                              print(
                                  "VRN trovato sotto la chiave:",
                                  key
                              )

                              break

              if vrn is not None:

                  print("")
                  print("STRUTTURA VRN:")

                  print(
                      json.dumps(
                          vrn,
                          indent=2,
                          ensure_ascii=False
                      )[:10000]
                  )

              else:

                  print(
                      "ATTENZIONE: VRN non trovato."
                  )

          elif isinstance(data, list):

              print(
                  "Numero elementi:",
                  len(data)
              )

              if data:

                  print("")
                  print("Primo elemento:")

                  print(
                      json.dumps(
                          data[0],
                          indent=2,
                          ensure_ascii=False
                      )[:5000]
                  )

          else:

              print(
                  "Struttura JSON inattesa."
              )

          print("")
          print("========================================")
          print("TEST COMPLETATO")
          print("========================================")
          PY

      - name: Run Flight Hunter Scanner
        shell: bash
        run: |
          set -o pipefail

          echo "========================================"
          echo "AVVIO FLIGHT HUNTER"
          echo "========================================"

          echo ""
          echo "Esecuzione:"
          echo "python -u main.py"
          echo ""

          python -u main.py 2>&1 | tee flight_hunter.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "CODICE USCITA MAIN.PY: $EXIT_CODE"
          echo "========================================"

          if [ "$EXIT_CODE" -ne 0 ]; then

            echo ""
            echo "========================================"
            echo "ERRORE FLIGHT HUNTER"
            echo "========================================"

            cat flight_hunter.log

            echo "========================================"

            exit "$EXIT_CODE"

          fi

      - name: Upload scanner log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: flight-hunter-log
          path: flight_hunter.log
          if-no-files-found: ignore

      - name: Scanner completed
        if: success()
        run: |
          echo "========================================"
          echo "FLIGHT HUNTER COMPLETATO CON SUCCESSO"
          echo "========================================"

      - name: Scanner failed
        if: failure()
        run: |
          echo "========================================"
          echo "FLIGHT HUNTER FALLITO"
          echo "========================================"
          echo "Controlla i passaggi precedenti per individuare l'errore."
