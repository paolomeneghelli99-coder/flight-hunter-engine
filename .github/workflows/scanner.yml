          def select_airport_robust_destination(
              page,
              field,
              code,
              city,
          ):
              """
              Versione dedicata alla destinazione.
              Utilizza la stessa strategia robusta della partenza
              ma senza ricercare nuovamente il campo nel DOM.
              """

              log("")
              log(
                  "SELEZIONE DESTINAZIONE"
              )
              log("========================================")

              safe_click(
                  field,
                  "Apertura campo destinazione",
              )

              page.wait_for_timeout(500)

              focus_input(
                  page,
                  field,
                  "Focus destinazione",
              )

              force_enable_input(
                  page,
                  field,
                  "Campo destinazione",
              )

              # --------------------------------------------------
              # METODO 1
              # --------------------------------------------------

              native_set_value(
                  page,
                  field,
                  city,
                  "Destinazione",
              )

              page.wait_for_timeout(2500)

              inspect_airport_dom(
                  page,
                  code,
                  city,
                  "DIAGNOSTICA DESTINAZIONE",
              )

              if click_airport_result(
                  page,
                  code,
                  city,
                  "CLICK RISULTATO DESTINAZIONE",
              ):
                  page.wait_for_timeout(1500)

                  if verify_destination(
                      page,
                      code,
                      city,
                  ):
                      return True

              # --------------------------------------------------
              # METODO 2
              # --------------------------------------------------

              force_enable_input(
                  page,
                  field,
                  "Destinazione",
              )

              safe_click(
                  field,
                  "Riattivazione destinazione",
              )

              try:
                  page.keyboard.press(
                      "Control+A"
                  )

                  page.keyboard.press(
                      "Backspace"
                  )

                  page.keyboard.type(
                      city,
                      delay=150,
                  )

              except Exception as exc:
                  log(
                      "Errore digitazione destinazione:"
                  )

                  log(repr(exc))

              page.wait_for_timeout(3000)

              inspect_airport_dom(
                  page,
                  code,
                  city,
                  "DIAGNOSTICA DESTINAZIONE DOPO DIGITAZIONE",
              )

              if click_airport_result(
                  page,
                  code,
                  city,
                  "CLICK DESTINAZIONE DOPO DIGITAZIONE",
              ):
                  page.wait_for_timeout(1500)

                  if verify_destination(
                      page,
                      code,
                      city,
                  ):
                      return True

              # --------------------------------------------------
              # METODO 3
              # --------------------------------------------------

              try:
                  force_enable_input(
                      page,
                      field,
                      "Destinazione",
                  )

                  safe_click(
                      field,
                      "Destinazione",
                  )

                  page.keyboard.press(
                      "Control+A"
                  )

                  page.keyboard.press(
                      "Backspace"
                  )

                  page.keyboard.type(
                      code,
                      delay=200,
                  )

              except Exception as exc:
                  log(
                      "Errore codice destinazione:"
                  )

                  log(repr(exc))

              page.wait_for_timeout(3000)

              if click_airport_result(
                  page,
                  code,
                  city,
                  "CLICK DESTINAZIONE CODICE",
              ):
                  page.wait_for_timeout(1500)

                  if verify_destination(
                      page,
                      code,
                      city,
                  ):
                      return True

              # --------------------------------------------------
              # METODO 4
              # --------------------------------------------------

              try:
                  safe_click(
                      field,
                      "Destinazione",
                  )

                  page.keyboard.press(
                      "ArrowDown"
                  )

                  page.wait_for_timeout(500)

                  page.keyboard.press(
                      "Enter"
                  )

                  page.wait_for_timeout(1500)

              except Exception as exc:
                  log(
                      "Errore tastiera destinazione:"
                  )

                  log(repr(exc))

              if verify_destination(
                  page,
                  code,
                  city,
              ):
                  return True

              log(
                  "ERRORE: destinazione "
                  "non selezionata."
              )

              return False


          def verify_destination(
              page,
              code,
              city,
          ):
              selectors = [
                  "#destination:visible",
                  "#input-text_sf-destination:visible",
                  "input[name='destination']:visible",
              ]

              for selector in selectors:
                  try:
                      locator = page.locator(
                          selector
                      ).first

                      if locator.count() == 0:
                          continue

                      if not locator.is_visible():
                          continue

                      value = locator.input_value()

                      log(
                          f"Destinazione "
                          f"{selector}: '{value}'"
                      )

                      if (
                          code.upper()
                          in value.upper()
                          or city.upper()
                          in value.upper()
                      ):
                          log(
                              "DESTINAZIONE "
                              "SELEZIONATA CORRETTAMENTE."
                          )

                          return True

                  except Exception:
                      pass

              return False


          if __name__ == "__main__":
              sys.exit(main())
