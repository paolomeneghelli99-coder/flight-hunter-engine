name: Flight Hunter Scanner

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: flight-hunter-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests python-dateutil beautifulsoup4 lxml
          fi

      - name: Get access token
        env:
          FH_BACKEND_URL: ${{ secrets.FH_BACKEND_URL }}
          FH_PUBLISHABLE_KEY: ${{ secrets.FH_PUBLISHABLE_KEY }}
          FH_EMAIL: ${{ secrets.FH_EMAIL }}
          FH_PASSWORD: ${{ secrets.FH_PASSWORD }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -X POST \
            "${FH_BACKEND_URL}/auth/v1/token?grant_type=password" \
            -H "apikey: ${FH_PUBLISHABLE_KEY}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg email "$FH_EMAIL" --arg password "$FH_PASSWORD" \
                  '{email: $email, password: $password}')")

          TOKEN=$(printf '%s' "$RESPONSE" | jq -r '.access_token // empty')

          if [ -z "$TOKEN" ]; then
            echo "Autenticazione fallita:"
            printf '%s' "$RESPONSE" | jq -r '.error_description // .msg // .error // "errore sconosciuto"'
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "FH_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Run scanner
        env:
          FH_ACCESS_TOKEN: ${{ env.FH_ACCESS_TOKEN }}
          FH_IMPORT_URL: https://flight-hunter.lovable.app/api/public/offers/import
          FH_BACKEND_URL: ${{ secrets.FH_BACKEND_URL }}
          FH_PUBLISHABLE_KEY: ${{ secrets.FH_PUBLISHABLE_KEY }}
        run: python main.py

