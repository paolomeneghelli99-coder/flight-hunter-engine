name: Flight Hunter Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  scanner:
    name: Run Flight Hunter Scanner
    runs-on: ubuntu-latest

    env:
      FH_BACKEND_URL: ${{ secrets.FH_BACKEND_URL }}
      FH_PUBLISHABLE_KEY: ${{ secrets.FH_PUBLISHABLE_KEY }}
      FH_EMAIL: ${{ secrets.FH_EMAIL }}
      FH_PASSWORD: ${{ secrets.FH_PASSWORD }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      # ============================================================
      # DIPENDENZE
      # ============================================================

      - name: Install dependencies
        run: |
          set -e

          echo "========================================"
          echo "INSTALLAZIONE DIPENDENZE"
          echo "========================================"

          python --version
          python -m pip --version

          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

          echo ""
          echo "Installazione Chromium per Playwright..."

          python -m playwright install --with-deps chromium

          echo ""
          echo "Dipendenze installate correttamente."


      # ============================================================
      # CONTROLLO REPOSITORY
      # ============================================================

      - name: Check repository
        run: |
          set -e

          echo "========================================"
          echo "STRUTTURA REPOSITORY"
          echo "========================================"

          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            | sort

          echo ""
          echo "Controllo main.py..."

          test -f main.py
          echo "OK: main.py presente"

          echo ""
          echo "Controllo scanners..."

          test -d scanners
          echo "OK: cartella scanners presente"

          find scanners -maxdepth 2 -type f | sort

          echo ""
          echo "Controllo scanners principali..."

          test -f scanners/base.py
          test -f scanners/ryanair.py
          test -f scanners/volotea.py
          test -f scanners/__init__.py

          echo "OK: scanner Ryanair presente"
          echo "OK: scanner Volotea presente"


      # ============================================================
      # CONTROLLO SECRET
      # ============================================================

      - name: Check required secrets
        run: |
          set -e

          echo "========================================"
          echo "VERIFICA SECRET"
          echo "========================================"

          if [ -z "$FH_BACKEND_URL" ]; then
            echo "ERRORE: FH_BACKEND_URL mancante"
            exit 1
          fi

          if [ -z "$FH_PUBLISHABLE_KEY" ]; then
            echo "ERRORE: FH_PUBLISHABLE_KEY mancante"
            exit 1
          fi

          if [ -z "$FH_EMAIL" ]; then
            echo "ERRORE: FH_EMAIL mancante"
            exit 1
          fi

          if [ -z "$FH_PASSWORD" ]; then
            echo "ERRORE: FH_PASSWORD mancante"
            exit 1
          fi

          echo "OK: tutti i secret sono presenti"


      # ============================================================
      # AUTENTICAZIONE SUPABASE
      # ============================================================

      - name: Authenticate with Supabase
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "AUTENTICAZIONE FLIGHT HUNTER"
          echo "========================================"

          AUTH_URL="${FH_BACKEND_URL%/}/auth/v1/token?grant_type=password"

          echo "Endpoint autenticazione:"
          echo "${FH_BACKEND_URL%/}/auth/v1/token"

          RESPONSE=$(curl -sS \
            --fail-with-body \
            -X POST \
            "$AUTH_URL" \
            -H "apikey: $FH_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$FH_EMAIL\",\"password\":\"$FH_PASSWORD\"}")

          ACCESS_TOKEN=$(python -c '
          import json
          import sys

          data = json.loads(sys.stdin.read())

          token = data.get("access_token")

          if not token:
              error = (
                  data.get("error_description")
                  or data.get("msg")
                  or data.get("error")
                  or "Autenticazione fallita"
              )

              print(
                  f"ERRORE AUTENTICAZIONE: {error}",
                  file=sys.stderr
              )

              sys.exit(1)

          print(token)
          ' <<< "$RESPONSE")

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERRORE: JWT non ricevuto"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"

          echo "JWT ottenuto correttamente."

          echo "FH_ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"

          echo "Autenticazione completata."


      # ============================================================
      # VALIDAZIONE JWT
      # ============================================================

      - name: Validate JWT lifetime
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CONTROLLO VALIDITÀ JWT"
          echo "========================================"

          python - <<'PY'
          import os
          import base64
          import json
          import time
          from datetime import datetime, timezone

          token = os.environ.get("FH_ACCESS_TOKEN", "")

          if not token:
              print("ERRORE: FH_ACCESS_TOKEN non presente")
              raise SystemExit(1)

          parts = token.split(".")

          if len(parts) != 3:
              print("ERRORE: token non strutturato come JWT")
              raise SystemExit(1)

          payload = parts[1]
          payload += "=" * (-len(payload) % 4)

          try:
              claims = json.loads(
                  base64.urlsafe_b64decode(payload)
              )
          except Exception as exc:
              print(f"ERRORE lettura JWT: {exc}")
              raise SystemExit(1)

          now = int(time.time())

          iat = claims.get("iat")
          exp = claims.get("exp")

          if not exp:
              print("ERRORE: il JWT non contiene exp")
              raise SystemExit(1)

          print("JWT ricevuto: SI")
          print("issuer:", claims.get("iss", "MANCANTE"))
          print("audience:", claims.get("aud", "MANCANTE"))
          print("role:", claims.get("role", "MANCANTE"))

          if iat:
              print(
                  "emesso:",
                  datetime.fromtimestamp(
                      iat,
                      timezone.utc
                  ).isoformat()
              )

          print(
              "scadenza:",
              datetime.fromtimestamp(
                  exp,
                  timezone.utc
              ).isoformat()
          )

          print(
              "ora server:",
              datetime.fromtimestamp(
                  now,
                  timezone.utc
              ).isoformat()
          )

          remaining = exp - now

          print(
              f"validità residua: {remaining} secondi"
          )

          if remaining <= 0:
              print("")
              print("ERRORE: JWT GIÀ SCADUTO")
              raise SystemExit(1)

          if remaining < 60:
              print("")
              print(
                  "ERRORE: JWT scade tra meno di 60 secondi."
              )
              raise SystemExit(1)

          print("")
          print("OK: JWT valido e non scaduto.")
          PY


      # ============================================================
      # TEST VOLOTEA STATIONS + SEARCH API
      # ============================================================

      - name: Test Volotea API
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "TEST VOLOTEA API"
          echo "========================================"

          python - <<'PY'
          import json
          import requests
          from datetime import date, timedelta

          STATIONS_URL = (
              "https://json.volotea.com/"
              "dist/stations/stations.json"
          )

          SEARCH_URL = (
              "https://api.volotea.com/"
              "api/spa/voe/v1/flights/search"
          )

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/124.0 Safari/537.36"
              ),
              "Accept": "application/json, text/plain, */*",
              "Accept-Language": "it-IT,it;q=0.9,en;q=0.8",
              "Content-Type": "application/json",
              "Origin": "https://www.volotea.com",
              "Referer": "https://www.volotea.com/",
          }

          session = requests.Session()
          session.headers.update(HEADERS)

          print("")
          print("1. DOWNLOAD STATIONS")
          print("----------------------------------------")

          response = session.get(
              STATIONS_URL,
              timeout=60,
          )

          print(
              "HTTP status:",
              response.status_code
          )

          response.raise_for_status()

          stations = response.json()

          if not isinstance(stations, dict):
              raise RuntimeError(
                  "stations.json non contiene un dizionario"
              )

          print(
              "Stazioni presenti:",
              len(stations)
          )

          if "VRN" not in stations:
              raise RuntimeError(
                  "VRN non trovato in stations.json"
              )

          vrn = stations["VRN"]

          markets = vrn.get("Markets") or {}

          print(
              "Mercati VRN:",
              len(markets)
          )

          if "CTA" not in markets:
              raise RuntimeError(
                  "CTA non presente nei Markets di VRN"
              )

          market = markets["CTA"]

          print("")
          print("VRN -> CTA")
          print("----------------------------------------")
          print(
              "Enabled:",
              market.get("Enabled")
          )
          print(
              "FlightType:",
              market.get("FlightType")
          )
          print(
              "MinFlightDate:",
              market.get("MinFlightDate")
          )
          print(
              "MaxFlightDate:",
              market.get("MaxFlightDate")
          )

          if not market.get("Enabled"):
              raise RuntimeError(
                  "La rotta VRN -> CTA non è Enabled"
              )

          min_date = market.get("MinFlightDate")
          max_date = market.get("MaxFlightDate")

          oggi = date.today()

          data_test = oggi + timedelta(days=1)

          if min_date:
              data_test = max(
                  data_test,
                  date.fromisoformat(min_date)
              )

          if max_date:
              if data_test > date.fromisoformat(max_date):
                  raise RuntimeError(
                      "Nessuna data valida disponibile "
                      "per il test VRN -> CTA"
                  )

          data_str = data_test.isoformat()

          print("")
          print(
              "Data utilizzata per il test:",
              data_str
          )

          print("")
          print("2. POST FLIGHTS/SEARCH")
          print("----------------------------------------")

          payload = {
              "codes": {
                  "currency": "EUR",
                  "promotionCode": "",
                  "bookingType": 2,
                  "residentType": "NONE",
              },

              "criteria": [
                  {
                      "beginDate": data_str,
                      "endDate": data_str,
                      "selectedDate": data_str,
                      "origin": "VRN",
                      "destination": "CTA",
                  }
              ],

              "fareTypesToRequest": [
                  "R",
                  "S",
                  "SP",
              ],

              "passengers": [
                  {
                      "type": "ADT",
                      "count": 1,
                  }
              ],
          }

          print("Endpoint:")
          print(SEARCH_URL)

          print("")
          print("Payload:")
          print(
              json.dumps(
                  payload,
                  indent=2,
                  ensure_ascii=False
              )
          )

          response = session.post(
              SEARCH_URL,
              json=payload,
              timeout=60,
          )

          print("")
          print(
              "HTTP status:",
              response.status_code
          )

          if response.status_code != 200:
              print("")
              print("RISPOSTA API:")
              print(response.text[:5000])

          response.raise_for_status()

          data = response.json()

          print("")
          print("Risposta JSON ricevuta: SI")
          print(
              "Dimensione risposta:",
              len(response.content),
              "bytes"
          )

          # --------------------------------------------------------
          # Ricerca ricorsiva dei voli
          # --------------------------------------------------------

          voli = []

          def visita(obj):

              if isinstance(obj, dict):

                  if (
                      "fares" in obj
                      and "designator" in obj
                  ):
                      voli.append(obj)

                  for value in obj.values():
                      visita(value)

              elif isinstance(obj, list):

                  for value in obj:
                      visita(value)

          visita(data)

          print("")
          print(
              "Oggetti volo trovati:",
              len(voli)
          )

          if not voli:
              print("")
              print(
                  "ATTENZIONE: API raggiungibile, "
                  "ma nessun volo trovato per "
                  f"VRN -> CTA del {data_str}."
              )

              print("")
              print(
                  "Questo NON significa che l'API "
                  "non funzioni."
              )

              raise SystemExit(0)

          # --------------------------------------------------------
          # Estrazione del primo volo
          # --------------------------------------------------------

          volo = voli[0]

          designator = (
              volo.get("designator")
              or {}
          )

          print("")
          print("3. PRIMO VOLO TROVATO")
          print("----------------------------------------")

          print(
              "Origine:",
              designator.get("origin")
          )

          print(
              "Destinazione:",
              designator.get("destination")
          )

          print(
              "Partenza:",
              designator.get("departure")
          )

          print(
              "Arrivo:",
              designator.get("arrival")
          )

          print(
              "Durata:",
              volo.get("flightDuration")
          )

          segments = (
              volo.get("segments")
              or []
          )

          if segments:

              identifier = (
                  segments[0].get("identifier")
                  or {}
              )

              print(
                  "Numero volo:",
                  identifier.get("identifier")
              )

              print(
                  "Compagnia:",
                  identifier.get("carrierCode")
              )

          # --------------------------------------------------------
          # Estrazione prezzo
          # --------------------------------------------------------

          prezzi = []

          for fare in volo.get(
              "fares",
              []
          ):

              for passenger in fare.get(
                  "passengerFares",
                  []
              ):

                  if passenger.get(
                      "passengerType"
                  ) != "ADT":
                      continue

                  fare_amount = (
                      passenger.get(
                          "fareAmount"
                      )
                      or {}
                  )

                  prezzo = (
                      fare_amount.get(
                          "eurAmount"
                      )
                      or fare_amount.get(
                          "amount"
                      )
                  )

                  if prezzo is not None:

                      try:
                          prezzo = float(prezzo)

                          if prezzo > 0:
                              prezzi.append(
                                  prezzo
                              )

                      except (
                          TypeError,
                          ValueError
                      ):
                          pass

          print("")

          if prezzi:

              print(
                  "Prezzo minimo trovato:",
                  f"{min(prezzi):.2f} EUR"
              )

          else:

              print(
                  "ATTENZIONE: nessun prezzo "
                  "ADT trovato."
              )

          print("")
          print("========================================")
          print("TEST VOLOTEA COMPLETATO")
          print("========================================")

          print("")
          print(
              "OK: stations.json funziona."
          )

          print(
              "OK: rotta VRN -> CTA individuata."
          )

          print(
              "OK: Search API raggiungibile."
          )

          print(
              "OK: risposta JSON interpretata."
          )

          print(
              "OK: struttura volo interpretata."
          )

          if prezzi:
              print(
                  "OK: prezzo interpretato."
              )

          print("")
          print(
              "Volotea è pronta per essere "
              "integrata nello scanner."
          )
          PY


      # ============================================================
      # VERIFICA ACCESS TOKEN
      # ============================================================

      - name: Verify access token
        run: |
          set -e

          echo "========================================"
          echo "VERIFICA ACCESS TOKEN"
          echo "========================================"

          if [ -z "$FH_ACCESS_TOKEN" ]; then
            echo "ERRORE: FH_ACCESS_TOKEN non disponibile"
            exit 1
          fi

          echo "OK: FH_ACCESS_TOKEN disponibile"
          echo "Il valore del token non verrà mostrato."


      # ============================================================
      # AVVIO FLIGHT HUNTER
      # ============================================================

      - name: Run Flight Hunter Scanner
        shell: bash
        run: |
          set -o pipefail

          echo "========================================"
          echo "AVVIO FLIGHT HUNTER"
          echo "========================================"

          echo ""
          echo "Esecuzione:"
          echo "python -u main.py"
          echo ""

          python -u main.py 2>&1 | tee flight_hunter.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "CODICE USCITA MAIN.PY: $EXIT_CODE"
          echo "========================================"

          if [ "$EXIT_CODE" -ne 0 ]; then

            echo ""
            echo "========================================"
            echo "ERRORE FLIGHT HUNTER"
            echo "========================================"

            cat flight_hunter.log

            echo "========================================"

            exit "$EXIT_CODE"
          fi


      # ============================================================
      # LOG
      # ============================================================

      - name: Upload scanner log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: flight-hunter-log
          path: flight_hunter.log
          if-no-files-found: ignore


      # ============================================================
      # SUCCESSO
      # ============================================================

      - name: Scanner completed
        if: success()
        run: |
          echo "========================================"
          echo "FLIGHT HUNTER COMPLETATO CON SUCCESSO"
          echo "========================================"


      # ============================================================
      # ERRORE
      # ============================================================

      - name: Scanner failed
        if: failure()
        run: |
          echo "========================================"
          echo "FLIGHT HUNTER FALLITO"
          echo "========================================"

          echo "Controlla i passaggi precedenti per individuare l'errore."
