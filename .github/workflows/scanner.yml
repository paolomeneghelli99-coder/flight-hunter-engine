name: Flight Hunter Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  scanner:
    name: Run Flight Hunter Scanner
    runs-on: ubuntu-latest

    env:
      FH_BACKEND_URL: ${{ secrets.FH_BACKEND_URL }}
      FH_PUBLISHABLE_KEY: ${{ secrets.FH_PUBLISHABLE_KEY }}
      FH_EMAIL: ${{ secrets.FH_EMAIL }}
      FH_PASSWORD: ${{ secrets.FH_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Check scanner files
        run: |
          echo "Contenuto repository:"
          find . -maxdepth 3 -type f | sort

          echo ""
          echo "Verifica scanner.py..."

          if [ -f scanner.py ]; then
            echo "OK: scanner.py trovato nella root"
          elif [ -f scripts/scanner.py ]; then
            echo "OK: scripts/scanner.py trovato"
          else
            echo "ERRORE: scanner.py non trovato"
            exit 1
          fi

      - name: Check required secrets
        run: |
          echo "Controllo configurazione..."

          if [ -z "$FH_BACKEND_URL" ]; then
            echo "ERRORE: FH_BACKEND_URL non configurato"
            exit 1
          fi

          if [ -z "$FH_PUBLISHABLE_KEY" ]; then
            echo "ERRORE: FH_PUBLISHABLE_KEY non configurato"
            exit 1
          fi

          if [ -z "$FH_EMAIL" ]; then
            echo "ERRORE: FH_EMAIL non configurato"
            exit 1
          fi

          if [ -z "$FH_PASSWORD" ]; then
            echo "ERRORE: FH_PASSWORD non configurato"
            exit 1
          fi

          echo "OK: tutti i secret sono presenti"

      - name: Run Flight Hunter Scanner
        run: |
          echo "========================================"
          echo "Avvio scanner Flight Hunter..."
          echo "========================================"

          if [ -f scanner.py ]; then
            python scanner.py
          elif [ -f scripts/scanner.py ]; then
            python scripts/scanner.py
          else
            echo "ERRORE: impossibile trovare scanner.py"
            exit 1
          fi

      - name: Scanner completed
        if: success()
        run: |
          echo "========================================"
          echo "Flight Hunter Scanner completato"
          echo "========================================"

      - name: Scanner failed
        if: failure()
        run: |
          echo "========================================"
          echo "ERRORE: Flight Hunter Scanner fallito"
          echo "========================================"
          exit 1
