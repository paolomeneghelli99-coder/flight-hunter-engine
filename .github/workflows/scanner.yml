name: Flight Hunter Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Test Volotea real search
        env:
          VOLOTEA_API_KEY: ${{ secrets.VOLOTEA_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "TEST VOLOTEA - RICERCA REALE"
          echo "========================================"

          cat > /tmp/test_volotea.py <<'PYTHON'
          import json
          import os
          import sys
          from datetime import date, timedelta

          import requests
          from playwright.sync_api import sync_playwright


          STATIONS_URL = (
              "https://json.volotea.com/"
              "dist/stations/stations.json"
          )

          BOOKING_URL = "https://book.volotea.com/"

          SEARCH_PATH = "/api/spa/voe/v1/flights/search"

          ORIGIN = "VRN"
          DESTINATION = "CTA"

          USER_AGENT = (
              "Mozilla/5.0 "
              "(Linux; Android 6.0; Nexus 5 Build/MRA58N) "
              "AppleWebKit/537.36 "
              "(KHTML, like Gecko) "
              "Chrome/147.0.0.0 "
              "Mobile Safari/537.36"
          )


          def log(message=""):
              print(message, flush=True)


          def dump_json(label, data, limit=30000):
              log("")
              log(label)
              log("----------------------------------------")

              try:
                  text = json.dumps(
                      data,
                      indent=2,
                      ensure_ascii=False,
                  )
              except Exception:
                  text = str(data)

              if len(text) > limit:
                  text = text[:limit] + "\n...[TRONCATO]..."

              log(text)


          def main():

              # ==================================================
              # 1. DOWNLOAD STATIONS
              # ==================================================

              log("")
              log("1. DOWNLOAD STATIONS")
              log("----------------------------------------")

              try:
                  response = requests.get(
                      STATIONS_URL,
                      timeout=60,
                      headers={
                          "User-Agent": USER_AGENT,
                          "Accept": "application/json",
                          "Accept-Language":
                              "it-IT,it;q=0.9,en;q=0.8",
                      },
                  )

                  log(
                      f"HTTP status: {response.status_code}"
                  )

                  response.raise_for_status()

                  stations = response.json()

              except Exception as exc:
                  log("")
                  log("ERRORE DOWNLOAD STATIONS")
                  log(repr(exc))
                  return 1


              if not isinstance(stations, dict):
                  log(
                      "ERRORE: stations.json "
                      "non è un dizionario."
                  )
                  return 1


              log(
                  f"Stazioni presenti: "
                  f"{len(stations)}"
              )


              if ORIGIN not in stations:
                  log(
                      f"ERRORE: {ORIGIN} "
                      "non trovato."
                  )
                  return 1


              origin_data = stations[ORIGIN]

              markets = (
                  origin_data.get("Markets")
                  or {}
              )


              log(
                  f"Mercati {ORIGIN}: "
                  f"{len(markets)}"
              )


              if DESTINATION not in markets:
                  log(
                      f"ERRORE: {DESTINATION} "
                      f"non presente nei Markets "
                      f"di {ORIGIN}."
                  )
                  return 1


              market = markets[DESTINATION]


              log("")
              log(
                  f"{ORIGIN} -> {DESTINATION}"
              )
              log("----------------------------------------")

              log(
                  f"Enabled: "
                  f"{market.get('Enabled')}"
              )

              log(
                  f"FlightType: "
                  f"{market.get('FlightType')}"
              )

              log(
                  f"MinFlightDate: "
                  f"{market.get('MinFlightDate')}"
              )

              log(
                  f"MaxFlightDate: "
                  f"{market.get('MaxFlightDate')}"
              )


              if not market.get("Enabled"):
                  log(
                      "ERRORE: tratta non abilitata."
                  )
                  return 1


              min_date = market.get(
                  "MinFlightDate"
              )

              max_date = market.get(
                  "MaxFlightDate"
              )


              test_date = (
                  date.today()
                  + timedelta(days=1)
              )


              if min_date:
                  test_date = max(
                      test_date,
                      date.fromisoformat(
                          min_date
                      ),
                  )


              if max_date:
                  max_date_obj = date.fromisoformat(
                      max_date
                  )

                  if test_date > max_date_obj:
                      log(
                          "ERRORE: nessuna data "
                          "valida disponibile."
                      )
                      return 1


              departure_date = (
                  test_date.isoformat()
              )


              log("")
              log("RICERCA DI TEST")
              log("----------------------------------------")
              log(f"Origine:      {ORIGIN}")
              log(f"Destinazione: {DESTINATION}")
              log(f"Data:         {departure_date}")
              log("Tipo:         SOLO ANDATA")
              log("Passeggeri:   1")


              # ==================================================
              # 2. BROWSER
              # ==================================================

              log("")
              log("2. APERTURA FRONTEND VOLOTEA")
              log("----------------------------------------")


              api_key = os.environ.get(
                  "VOLOTEA_API_KEY",
                  "",
              ).strip()


              if api_key:
                  log(
                      "VOLOTEA_API_KEY: configurata"
                  )
              else:
                  log(
                      "VOLOTEA_API_KEY: "
                      "non configurata"
                  )


              captured_requests = []
              captured_responses = []


              with sync_playwright() as p:

                  browser = p.chromium.launch(
                      headless=True
                  )


                  context = browser.new_context(
                      locale="it-IT",
                      user_agent=USER_AGENT,
                      viewport={
                          "width": 1366,
                          "height": 900,
                      },
                      extra_http_headers={
                          "Accept-Language":
                              "it-IT,it;q=0.9,en;q=0.8",
                      },
                  )


                  page = context.new_page()


                  # ==================================================
                  # REQUEST INTERCEPTION
                  # ==================================================

                  def handle_request(request):

                      url = request.url

                      if SEARCH_PATH not in url:
                          return


                      headers = request.all_headers()

                      safe_headers = {}


                      for key, value in headers.items():

                          lower = key.lower()


                          if lower in (
                              "authorization",
                              "x-api-key",
                              "x-session-token",
                              "cookie",
                          ):

                              safe_headers[key] = (
                                  "[PRESENTE]"
                              )

                          else:

                              safe_headers[key] = value


                      item = {
                          "method": request.method,
                          "url": url,
                          "headers": safe_headers,
                      }


                      post_data = request.post_data


                      if post_data:

                          try:
                              item["post_data"] = (
                                  json.loads(
                                      post_data
                                  )
                              )

                          except Exception:

                              item["post_data"] = (
                                  post_data[:20000]
                              )


                      captured_requests.append(
                          item
                      )


                      log("")
                      log(
                          "========================================"
                      )
                      log(
                          "FLIGHTS/SEARCH INTERCETTATA"
                      )
                      log(
                          "========================================"
                      )


                      log(
                          f"METHOD: "
                          f"{request.method}"
                      )

                      log(
                          f"URL: "
                          f"{url}"
                      )


                      log("")
                      log("HEADER:")


                      for key in sorted(
                          safe_headers
                      ):

                          log(
                              f"  {key}: "
                              f"{safe_headers[key]}"
                          )


                      if "post_data" in item:
                          dump_json(
                              "PAYLOAD:",
                              item["post_data"],
                              30000,
                          )
                      else:
                          log("")
                          log("PAYLOAD:")
                          log(
                              "Payload non disponibile."
                          )


                  # ==================================================
                  # RESPONSE INTERCEPTION
                  # ==================================================

                  def handle_response(response):

                      url = response.url

                      if SEARCH_PATH not in url:
                          return


                      item = {
                          "status": response.status,
                          "url": url,
                      }


                      try:

                          body = response.body()

                          item["size"] = len(body)


                          content_type = (
                              response.headers.get(
                                  "content-type",
                                  "",
                              )
                          )


                          item["content_type"] = (
                              content_type
                          )


                          if (
                              "json"
                              in content_type.lower()
                          ):

                              try:

                                  item["json"] = (
                                      json.loads(
                                          body
                                      )
                                  )

                              except Exception:
                                  pass


                      except Exception as exc:

                          item["error"] = repr(
                              exc
                          )


                      captured_responses.append(
                          item
                      )


                      log("")
                      log(
                          "========================================"
                      )
                      log(
                          "RISPOSTA FLIGHTS/SEARCH"
                      )
                      log(
                          "========================================"
                      )


                      log(
                          f"HTTP STATUS: "
                          f"{response.status}"
                      )

                      log(
                          f"URL: "
                          f"{url}"
                      )

                      log(
                          f"SIZE: "
                          f"{item.get('size', 0)} bytes"
                      )


                      if "json" in item:

                          dump_json(
                              "RISPOSTA JSON:",
                              item["json"],
                              30000,
                          )


                  page.on(
                      "request",
                      handle_request
                  )

                  page.on(
                      "response",
                      handle_response
                  )


                  # ==================================================
                  # 3. APERTURA FRONTEND
                  # ==================================================

                  log("")
                  log(
                      f"Apertura: {BOOKING_URL}"
                  )


                  try:

                      page.goto(
                          BOOKING_URL,
                          wait_until="domcontentloaded",
                          timeout=90000,
                      )

                  except Exception as exc:

                      log("")
                      log(
                          "ATTENZIONE apertura "
                          "frontend:"
                      )

                      log(repr(exc))


                  page.wait_for_timeout(
                      8000
                  )


                  log("")
                  log(
                      f"URL finale: {page.url}"
                  )

                  log(
                      f"Titolo: {page.title()}"
                  )


                  # ==================================================
                  # 4. COOKIE
                  # ==================================================

                  try:

                      cookies = context.cookies()

                      log("")
                      log(
                          f"Cookie browser: "
                          f"{len(cookies)}"
                      )

                  except Exception:
                      pass


                  # ==================================================
                  # 5. ANALISI FORM VISIBILE
                  # ==================================================

                  log("")
                  log(
                      "3. ANALISI FORM VISIBILE"
                  )
                  log("----------------------------------------")


                  visible_inputs = page.locator(
                      "input:visible"
                  ).all()


                  log(
                      f"Input visibili: "
                      f"{len(visible_inputs)}"
                  )


                  for index, element in enumerate(
                      visible_inputs[:30]
                  ):

                      try:

                          attrs = element.evaluate(
                              """
                              el => ({
                                  type: el.type,
                                  name: el.name,
                                  id: el.id,
                                  placeholder: el.placeholder,
                                  value: el.value,
                                  aria: el.getAttribute("aria-label")
                              })
                              """
                          )

                          log(
                              f"VISIBLE INPUT {index}: "
                              + json.dumps(
                                  attrs,
                                  ensure_ascii=False,
                              )
                          )

                      except Exception:
                          pass


                  # ==================================================
                  # 6. CHIUSURA COOKIE BANNER
                  # ==================================================

                  log("")
                  log(
                      "4. GESTIONE COOKIE"
                  )
                  log("----------------------------------------")


                  cookie_buttons = [
                      "button:has-text('Aceptar sólo las esenciales')",
                      "button:has-text('Accept only necessary')",
                      "button:has-text('Accetta solo i necessari')",
                      "button:has-text('Accept essential only')",
                  ]


                  cookie_closed = False


                  for selector in cookie_buttons:

                      try:

                          locator = page.locator(
                              selector
                          ).first


                          if locator.is_visible(
                              timeout=1000
                          ):

                              log(
                                  "Cookie banner "
                                  "rilevato."
                              )

                              locator.click(
                                  timeout=5000
                              )

                              page.wait_for_timeout(
                                  1000
                              )

                              log(
                                  "Cookie banner "
                                  "chiuso."
                              )

                              cookie_closed = True

                              break

                      except Exception:
                          pass


                  if not cookie_closed:

                      log(
                          "Nessun cookie banner "
                          "da chiudere."
                      )


                  # ==================================================
                  # 7. CAMPO PARTENZA VISIBILE
                  # ==================================================

                  log("")
                  log(
                      "5. COMPILAZIONE PARTENZA"
                  )
                  log("----------------------------------------")


                  origin_field = page.locator(
                      "#input-text_sf-origin:visible"
                  ).first


                  destination_field = page.locator(
                      "#input-text_sf-destination:visible"
                  ).first


                  departure_field = page.locator(
                      "#input-text_sf-departure:visible"
                  ).first


                  return_field = page.locator(
                      "#input-text_sf-return:visible"
                  ).first


                  log(
                      f"Origin visibile: "
                      f"{origin_field.count()}"
                  )

                  log(
                      f"Destination visibile: "
                      f"{destination_field.count()}"
                  )

                  log(
                      f"Departure visibile: "
                      f"{departure_field.count()}"
                  )

                  log(
                      f"Return visibile: "
                      f"{return_field.count()}"
                  )


                  if origin_field.count() == 0:

                      log(
                          "ERRORE: campo partenza "
                          "visibile non trovato."
                      )

                      page.screenshot(
                          path="/tmp/volotea-error.png",
                          full_page=True,
                      )

                      browser.close()

                      return 1


                  # ==================================================
                  # 8. PARTENZA
                  # ==================================================

                  log("")
                  log(
                      "Compilazione aeroporto "
                      "di partenza..."
                  )


                  try:

                      origin_field.click(
                          timeout=10000
                      )

                      origin_field.fill(
                          ORIGIN
                      )

                      page.wait_for_timeout(
                          1500
                      )

                      log(
                          "Partenza compilata."
                      )

                  except Exception as exc:

                      log(
                          "ERRORE compilazione "
                          "partenza:"
                      )

                      log(repr(exc))

                      browser.close()

                      return 1


                  # ==================================================
                  # 9. ANALISI SUGGERIMENTI
                  # ==================================================

                  log("")
                  log(
                      "6. SUGGERIMENTI PARTENZA"
                  )
                  log("----------------------------------------")


                  try:

                      texts = page.locator(
                          "text=VRN"
                      ).all()


                      log(
                          f"Elementi contenenti "
                          f"VRN: {len(texts)}"
                      )


                      for index, element in enumerate(
                          texts[:20]
                      ):

                          try:

                              if element.is_visible():

                                  log(
                                      f"VRN ELEMENT "
                                      f"{index}: "
                                      f"{element.inner_text()}"
                                  )

                          except Exception:
                              pass

                  except Exception as exc:

                      log(
                          "Errore analisi "
                          "suggerimenti:"
                      )

                      log(repr(exc))


                  # ==================================================
                  # 10. SELEZIONE PARTENZA
                  # ==================================================

                  log("")
                  log(
                      "7. SELEZIONE PARTENZA"
                  )
                  log("----------------------------------------")


                  selected_origin = False


                  origin_selectors = [
                      "[role='option']:has-text('VRN')",
                      "li:has-text('VRN')",
                      "div:has-text('VRN')",
                  ]


                  for selector in origin_selectors:

                      try:

                          candidates = page.locator(
                              selector
                          )


                          count = candidates.count()


                          for index in range(
                              min(count, 20)
                          ):

                              candidate = (
                                  candidates.nth(
                                      index
                                  )
                              )


                              try:

                                  if not candidate.is_visible():
                                      continue

                                  text = (
                                      candidate.inner_text()
                                      .strip()
                                  )


                                  if (
                                      "VRN" in text
                                      or "Verona"
                                      in text
                                  ):

                                      log(
                                          "Seleziono "
                                          "suggerimento: "
                                          f"{text}"
                                      )

                                      candidate.click(
                                          timeout=5000
                                      )

                                      selected_origin = True

                                      break

                              except Exception:
                                  pass


                          if selected_origin:
                              break

                      except Exception:
                          pass


                  if not selected_origin:

                      log(
                          "ATTENZIONE: non è stato "
                          "possibile selezionare "
                          "automaticamente VRN."
                      )

                  else:

                      log(
                          "VRN selezionato."
                      )


                  # ==================================================
                  # 11. DESTINAZIONE
                  # ==================================================

                  log("")
                  log(
                      "8. COMPILAZIONE DESTINAZIONE"
                  )
                  log("----------------------------------------")


                  if destination_field.count() == 0:

                      log(
                          "ERRORE: campo destinazione "
                          "visibile non trovato."
                      )

                      browser.close()

                      return 1


                  try:

                      destination_field.click(
                          timeout=10000
                      )

                      destination_field.fill(
                          DESTINATION
                      )

                      page.wait_for_timeout(
                          1500
                      )

                      log(
                          "Destinazione compilata."
                      )

                  except Exception as exc:

                      log(
                          "ERRORE compilazione "
                          "destinazione:"
                      )

                      log(repr(exc))

                      browser.close()

                      return 1


                  # ==================================================
                  # 12. SELEZIONE DESTINAZIONE
                  # ==================================================

                  log("")
                  log(
                      "9. SELEZIONE DESTINAZIONE"
                  )
                  log("----------------------------------------")


                  selected_destination = False


                  destination_selectors = [
                      "[role='option']:has-text('CTA')",
                      "li:has-text('CTA')",
                      "div:has-text('CTA')",
                  ]


                  for selector in destination_selectors:

                      try:

                          candidates = page.locator(
                              selector
                          )


                          count = candidates.count()


                          for index in range(
                              min(count, 20)
                          ):

                              candidate = (
                                  candidates.nth(
                                      index
                                  )
                              )


                              try:

                                  if not candidate.is_visible():
                                      continue

                                  text = (
                                      candidate.inner_text()
                                      .strip()
                                  )


                                  if (
                                      "CTA" in text
                                      or "Catania"
                                      in text
                                  ):

                                      log(
                                          "Seleziono "
                                          "suggerimento: "
                                          f"{text}"
                                      )

                                      candidate.click(
                                          timeout=5000
                                      )

                                      selected_destination = True

                                      break

                              except Exception:
                                  pass


                          if selected_destination:
                              break

                      except Exception:
                          pass


                  if not selected_destination:

                      log(
                          "ATTENZIONE: non è stato "
                          "possibile selezionare "
                          "automaticamente CTA."
                      )

                  else:

                      log(
                          "CTA selezionato."
                      )


                  # ==================================================
                  # 13. DATA PARTENZA
                  # ==================================================

                  log("")
                  log(
                      "10. SELEZIONE DATA PARTENZA"
                  )
                  log("----------------------------------------")


                  if departure_field.count() == 0:

                      log(
                          "ERRORE: campo data "
                          "partenza non trovato."
                      )

                      browser.close()

                      return 1


                  try:

                      departure_field.click(
                          timeout=10000
                      )

                      page.wait_for_timeout(
                          1000
                      )

                      log(
                          "Calendario aperto."
                      )

                  except Exception as exc:

                      log(
                          "ERRORE apertura "
                          "calendario:"
                      )

                      log(repr(exc))


                  # ==================================================
                  # 14. ANALISI CALENDARIO
                  # ==================================================

                  log("")
                  log(
                      "11. ANALISI CALENDARIO"
                  )
                  log("----------------------------------------")


                  try:

                      buttons = page.locator(
                          "button:visible"
                      ).all()


                      log(
                          f"Button visibili: "
                          f"{len(buttons)}"
                      )


                      for index, button in enumerate(
                          buttons[:80]
                      ):

                          try:

                              text = (
                                  button.inner_text()
                                  .strip()
                              )

                              aria = (
                                  button.get_attribute(
                                      "aria-label"
                                  )
                              )

                              title = (
                                  button.get_attribute(
                                      "title"
                                  )
                              )


                              if (
                                  text
                                  or aria
                                  or title
                              ):

                                  log(
                                      f"CAL BUTTON "
                                      f"{index}: "
                                      f"text={text!r} "
                                      f"aria={aria!r} "
                                      f"title={title!r}"
                                  )

                          except Exception:
                              pass

                  except Exception as exc:

                      log(
                          "Errore analisi "
                          "calendario:"
                      )

                      log(repr(exc))


                  # ==================================================
                  # 15. TENTATIVO DATA
                  # ==================================================

                  log("")
                  log(
                      "12. TENTATIVO SELEZIONE DATA"
                  )
                  log("----------------------------------------")


                  date_selected = False


                  date_selectors = [
                      f"[data-date='{departure_date}']",
                      f"[data-day='{departure_date}']",
                      f"button[data-date='{departure_date}']",
                      f"button[data-day='{departure_date}']",
                  ]


                  for selector in date_selectors:

                      try:

                          candidate = page.locator(
                              selector
                          ).first


                          if (
                              candidate.count() > 0
                              and candidate.is_visible()
                          ):

                              log(
                                  "Elemento data "
                                  f"trovato: "
                                  f"{selector}"
                              )

                              candidate.click(
                                  timeout=5000
                              )

                              date_selected = True

                              break

                      except Exception:
                          pass


                  if date_selected:

                      log(
                          f"Data selezionata: "
                          f"{departure_date}"
                      )

                  else:

                      log(
                          "DATA NON SELEZIONATA "
                          "AUTOMATICAMENTE."
                      )

                      log(
                          "Il test termina qui "
                          "senza inviare una "
                          "richiesta API manuale."
                      )


                  # ==================================================
                  # 16. SEARCH FLIGHTS
                  # ==================================================

                  if date_selected:

                      log("")
                      log(
                          "13. AVVIO RICERCA VOLO"
                      )
                      log("----------------------------------------")


                      search_buttons = page.locator(
                          "button:visible"
                      )


                      clicked_search = False


                      for index in range(
                          search_buttons.count()
                      ):

                          try:

                              button = (
                                  search_buttons.nth(
                                      index
                                  )
                              )


                              text = (
                                  button.inner_text()
                                  .strip()
                                  .lower()
                              )


                              if (
                                  "search flights"
                                  in text
                                  or "cerca voli"
                                  in text
                              ):

                                  log(
                                      "Pulsante ricerca "
                                      "trovato."
                                  )

                                  button.click(
                                      timeout=10000
                                  )

                                  clicked_search = True

                                  log(
                                      "Ricerca avviata."
                                  )

                                  break

                          except Exception:
                              pass


                      if not clicked_search:

                          log(
                              "ERRORE: pulsante "
                              "Search flights "
                              "non trovato."
                          )

                      else:

                          log("")
                          log(
                              "Attesa risposta "
                              "flights/search..."
                          )

                          page.wait_for_timeout(
                              10000
                          )


                  # ==================================================
                  # 17. SCREENSHOT FINALE
                  # ==================================================

                  try:

                      page.screenshot(
                          path="/tmp/volotea-final.png",
                          full_page=True,
                      )

