name: Flight Hunter Scanner

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: flight-hunter-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Installa dipendenze Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test login Flight Hunter
        env:
          FH_BACKEND_URL: ${{ secrets.FH_BACKEND_URL }}
          FH_PUBLISHABLE_KEY: ${{ secrets.FH_PUBLISHABLE_KEY }}
          FH_EMAIL: ${{ secrets.FH_EMAIL }}
          FH_PASSWORD: ${{ secrets.FH_PASSWORD }}
        run: |
          set -euo pipefail

          RESPONSE=$(curl -i -sS -X POST \
            "${FH_BACKEND_URL}/auth/v1/token?grant_type=password" \
            -H "apikey: ${FH_PUBLISHABLE_KEY}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg email "$FH_EMAIL" \
              --arg password "$FH_PASSWORD" \
              '{email:$email,password:$password}')")

          echo "===== RISPOSTA SERVER ====="
          echo "$RESPONSE" | head -40
          echo "===== FINE RISPOSTA ====="
