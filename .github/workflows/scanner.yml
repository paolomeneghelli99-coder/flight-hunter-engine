name: Flight Hunter Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Run Flight Hunter scanner
        env:
          FH_BACKEND_URL: ${{ secrets.FH_BACKEND_URL }}
          FH_API_KEY: ${{ secrets.FH_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VOLOTEA_API_KEY: ${{ secrets.VOLOTEA_API_KEY }}
        run: |
          cat > scanner.py <<'PY'
          import os
          import json
          import re
          import time
          from datetime import datetime, timedelta

          import requests
          from playwright.sync_api import sync_playwright, TimeoutError as PlaywrightTimeoutError


          # ============================================================
          # CONFIG
          # ============================================================

          ORIGIN = "VRN"
          DESTINATION = "CTA"
          DEPARTURE_DATE = "2026-08-11"
          PASSENGERS = 1

          VOLOTEA_HOME = "https://book.volotea.com/"
          VOLOTEA_SEARCH = "https://book.volotea.com/search"

          FH_BACKEND_URL = os.getenv("FH_BACKEND_URL", "")
          FH_API_KEY = os.getenv("FH_API_KEY", "")
          VOLOTEA_API_KEY = os.getenv("VOLOTEA_API_KEY", "")

          HEADLESS = True


          # ============================================================
          # LOG
          # ============================================================

          def log(message=""):
              print(message, flush=True)


          # ============================================================
          # GENERIC HELPERS
          # ============================================================

          def safe_text(locator):
              try:
                  return locator.inner_text(timeout=3000).strip()
              except Exception:
                  return ""

          def visible(locator):
              try:
                  return locator.is_visible(timeout=2000)
              except Exception:
                  return False

          def click_force(locator):
              locator.click(force=True, timeout=10000)

          def dump_visible_inputs(page, title):
              log("")
              log(title)
              log("-" * 60)

              inputs = page.locator("input:visible")
              count = inputs.count()

              log(f"Input visibili: {count}")

              for i in range(count):
                  try:
                      data = inputs.nth(i).evaluate("""
                      el => ({
                          tag: el.tagName,
                          type: el.type,
                          id: el.id,
                          name: el.name,
                          placeholder: el.placeholder,
                          value: el.value,
                          readonly: el.readOnly,
                          disabled: el.disabled,
                          autocomplete: el.autocomplete,
                          className: el.className
                      })
                      """)
                      log(json.dumps(data, ensure_ascii=False, indent=2))
                  except Exception as exc:
                      log(f"Input {i}: errore {exc}")


          # ============================================================
          # STATIONS
          # ============================================================

          def download_stations():
              log("")
              log("1. DOWNLOAD STATIONS")
              log("=" * 60)

              # Endpoint già utilizzato dal progetto.
              # Manteniamo la struttura compatibile con il backend corrente.
              if not FH_BACKEND_URL:
                  log("FH_BACKEND_URL non configurato")
                  return []

              url = FH_BACKEND_URL.rstrip("/") + "/stations"

              headers = {}

              if FH_API_KEY:
                  headers["Authorization"] = f"Bearer {FH_API_KEY}"

              try:
                  response = requests.get(url, headers=headers, timeout=30)

                  log(f"HTTP status: {response.status_code}")

                  if response.status_code != 200:
                      log(response.text[:1000])
                      return []

                  data = response.json()

                  if isinstance(data, list):
                      stations = data
                  elif isinstance(data, dict):
                      stations = (
                          data.get("stations")
                          or data.get("data")
                          or []
                      )
                  else:
                      stations = []

                  log(f"Stazioni presenti: {len(stations)}")

                  markets = []

                  for station in stations:
                      if not isinstance(station, dict):
                          continue

                      code = (
                          station.get("iata")
                          or station.get("iata_code")
                          or station.get("code")
                      )

                      if code == ORIGIN:
                          destinations = (
                              station.get("destinations")
                              or station.get("markets")
                              or []
                          )

                          for destination in destinations:
                              if isinstance(destination, dict):
                                  dcode = (
                                      destination.get("iata")
                                      or destination.get("iata_code")
                                      or destination.get("code")
                                  )
                              else:
                                  dcode = str(destination)

                              if dcode:
                                  markets.append(dcode)

                  if markets:
                      log(f"Mercati {ORIGIN}: {len(set(markets))}")

                  return stations

              except Exception as exc:
                  log(f"Errore download stations: {exc}")
                  return []


          # ============================================================
          # VOLOTEA
          # ============================================================

          def run_volotea_test():

              log("")
              log("2. APERTURA FRONTEND VOLOTEA")
              log("=" * 60)

              log(
                  "VOLOTEA_API_KEY: "
                  + ("configurata" if VOLOTEA_API_KEY else "non configurata")
              )

              log(f"Apertura: {VOLOTEA_HOME}")
              log("Attesa inizializzazione frontend: 10 secondi")

              with sync_playwright() as p:

                  browser = p.chromium.launch(
                      headless=HEADLESS,
                      args=[
                          "--no-sandbox",
                          "--disable-dev-shm-usage",
                          "--disable-blink-features=AutomationControlled",
                      ],
                  )

                  context = browser.new_context(
                      locale="it-IT",
                      timezone_id="Europe/Rome",
                      viewport={
                          "width": 1440,
                          "height": 1000,
                      },
                      user_agent=(
                          "Mozilla/5.0 (X11; Linux x86_64) "
                          "AppleWebKit/537.36 "
                          "(KHTML, like Gecko) "
                          "Chrome/147.0.0.0 Safari/537.36"
                      ),
                  )

                  page = context.new_page()

                  # ----------------------------------------------------
                  # API logging
                  # ----------------------------------------------------

                  api_requests = []
                  api_responses = []

                  def on_request(request):
                      url = request.url

                      if "api.volotea.com" in url:
                          api_requests.append({
                              "method": request.method,
                              "url": url
                          })

                  def on_response(response):
                      url = response.url

                      if "api.volotea.com" in url:
                          api_responses.append({
                              "status": response.status,
                              "url": url
                          })

                  page.on("request", on_request)
                  page.on("response", on_response)

                  # ----------------------------------------------------
                  # OPEN
                  # ----------------------------------------------------

                  page.goto(
                      VOLOTEA_HOME,
                      wait_until="domcontentloaded",
                      timeout=60000,
                  )

                  page.wait_for_timeout(10000)

                  log(f"URL finale: {page.url}")
                  log(f"Titolo: {page.title()}")

                  # ----------------------------------------------------
                  # COOKIE
                  # ----------------------------------------------------

                  log("")
                  log("3. GESTIONE COOKIE")
                  log("-" * 60)

                  cookie_selectors = [
                      "button:has-text('Aceptar sólo las esenciales')",
                      "button:has-text('Accept only necessary')",
                      "button:has-text('Solo essenziali')",
                  ]

                  cookie_closed = False

                  for selector in cookie_selectors:
                      try:
                          locator = page.locator(selector).first

                          if visible(locator):
                              log(f"Cookie banner trovato: {selector}")
                              click_force(locator)
                              page.wait_for_timeout(1000)
                              log("Chiusura cookie: CLICK NORMALE RIUSCITO")
                              cookie_closed = True
                              break

                      except Exception:
                          pass

                  if not cookie_closed:
                      log("Cookie banner non trovato o già chiuso")

                  # ----------------------------------------------------
                  # FORM INIZIALE
                  # ----------------------------------------------------

                  dump_visible_inputs(
                      page,
                      "4. FORM PRIMA DEL CLICK"
                  )

                  # ====================================================
                  # PUNTO CHIAVE DEL NUOVO COMPONENTE VOLOTEA
                  # ====================================================

                  log("")
                  log("5. APERTURA SELETTORE AEROPORTI")
                  log("=" * 60)

                  old_origin = page.locator(
                      "#input-text_sf-origin:visible"
                  ).first

                  old_origin.wait_for(
                      state="visible",
                      timeout=15000
                  )

                  log("Vecchio campo origine trovato.")

                  log(
                      "Il testo '(Canary Islands)' intercetta "
                      "il click normale."
                  )

                  log(
                      "Uso quindi CLICK FORZATO per aprire "
                      "il componente aeroporti."
                  )

                  click_force(old_origin)

                  log("Campo aeroporto origine: CLICK FORZATO RIUSCITO")

                  # Attesa del nuovo componente.
                  new_origin = page.locator(
                      "#origin:visible"
                  ).first

                  new_destination = page.locator(
                      "#destination:visible"
                  ).first

                  try:
                      new_origin.wait_for(
                          state="visible",
                          timeout=15000
                      )

                      new_destination.wait_for(
                          state="visible",
                          timeout=15000
                      )

                      log(
                          "Nuovo componente aeroporto: "
                          "INPUT #origin/#destination PRESENTE"
                      )

                  except PlaywrightTimeoutError:
                      log(
                          "ERRORE: il nuovo componente "
                          "#origin/#destination non è comparso."
                      )

                      page.screenshot(
                          path="/tmp/volotea-origin-failed.png",
                          full_page=True
                      )

                      browser.close()
                      return []

                  page.wait_for_timeout(1500)

                  dump_visible_inputs(
                      page,
                      "6. NUOVO FORM AEROPORTI"
                  )

                  # ====================================================
                  # ORIGINE
                  # ====================================================

                  log("")
                  log("7. SELEZIONE ORIGINE")
                  log("=" * 60)

                  new_origin.fill("")
                  new_origin.fill(ORIGIN)

                  page.wait_for_timeout(1000)

                  log(f"Ricerca aeroporto origine: {ORIGIN}")

                  # Cerca un elemento che rappresenti Verona.
                  # Non usiamo più il vecchio input.
                  origin_candidates = page.locator(
                      "button:visible, "
                      "[role='button']:visible"
                  )

                  origin_found = False

                  for i in range(origin_candidates.count()):
                      candidate = origin_candidates.nth(i)

                      try:
                          text = safe_text(candidate)

                          if (
                              ORIGIN in text
                              and (
                                  "Verona" in text
                                  or text.strip() == ORIGIN
                              )
                          ):
                              log(
                                  "Elemento origine trovato: "
                                  + repr(text)
                              )

                              click_force(candidate)
                              origin_found = True
                              break

                      except Exception:
                          continue

                  # Fallback specifico sulla struttura diagnosticata:
                  # strong "Verona" + p.c-iata-tag__text "VRN".
                  if not origin_found:
                      try:
                          iata = page.locator(
                              "p.c-iata-tag__text:visible"
                          ).filter(
                              has_text=ORIGIN
                          ).first

                          if visible(iata):
                              log("Selezione VRN tramite IATA.")
                              click_force(iata)
                              origin_found = True

                      except Exception:
                          pass

                  if not origin_found:
                      log(
                          f"ERRORE: aeroporto origine {ORIGIN} "
                          "non selezionato."
                      )

                      page.screenshot(
                          path="/tmp/volotea-origin-selection-failed.png",
                          full_page=True
                      )

                      browser.close()
                      return []

                  page.wait_for_timeout(1000)

                  log(f"Origine selezionata: {ORIGIN}")

                  # ====================================================
                  # DESTINAZIONE
                  # ====================================================

                  log("")
                  log("8. SELEZIONE DESTINAZIONE")
                  log("=" * 60)

                  # Dopo la selezione dell'origine il componente può
                  # cambiare stato. Recuperiamo SEMPRE il locator.
                  new_destination = page.locator(
                      "#destination:visible"
                  ).first

                  new_destination.wait_for(
                      state="visible",
                      timeout=15000
                  )

                  new_destination.fill("")
                  new_destination.fill(DESTINATION)

                  page.wait_for_timeout(1000)

                  log(f"Ricerca aeroporto destinazione: {DESTINATION}")

                  destination_candidates = page.locator(
                      "button:visible, "
                      "[role='button']:visible"
                  )

                  destination_found = False

                  for i in range(destination_candidates.count()):
                      candidate = destination_candidates.nth(i)

                      try:
                          text = safe_text(candidate)

                          if (
                              DESTINATION in text
                              and (
                                  "Catania" in text
                                  or text.strip() == DESTINATION
                              )
                          ):
                              log(
                                  "Elemento destinazione trovato: "
                                  + repr(text)
                              )

                              click_force(candidate)
                              destination_found = True
                              break

                      except Exception:
                          continue

                  if not destination_found:
                      try:
                          iata = page.locator(
                              "p.c-iata-tag__text:visible"
                          ).filter(
                              has_text=DESTINATION
                          ).first

                          if visible(iata):
                              log("Selezione CTA tramite IATA.")
                              click_force(iata)
                              destination_found = True

                      except Exception:
                          pass

                  if not destination_found:
                      log(
                          f"ERRORE: aeroporto destinazione "
                          f"{DESTINATION} non selezionato."
                      )

                      page.screenshot(
                          path="/tmp/volotea-destination-selection-failed.png",
                          full_page=True
                      )

                      browser.close()
                      return []

                  page.wait_for_timeout(1000)

                  log(f"Destinazione selezionata: {DESTINATION}")

                  # ====================================================
                  # DATA
                  # ====================================================

                  log("")
                  log("9. SELEZIONE DATA")
                  log("=" * 60)

                  log(f"Data richiesta: {DEPARTURE_DATE}")

                  # Volotea può usare datepicker diversi a seconda
                  # della versione del frontend.
                  date_selected = False

                  # Prima proviamo input di tipo date.
                  date_inputs = page.locator(
                      "input[type='date']:visible"
                  )

                  if date_inputs.count() > 0:
                      try:
                          date_inputs.first.fill(DEPARTURE_DATE)
                          date_selected = True
                          log(
                              "Data impostata tramite input[type=date]."
                          )
                      except Exception:
                          pass

                  # Se non esiste un input date, cerchiamo elementi
                  # che contengano la data.
                  if not date_selected:

                      target_date = datetime.strptime(
                          DEPARTURE_DATE,
                          "%Y-%m-%d"
                      )

                      # Se il datepicker non è già aperto, cerchiamo
                      # un campo data cliccabile.
                      date_field_selectors = [
                          "input[placeholder*='date' i]:visible",
                          "input[placeholder*='departure' i]:visible",
                          "input[placeholder*='data' i]:visible",
                          "[class*='date']:visible",
                      ]

                      for selector in date_field_selectors:
                          try:
                              field = page.locator(selector).first

                              if visible(field):
                                  click_force(field)
                                  page.wait_for_timeout(500)
                                  break

                          except Exception:
                              continue

                      # Ricerca del giorno 11.
                      day = str(target_date.day)

                      day_candidates = page.locator(
                          "button:visible, "
                          "[role='button']:visible, "
                          "[class*='day']:visible"
                      )

                      for i in range(day_candidates.count()):
                          candidate = day_candidates.nth(i)

                          try:
                              text = safe_text(candidate)

                              if text == day:
                                  click_force(candidate)
                                  date_selected = True
                                  log(
                                      f"Giorno {day} selezionato."
                                  )
                                  break

                          except Exception:
                              continue

                  if not date_selected:
                      log(
                          "ATTENZIONE: data non selezionata "
                          "automaticamente."
                      )

                      page.screenshot(
                          path="/tmp/volotea-date-selection-failed.png",
                          full_page=True
                      )

                  # ====================================================
                  # PASSEGGERI
                  # ====================================================

                  log("")
                  log("10. PASSEGGERI")
                  log("=" * 60)

                  pax = page.locator(
                      "#pax:visible"
                  ).first

                  if visible(pax):
                      try:
                          log(
                              "Passeggeri attuali: "
                              + safe_text(pax)
                          )
                      except Exception:
                          pass

                  # ====================================================
                  # FORM FINALE
                  # ====================================================

                  log("")
                  log("11. FORM FINALE")
                  log("=" * 60)

                  dump_visible_inputs(
                      page,
                      "Stato finale prima della ricerca"
                  )

                  log("")
                  log(f"Origine prevista:      {ORIGIN}")
                  log(f"Destinazione prevista: {DESTINATION}")
                  log(f"Data prevista:         {DEPARTURE_DATE}")
                  log(f"Passeggeri:             {PASSENGERS}")

                  # ====================================================
                  # SEARCH FLIGHTS
                  # ====================================================

                  log("")
                  log("12. RICERCA VOLO")
                  log("=" * 60)

                  search_button = page.locator(
                      "button:visible"
                  ).filter(
                      has_text=re.compile(
                          r"Search flights|Cerca voli",
                          re.I
                      )
                  ).first

                  if not visible(search_button):
                      log(
                          "ERRORE: pulsante Search flights "
                          "non trovato."
                      )

                      page.screenshot(
                          path="/tmp/volotea-search-button-failed.png",
                          full_page=True
                      )

                      browser.close()
                      return []

                  log("Pulsante Search flights trovato.")

                  click_force(search_button)

                  log("Ricerca Volotea avviata.")

                  # Attesa caricamento risultati.
                  page.wait_for_timeout(8000)

                  log(f"URL dopo ricerca: {page.url}")

                  page.screenshot(
                      path="/tmp/volotea-search-result.png",
                      full_page=True
                  )

                  # ====================================================
                  # RISULTATI
                  # ====================================================

                  log("")
                  log("13. ANALISI RISULTATI")
                  log("=" * 60)

                  body_text = page.locator("body").inner_text(
                      timeout=10000
                  )

                  # Log sintetico, non tutto il DOM.
                  lines = [
                      line.strip()
                      for line in body_text.splitlines()
                      if line.strip()
                  ]

                  price_pattern = re.compile(
                      r"(?:€\s*)?\d+(?:[.,]\d{1,2})?\s*€?"
                  )

                  prices = []

                  for line in lines:
                      if (
                          "€" in line
                          or "EUR" in line.upper()
                      ):
                          if price_pattern.search(line):
                              prices.append(line)

                  log(
                      f"Possibili righe prezzo trovate: "
                      f"{len(prices)}"
                  )

                  for price in prices[:30]:
                      log(f"  {price}")

                  # ====================================================
                  # NETWORK SUMMARY
                  # ====================================================

                  log("")
                  log("NETWORK SUMMARY")
                  log("=" * 60)

                  log(
                      f"Richieste API Volotea: "
                      f"{len(api_requests)}"
                  )

                  log(
                      f"Risposte API Volotea: "
                      f"{len(api_responses)}"
                  )

                  for response in api_responses:
                      log(
                          f"{response['status']} "
                          f"{response['url']}"
                      )

                  # ====================================================
                  # RESULT
                  # ====================================================

                  log("")
                  log("RISULTATO TEST")
                  log("=" * 60)

                  log(
                      f"ORIGINE: {ORIGIN}"
                  )

                  log(
                      f"DESTINAZIONE: {DESTINATION}"
                  )

                  log(
                      f"DATA: {DEPARTURE_DATE}"
                  )

                  log(
                      f"DATA SELEZIONATA: "
                      f"{'SI' if date_selected else 'NO'}"
                  )

                  log(
                      f"URL FINALE: {page.url}"
                  )

                  browser.close()

                  return prices


          # ============================================================
          # MAIN
          # ============================================================

          def main():

              log("Avvio scanner Flight Hunter...")
              log("")

              # --------------------------------------------------------
              # STATIONS
              # --------------------------------------------------------

              stations = download_stations()

              # --------------------------------------------------------
              # TEST ROUTE
              # --------------------------------------------------------

              log("")
              log(f"## {ORIGIN} -> {DESTINATION}")
              log("")
              log("Enabled: True")
              log("FlightType: Direct")
              log("MinFlightDate: 2026-08-10")
              log("MaxFlightDate: 2027-10-30")

              log("")
              log("## RICERCA DI TEST")
              log("")
              log(f"Origine:      {ORIGIN}")
              log(f"Destinazione: {DESTINATION}")
              log(f"Data:         {DEPARTURE_DATE}")
              log("Tipo:         SOLO ANDATA")
              log(f"Passeggeri:   {PASSENGERS}")

              # --------------------------------------------------------
              # VOLOTEA
              # --------------------------------------------------------

              try:
                  run_volotea_test()
              except Exception as exc:
                  log("")
                  log("ERRORE FATALE VOLOTEA")
                  log("=" * 60)
                  log(repr(exc))

                  raise

              log("")
              log("Scanner terminato.")


          if __name__ == "__main__":
              main()
          PY

          python scanner.py
