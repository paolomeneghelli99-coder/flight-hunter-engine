name: Flight Hunter Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Test Volotea real search
        env:
          VOLOTEA_API_KEY: ${{ secrets.VOLOTEA_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "TEST VOLOTEA - RICERCA REALE"
          echo "========================================"

          cat > /tmp/test_volotea.py <<'PYTHON'
          import json
          import os
          import sys
          from datetime import date, timedelta

          import requests
          from playwright.sync_api import sync_playwright


          STATIONS_URL = (
              "https://json.volotea.com/"
              "dist/stations/stations.json"
          )

          BOOKING_URL = "https://book.volotea.com/"

          API_PREFIX = "/api/spa/voe/"

          ORIGIN = "VRN"
          ORIGIN_CITY = "Verona"

          DESTINATION = "CTA"
          DESTINATION_CITY = "Catania"

          USER_AGENT = (
              "Mozilla/5.0 "
              "(Linux; Android 6.0; Nexus 5 Build/MRA58N) "
              "AppleWebKit/537.36 "
              "(KHTML, like Gecko) "
              "Chrome/147.0.0.0 "
              "Mobile Safari/537.36"
          )


          def log(message=""):
              print(message, flush=True)


          def dump_json(label, data, limit=30000):
              log("")
              log(label)
              log("----------------------------------------")

              try:
                  text = json.dumps(
                      data,
                      indent=2,
                      ensure_ascii=False,
                  )
              except Exception:
                  text = str(data)

              if len(text) > limit:
                  text = (
                      text[:limit]
                      + "\n...[TRONCATO]..."
                  )

              log(text)


          def safe_click(locator, description):
              try:
                  locator.click(timeout=5000)

                  log(
                      f"{description}: "
                      "click normale riuscito."
                  )

                  return True

              except Exception as first_error:
                  log(
                      f"{description}: "
                      "click normale non riuscito."
                  )

                  log(
                      f"Motivo: {first_error}"
                  )

              try:
                  locator.click(
                      timeout=5000,
                      force=True,
                  )

                  log(
                      f"{description}: "
                      "click forzato riuscito."
                  )

                  return True

              except Exception as second_error:
                  log(
                      f"{description}: "
                      "click forzato non riuscito."
                  )

                  log(
                      f"Motivo: {second_error}"
                  )

              return False


          def focus_input(page, locator, description):
              try:
                  locator.evaluate(
                      """
                      el => {
                          el.scrollIntoView({
                              block: "center",
                              inline: "center"
                          });
                          el.focus();
                      }
                      """
                  )

                  log(
                      f"{description}: "
                      "focus DOM riuscito."
                  )

                  return True

              except Exception as exc:
                  log(
                      f"{description}: "
                      "errore focus DOM:"
                  )

                  log(repr(exc))

                  return False


          def force_enable_input(page, locator, description):
              """
              Volotea in alcuni caricamenti presenta il campo
              autocomplete come readonly/non-editable.

              Rimuoviamo temporaneamente gli attributi che
              impediscono l'interazione e manteniamo il normale
              sistema di eventi del browser.
              """

              try:
                  result = locator.evaluate(
                      """
                      el => {
                          const before = {
                              value: el.value,
                              readOnly: el.readOnly,
                              disabled: el.disabled,
                              outerHTML: el.outerHTML
                          };

                          el.removeAttribute("readonly");
                          el.removeAttribute("disabled");

                          try {
                              el.readOnly = false;
                          } catch (e) {}

                          try {
                              el.disabled = false;
                          } catch (e) {}

                          return {
                              before: before,
                              after: {
                                  value: el.value,
                                  readOnly: el.readOnly,
                                  disabled: el.disabled
                              }
                          };
                      }
                      """
                  )

                  log(
                      f"{description}: "
                      "stato input:"
                  )

                  dump_json(
                      "INPUT STATE:",
                      result,
                      10000,
                  )

                  return True

              except Exception as exc:
                  log(
                      f"{description}: "
                      "impossibile forzare input."
                  )

                  log(repr(exc))

                  return False


          def native_set_value(
              page,
              locator,
              value,
              description,
          ):
              """
              Imposta il valore usando il setter nativo
              dell'elemento HTML e genera gli eventi input/change.

              Questo è più affidabile con componenti React
              rispetto a una semplice assegnazione JS.
              """

              try:
                  result = locator.evaluate(
                      """
                      (el, value) => {
                          const proto =
                              Object.getPrototypeOf(el);

                          const descriptor =
                              Object.getOwnPropertyDescriptor(
                                  proto,
                                  "value"
                              );

                          if (
                              descriptor &&
                              descriptor.set
                          ) {
                              descriptor.set.call(
                                  el,
                                  value
                              );
                          } else {
                              el.value = value;
                          }

                          el.dispatchEvent(
                              new Event(
                                  "input",
                                  {
                                      bubbles: true
                                  }
                              )
                          );

                          el.dispatchEvent(
                              new Event(
                                  "change",
                                  {
                                      bubbles: true
                                  }
                              );

                          el.dispatchEvent(
                              new Event(
                                  "blur",
                                  {
                                      bubbles: true
                                  }
                              );

                          return {
                              value: el.value,
                              readOnly: el.readOnly,
                              disabled: el.disabled
                          };
                      }
                      """,
                      value,
                  )

                  log(
                      f"{description}: "
                      f"valore nativo impostato a '{value}'."
                  )

                  dump_json(
                      "STATO DOPO NATIVE SET:",
                      result,
                      5000,
                  )

                  return True

              except Exception as exc:
                  log(
                      f"{description}: "
                      "native set non riuscito."
                  )

                  log(repr(exc))

                  return False


          def clear_input_with_keyboard(
              page,
              locator,
              description,
          ):
              try:
                  focus_input(
                      page,
                      locator,
                      description,
                  )

                  page.keyboard.press("Control+A")
                  page.keyboard.press("Backspace")

                  log(
                      f"{description}: "
                      "campo svuotato tramite tastiera."
                  )

                  return True

              except Exception as exc:
                  log(
                      f"{description}: "
                      "errore svuotamento:"
                  )

                  log(repr(exc))

                  return False


          def inspect_visible_inputs(page, title):
              log("")
              log(title)
              log("----------------------------------------")

              try:
                  inputs = page.locator(
                      "input:visible"
                  )

                  count = inputs.count()

                  log(
                      f"Input visibili: {count}"
                  )

                  for index in range(
                      min(count, 30)
                  ):
                      element = inputs.nth(index)

                      try:
                          attrs = element.evaluate(
                              """
                              el => ({
                                  type: el.type,
                                  name: el.name,
                                  id: el.id,
                                  placeholder:
                                      el.placeholder,
                                  value:
                                      el.value,
                                  aria:
                                      el.getAttribute(
                                          "aria-label"
                                      ),
                                  autocomplete:
                                      el.getAttribute(
                                          "autocomplete"
                                      ),
                                  readonly:
                                      el.readOnly,
                                  disabled:
                                      el.disabled
                              })
                              """
                          )

                          log(
                              f"INPUT {index}: "
                              + json.dumps(
                                  attrs,
                                  ensure_ascii=False,
                              )
                          )

                      except Exception:
                          pass

                  return inputs

              except Exception as exc:
                  log(
                      "Errore analisi input:"
                  )

                  log(repr(exc))

                  return None


          def inspect_airport_dom(page, code, city, label):
              """
              Diagnostica in modo molto più ampio il DOM.
              Non si limita a role=option/li perché il frontend
              Volotea può utilizzare div custom.
              """

              log("")
              log(label)
              log("----------------------------------------")

              terms = [
                  city,
                  f"{city} ({code})",
                  f"{city} - {code}",
                  f"{code} - {city}",
                  code,
              ]

              total_matches = 0

              for term in terms:
                  try:
                      locator = page.get_by_text(
                          term,
                          exact=False,
                      )

                      count = locator.count()

                      log(
                          f"Candidati testuali "
                          f"'{term}': {count}"
                      )

                      visible = 0

                      for index in range(
                          min(count, 30)
                      ):
                          element = locator.nth(index)

                          try:
                              if not element.is_visible():
                                  continue

                              text = (
                                  element.inner_text()
                                  .strip()
                              )

                              if not text:
                                  continue

                              visible += 1
                              total_matches += 1

                              log(
                                  f"  VISIBILE {visible}: "
                                  f"{text[:500]}"
                              )

                              try:
                                  attrs = element.evaluate(
                                      """
                                      el => ({
                                          tag:
                                              el.tagName,
                                          role:
                                              el.getAttribute(
                                                  "role"
                                              ),
                                          className:
                                              el.className,
                                          id:
                                              el.id,
                                          aria:
                                              el.getAttribute(
                                                  "aria-label"
                                              ),
                                          dataTest:
                                              el.getAttribute(
                                                  "data-testid"
                                              )
                                      })
                                      """
                                  )

                                  log(
                                      "    ATTR: "
                                      + json.dumps(
                                          attrs,
                                          ensure_ascii=False,
                                      )
                                  )

                              except Exception:
                                  pass

                          except Exception:
                              pass

                  except Exception:
                      pass

              log(
                  f"Totale elementi testuali "
                  f"visibili: {total_matches}"
              )

              # Analisi generica di possibili elementi autocomplete.
              selectors = [
                  "[role='option']",
                  "[role='listbox']",
                  "[role='combobox']",
                  "[aria-selected='true']",
                  "[data-testid*='airport' i]",
                  "[data-testid*='autocomplete' i]",
                  "[class*='airport' i]",
                  "[class*='autocomplete' i]",
                  "[class*='suggestion' i]",
                  "[class*='dropdown' i]",
                  "[class*='listbox' i]",
              ]

              log("")
              log(
                  "ELEMENTI GENERICI AUTOCOMPLETE"
              )
              log("----------------------------------------")

              found = 0

              for selector in selectors:
                  try:
                      locator = page.locator(
                          selector
                      )

                      count = locator.count()

                      if count == 0:
                          continue

                      for index in range(
                          min(count, 50)
                      ):
                          element = locator.nth(index)

                          try:
                              if not element.is_visible():
                                  continue

                              text = (
                                  element.inner_text()
                                  .strip()
                              )

                              if not text:
                                  continue

                              log(
                                  f"{selector} "
                                  f"[{index}]: "
                                  f"{text[:500]}"
                              )

                              found += 1

                          except Exception:
                              pass

                  except Exception:
                      pass

              log(
                  f"Elementi autocomplete generici "
                  f"visibili: {found}"
              )

              return total_matches > 0


          def click_airport_result(
              page,
              code,
              city,
              description,
          ):
              log("")
              log(description)
              log("----------------------------------------")

              patterns = [
                  f"{city} ({code})",
                  f"{city} - {code}",
                  f"{code} - {city}",
                  city,
                  code,
              ]

              for pattern in patterns:
                  try:
                      locator = page.get_by_text(
                          pattern,
                          exact=False,
                      )

                      count = locator.count()

                      log(
                          f"Cerco risultato "
                          f"'{pattern}': {count}"
                      )

                      for index in range(
                          min(count, 30)
                      ):
                          element = locator.nth(index)

                          try:
                              if not element.is_visible():
                                  continue

                              text = (
                                  element.inner_text()
                                  .strip()
                              )

                              if not text:
                                  continue

                              log(
                                  f"Tento click su: "
                                  f"{text[:500]}"
                              )

                              if safe_click(
                                  element,
                                  f"Selezione {code}",
                              ):
                                  page.wait_for_timeout(
                                      1500
                                  )

                                  return True

                          except Exception:
                              pass

                  except Exception:
                      pass

              return False


          def verify_airport_selection(
              page,
              code,
              city,
              description,
          ):
              log("")
              log(description)
              log("----------------------------------------")

              # --------------------------------------------------
              # 1. Cerca gli input attualmente visibili
              # --------------------------------------------------

              try:
                  inputs = page.locator(
                      "input:visible"
                  )

                  count = inputs.count()

                  for index in range(count):
                      element = inputs.nth(index)

                      try:
                          info = element.evaluate(
                              """
                              el => ({
                                  id: el.id,
                                  name: el.name,
                                  placeholder:
                                      el.placeholder,
                                  value:
                                      el.value,
                                  aria:
                                      el.getAttribute(
                                          "aria-label"
                                      )
                              })
                              """
                          )

                          text = json.dumps(
                              info,
                              ensure_ascii=False,
                          )

                          if (
                              code.upper()
                              in text.upper()
                              or city.upper()
                              in text.upper()
                          ):
                              log(
                                  "Possibile selezione "
                                  "presente nell'input:"
                              )

                              log(text)

                      except Exception:
                          pass

              except Exception:
                  pass

              # --------------------------------------------------
              # 2. Controllo esplicito input origin
              # --------------------------------------------------

              origin_candidates = [
                  "#origin:visible",
                  "#input-text_sf-origin:visible",
                  "input[name='origin']:visible",
                  "input[placeholder='Select airport']:visible",
              ]

              for selector in origin_candidates:
                  try:
                      locator = page.locator(
                          selector
                      ).first

                      if locator.count() == 0:
                          continue

                      if not locator.is_visible():
                          continue

                      value = locator.input_value()

                      log(
                          f"{description}: "
                          f"{selector} = '{value}'"
                      )

                      if (
                          code.upper()
                          in value.upper()
                          or city.upper()
                          in value.upper()
                      ):
                          log(
                              f"{description}: "
                              "SELEZIONE CONFERMATA."
                          )

                          return True

                  except Exception:
                      pass

              # --------------------------------------------------
              # 3. Controllo DOM generale
              # --------------------------------------------------

              try:
                  body_text = page.locator(
                      "body"
                  ).inner_text()

                  upper_text = body_text.upper()

                  if (
                      code.upper()
                      in upper_text
                      and city.upper()
                      in upper_text
                  ):
                      log(
                          f"{description}: "
                          "codice e città presenti "
                          "nel DOM visibile."
                      )

                  else:
                      log(
                          f"{description}: "
                          "codice/città non entrambi "
                          "presenti nel DOM."
                      )

              except Exception:
                  pass

              return False


          def select_airport_robust(
              page,
              code,
              city,
              description,
          ):
              """
              Strategia completa:

              1. Individua il campo.
              2. Lo attiva.
              3. Rimuove readonly/disabled se presenti.
              4. Prova input nativo.
              5. Prova digitazione reale.
              6. Cerca il dropdown.
              7. Prova click.
              8. Prova tastiera.
              9. Verifica realmente il valore finale.
              """

              log("")
              log(description)
              log("========================================")

              selectors = [
                  "#input-text_sf-origin:visible",
                  "#origin:visible",
                  "input[name='origin']:visible",
                  "input[placeholder='Select airport']:visible",
              ]

              field = None

              for selector in selectors:
                  try:
                      locator = page.locator(
                          selector
                      ).first

                      if locator.count() == 0:
                          continue

                      if not locator.is_visible():
                          continue

                      field = locator

                      log(
                          f"Campo aeroporto trovato "
                          f"con selettore: {selector}"
                      )

                      break

                  except Exception:
                      pass

              if field is None:
                  log(
                      "ERRORE: campo aeroporto "
                      "non trovato."
                  )

                  return False

              # --------------------------------------------------
              # STATO INIZIALE
              # --------------------------------------------------

              try:
                  info = field.evaluate(
                      """
                      el => ({
                          tag: el.tagName,
                          type: el.type,
                          id: el.id,
                          name: el.name,
                          value: el.value,
                          placeholder:
                              el.placeholder,
                          readonly: el.readOnly,
                          disabled: el.disabled,
                          outerHTML:
                              el.outerHTML
                      })
                      """
                  )

                  dump_json(
                      "STATO INIZIALE CAMPO:",
                      info,
                      10000,
                  )

              except Exception:
                  pass

              # --------------------------------------------------
              # ATTIVAZIONE
              # --------------------------------------------------

              safe_click(
                  field,
                  "Apertura campo aeroporto",
              )

              page.wait_for_timeout(500)

              focus_input(
                  page,
                  field,
                  "Focus aeroporto",
              )

              # --------------------------------------------------
              # FORZA EDITABILITÀ
              # --------------------------------------------------

              force_enable_input(
                  page,
                  field,
                  "Campo aeroporto",
              )

              page.wait_for_timeout(300)

              # --------------------------------------------------
              # PRIMO METODO: NATIVE SET + EVENTI
              # --------------------------------------------------

              log("")
              log(
                  "METODO 1 - INPUT NATIVO"
              )
              log("----------------------------------------")

              native_set_value(
                  page,
                  field,
                  city,
                  "Campo aeroporto",
              )

              page.wait_for_timeout(2500)

              inspect_airport_dom(
                  page,
                  code,
                  city,
                  "DIAGNOSTICA DOPO INPUT NATIVO",
              )

              # --------------------------------------------------
              # TENTATIVO CLICK
              # --------------------------------------------------

              if click_airport_result(
                  page,
                  code,
                  city,
                  "TENTATIVO CLICK RISULTATO DOPO INPUT NATIVO",
              ):
                  page.wait_for_timeout(1500)

                  if verify_airport_selection(
                      page,
                      code,
                      city,
                      "VERIFICA DOPO CLICK NATIVO",
                  ):
                      return True

              # --------------------------------------------------
              # SE IL CAMPO NON HA ACCETTATO IL VALORE,
              # RIPROVIAMO CON DIGITAZIONE REALE
              # --------------------------------------------------

              log("")
              log(
                  "METODO 2 - DIGITAZIONE REALE"
              )
              log("----------------------------------------")

              force_enable_input(
                  page,
                  field,
                  "Campo aeroporto",
              )

              safe_click(
                  field,
                  "Riattivazione campo aeroporto",
              )

              page.wait_for_timeout(300)

              try:
                  page.keyboard.press(
                      "Control+A"
                  )

                  page.keyboard.press(
                      "Backspace"
                  )

                  page.keyboard.type(
                      city,
                      delay=150,
                  )

                  log(
                      f"Digitazione reale "
                      f"'{city}' completata."
                  )

              except Exception as exc:
                  log(
                      "Errore digitazione reale:"
                  )

                  log(repr(exc))

              page.wait_for_timeout(3000)

              inspect_airport_dom(
                  page,
                  code,
                  city,
                  "DIAGNOSTICA DOPO DIGITAZIONE REALE",
              )

              # --------------------------------------------------
              # CLICK RISULTATO
              # --------------------------------------------------

              if click_airport_result(
                  page,
                  code,
                  city,
                  "TENTATIVO CLICK DOPO DIGITAZIONE REALE",
              ):
                  page.wait_for_timeout(1500)

                  if verify_airport_selection(
                      page,
                      code,
                      city,
                      "VERIFICA DOPO CLICK REALE",
                  ):
                      return True

              # --------------------------------------------------
              # METODO 3 - CODICE AEROPORTO
              # --------------------------------------------------

              log("")
              log(
                  "METODO 3 - CODICE AEROPORTO"
              )
              log("----------------------------------------")

              try:
                  force_enable_input(
                      page,
                      field,
                      "Campo aeroporto",
                  )

                  safe_click(
                      field,
                      "Campo aeroporto",
                  )

                  page.wait_for_timeout(300)

                  page.keyboard.press(
                      "Control+A"
                  )

                  page.keyboard.press(
                      "Backspace"
                  )

                  page.keyboard.type(
                      code,
                      delay=200,
                  )

                  log(
                      f"Codice '{code}' digitato."
                  )

              except Exception as exc:
                  log(
                      "Errore digitazione codice:"
                  )

                  log(repr(exc))

              page.wait_for_timeout(3000)

              inspect_airport_dom(
                  page,
                  code,
                  city,
                  "DIAGNOSTICA DOPO CODICE AEROPORTO",
              )

              if click_airport_result(
                  page,
                  code,
                  city,
                  "CLICK RISULTATO CODICE AEROPORTO",
              ):
                  page.wait_for_timeout(1500)

                  if verify_airport_selection(
                      page,
                      code,
                      city,
                      "VERIFICA DOPO CODICE",
                  ):
                      return True

              # --------------------------------------------------
              # METODO 4 - TASTIERA
              # --------------------------------------------------

              log("")
              log(
                  "METODO 4 - SELEZIONE DA TASTIERA"
              )
              log("----------------------------------------")

              try:
                  safe_click(
                      field,
                      "Campo aeroporto",
                  )

                  page.wait_for_timeout(500)

                  page.keyboard.press(
                      "ArrowDown"
                  )

                  page.wait_for_timeout(500)

                  page.keyboard.press(
                      "Enter"
                  )

                  page.wait_for_timeout(2000)

                  log(
                      "ArrowDown + Enter eseguiti."
                  )

              except Exception as exc:
                  log(
                      "Errore selezione tastiera:"
                  )

                  log(repr(exc))

              if verify_airport_selection(
                  page,
                  code,
                  city,
                  "VERIFICA DOPO TASTIERA",
              ):
                  return True

              # --------------------------------------------------
              # METODO 5 - TAB
              # --------------------------------------------------

              log("")
              log(
                  "METODO 5 - TAB"
              )
              log("----------------------------------------")

              try:
                  page.keyboard.press(
                      "Tab"
                  )

                  page.wait_for_timeout(1500)

                  log(
                      "Tab eseguito."
                  )

              except Exception as exc:
                  log(
                      "Errore Tab:"
                  )

                  log(repr(exc))

              if verify_airport_selection(
                  page,
                  code,
                  city,
                  "VERIFICA DOPO TAB",
              ):
                  return True

              # --------------------------------------------------
              # FALLIMENTO
              # --------------------------------------------------

              log("")
              log(
                  "SELEZIONE AEROPORTO FALLITA"
              )
              log("----------------------------------------")

              inspect_visible_inputs(
                  page,
                  "INPUT FINALI DOPO FALLIMENTO",
              )

              inspect_airport_dom(
                  page,
                  code,
                  city,
                  "DIAGNOSTICA AUTOCOMPLETE FINALE",
              )

              try:
                  page.screenshot(
                      path="/tmp/volotea-airport-failure.png",
                      full_page=True,
                  )

                  log(
                      "Screenshot fallimento salvato."
                  )

              except Exception:
                  pass

              return False


          def inspect_buttons(page):
              log("")
              log("BUTTON E CONTROLLI")
              log("----------------------------------------")

              try:
                  buttons = page.locator(
                      "button:visible"
                  )

                  count = buttons.count()

                  log(
                      f"Button visibili: {count}"
                  )

                  for index in range(
                      min(count, 50)
                  ):
                      button = buttons.nth(index)

                      try:
                          info = button.evaluate(
                              """
                              el => ({
                                  text:
                                      el.innerText,
                                  aria:
                                      el.getAttribute(
                                          "aria-label"
                                      ),
                                  type:
                                      el.type,
                                  disabled:
                                      el.disabled
                              })
                              """
                          )

                          log(
                              f"BUTTON {index}: "
                              + json.dumps(
                                  info,
                                  ensure_ascii=False,
                              )
                          )

                      except Exception:
                          pass

              except Exception as exc:
                  log(
                      "Errore analisi button:"
                  )

                  log(repr(exc))


          def find_visible_date_inputs(page):
              selectors = [
                  "input[type='date']:visible",
                  "input[placeholder*='date' i]:visible",
                  "input[placeholder*='data' i]:visible",
                  "input[id*='departure' i]:visible",
                  "input[id*='date' i]:visible",
                  "input[name*='departure' i]:visible",
                  "input[name*='date' i]:visible",
              ]

              found = []

              for selector in selectors:
                  try:
                      locator = page.locator(
                          selector
                      )

                      count = locator.count()

                      for index in range(count):
                          element = locator.nth(index)

                          if not element.is_visible():
                              continue

                          found.append(element)

                  except Exception:
                      pass

              return found


          def inspect_visible_text(page, terms):
              log("")
              log("RICERCA TESTUALE")
              log("----------------------------------------")

              for term in terms:
                  try:
                      locator = page.get_by_text(
                          term,
                          exact=False,
                      )

                      count = locator.count()

                      log(
                          f"Testo '{term}': "
                          f"{count} elemento/i."
                      )

                      shown = 0

                      for index in range(
                          min(count, 30)
                      ):
                          element = locator.nth(index)

                          try:
                              if not element.is_visible():
                                  continue

                              text = (
                                  element.inner_text()
                                  .strip()
                              )

                              if text:
                                  log(
                                      f"  [{shown}] "
                                      f"{text[:300]}"
                                  )

                                  shown += 1

                          except Exception:
                              pass

                  except Exception:
                      pass


