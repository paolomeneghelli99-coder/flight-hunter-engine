name: Flight Hunter Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Test Volotea real search
        env:
          VOLOTEA_API_KEY: ${{ secrets.VOLOTEA_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "TEST VOLOTEA - RICERCA REALE"
          echo "========================================"

          cat > /tmp/test_volotea.py <<'PYTHON'
          import json
          import os
          import sys
          from datetime import date, timedelta

          import requests
          from playwright.sync_api import sync_playwright


          STATIONS_URL = (
              "https://json.volotea.com/"
              "dist/stations/stations.json"
          )

          BOOKING_URL = "https://book.volotea.com/"

          SEARCH_PATH = "/api/spa/voe/v1/flights/search"

          ORIGIN = "VRN"
          DESTINATION = "CTA"

          USER_AGENT = (
              "Mozilla/5.0 "
              "(Linux; Android 6.0; Nexus 5 Build/MRA58N) "
              "AppleWebKit/537.36 "
              "(KHTML, like Gecko) "
              "Chrome/147.0.0.0 "
              "Mobile Safari/537.36"
          )


          def log(message=""):
              print(message, flush=True)


          def dump_json(label, data, limit=30000):
              log("")
              log(label)
              log("----------------------------------------")

              try:
                  text = json.dumps(
                      data,
                      indent=2,
                      ensure_ascii=False,
                  )
              except Exception:
                  text = str(data)

              if len(text) > limit:
                  text = (
                      text[:limit]
                      + "\n...[TRONCATO]..."
                  )

              log(text)


          def get_visible_locator(page, selectors):
              """
              Cerca nuovamente il locator nel DOM corrente.
              """

              for selector in selectors:

                  try:

                      locator = page.locator(
                          selector
                      ).filter(
                          visible=True
                      ).first

                      if locator.count() > 0:
                          return locator

                  except Exception:
                      pass

              return None


          def focus_input(
              page,
              locator,
              description,
          ):

              if locator is None:

                  log(
                      f"{description}: "
                      "locator non disponibile."
                  )

                  return False


              try:

                  locator.evaluate(
                      """
                      el => {
                          el.scrollIntoView({
                              block: "center",
                              inline: "center"
                          });
                          el.focus();
                      }
                      """
                  )

                  log(
                      f"{description}: "
                      "focus DOM riuscito."
                  )

                  return True

              except Exception as exc:

                  log(
                      f"{description}: "
                      "focus DOM fallito."
                  )

                  log(repr(exc))


              try:

                  locator.click(
                      timeout=5000,
                      force=True,
                  )

                  log(
                      f"{description}: "
                      "click forzato riuscito."
                  )

                  return True

              except Exception as exc:

                  log(
                      f"{description}: "
                      "click forzato fallito."
                  )

                  log(repr(exc))


              return False


          def clear_and_type(
              page,
              selectors,
              value,
              description,
          ):

              locator = get_visible_locator(
                  page,
                  selectors,
              )


              if locator is None:

                  log(
                      f"{description}: "
                      "campo non trovato."
                  )

                  return False


              log(
                  f"{description}: "
                  "campo individuato."
              )


              if not focus_input(
                  page,
                  locator,
                  description,
              ):

                  return False


              try:

                  page.keyboard.press(
                      "Control+A"
                  )

                  page.keyboard.press(
                      "Backspace"
                  )

                  page.keyboard.type(
                      value,
                      delay=100,
                  )

                  log(
                      f"{description}: "
                      f"valore '{value}' digitato."
                  )

                  return True

              except Exception as exc:

                  log(
                      f"{description}: "
                      "errore digitazione:"
                  )

                  log(repr(exc))

                  return False


          def inspect_text(
              page,
              terms,
          ):

              for term in terms:

                  try:

                      locator = page.get_by_text(
                          term,
                          exact=False,
                      )

                      count = locator.count()


                      if count == 0:
                          continue


                      log(
                          f"Testo '{term}': "
                          f"{count} elemento/i."
                      )


                      shown = 0


                      for index in range(
                          min(count, 30)
                      ):

                          try:

                              element = (
                                  locator.nth(
                                      index
                                  )
                              )


                              if not element.is_visible():
                                  continue


                              text = (
                                  element.inner_text()
                                  .strip()
                              )


                              if text:

                                  log(
                                      f"  [{shown}] "
                                      f"{text[:500]}"
                                  )

                                  shown += 1

                          except Exception:
                              pass

                  except Exception:
                      pass


          def inspect_buttons(page):

              log("")
              log(
                  "BUTTON VISIBILI"
              )
              log("----------------------------------------")


              try:

                  buttons = page.locator(
                      "button:visible"
                  ).all()


                  log(
                      f"Button visibili: "
                      f"{len(buttons)}"
                  )


                  for index, button in enumerate(
                      buttons[:100]
                  ):

                      try:

                          info = button.evaluate(
                              """
                              el => ({
                                  text:
                                      (el.innerText || "")
                                      .trim(),
                                  aria:
                                      el.getAttribute(
                                          "aria-label"
                                      ),
                                  title:
                                      el.getAttribute(
                                          "title"
                                      ),
                                  type:
                                      el.type,
                                  disabled:
                                      el.disabled,
                                  id:
                                      el.id,
                                  className:
                                      el.className
                              })
                              """
                          )


                          log(
                              f"BUTTON {index}: "
                              + json.dumps(
                                  info,
                                  ensure_ascii=False,
                              )
                          )

                      except Exception:
                          pass

              except Exception as exc:

                  log(
                      "Errore analisi button:"
                  )

                  log(repr(exc))


          def inspect_roles(page):

              log("")
              log(
                  "ELEMENTI ROLE VISIBILI"
              )
              log("----------------------------------------")


              selectors = [
                  "[role='button']:visible",
                  "[role='option']:visible",
                  "[role='dialog']:visible",
                  "[role='grid']:visible",
                  "[role='gridcell']:visible",
                  "[role='listbox']:visible",
              ]


              for selector in selectors:

                  try:

                      locator = page.locator(
                          selector
                      )

                      count = locator.count()


                      log(
                          f"{selector}: "
                          f"{count}"
                      )


                      for index in range(
                          min(count, 50)
                      ):

                          try:

                              element = (
                                  locator.nth(
                                      index
                                  )
                              )


                              text = (
                                  element.inner_text()
                                  .strip()
                              )


                              attrs = (
                                  element.evaluate(
                                      """
                                      el => ({
                                          role:
                                              el.getAttribute(
                                                  "role"
                                              ),
                                          aria:
                                              el.getAttribute(
                                                  "aria-label"
                                              ),
                                          text:
                                              (
                                                  el.innerText
                                                  || ""
                                              ).trim(),
                                          id:
                                              el.id,
                                          className:
                                              el.className
                                      })
                                      """
                                  )
                              )


                              log(
                                  f"  {index}: "
                                  + json.dumps(
                                      attrs,
                                      ensure_ascii=False,
                                  )
                              )

                          except Exception:
                              pass

                  except Exception:
                      pass


          def inspect_inputs(page):

              log("")
              log(
                  "INPUT VISIBILI ATTUALI"
              )
              log("----------------------------------------")


              try:

                  inputs = page.locator(
                      "input:visible"
                  ).all()


                  log(
                      f"Input visibili: "
                      f"{len(inputs)}"
                  )


                  for index, element in enumerate(
                      inputs[:50]
                  ):

                      try:

                          attrs = element.evaluate(
                              """
                              el => ({
                                  type:
                                      el.type,
                                  name:
                                      el.name,
                                  id:
                                      el.id,
                                  placeholder:
                                      el.placeholder,
                                  value:
                                      el.value,
                                  aria:
                                      el.getAttribute(
                                          "aria-label"
                                      ),
                                  min:
                                      el.getAttribute(
                                          "min"
                                      ),
                                  max:
                                      el.getAttribute(
                                          "max"
                                      )
                              })
                              """
                          )


                          log(
                              f"INPUT {index}: "
                              + json.dumps(
                                  attrs,
                                  ensure_ascii=False,
                              )
                          )

                      except Exception:
                          pass

              except Exception as exc:

                  log(
                      "Errore analisi input:"
                  )

                  log(repr(exc))


          def select_airport(
              page,
              code,
              city,
              description,
          ):

              log("")
              log(description)
              log("----------------------------------------")


              # Prima proviamo elementi role=option
              # e gli elementi contenitori conosciuti.

              selectors = [
                  "[role='option']:visible",
                  "[role='listbox'] [role='option']:visible",
                  "li:visible",
                  "[class*='option']:visible",
                  "[class*='suggestion']:visible",
              ]


              candidates = []


              for selector in selectors:

                  try:

                      locator = page.locator(
                          selector
                      )

                      count = locator.count()


                      for index in range(
                          min(count, 100)
                      ):

                          try:

                              element = (
                                  locator.nth(
                                      index
                                  )
                              )


                              text = (
                                  element.inner_text()
                                  .strip()
                              )


                              if not text:
                                  continue


                              upper = text.upper()


                              if (
                                  code.upper() in upper
                                  or city.upper() in upper
                              ):

                                  candidates.append(
                                      element
                                  )

                          except Exception:
                              pass

                  except Exception:
                      pass


              log(
                  f"Candidati strutturali per "
                  f"{code}: "
                  f"{len(candidates)}"
              )


              for index, candidate in enumerate(
                  candidates[:30]
              ):

                  try:

                      text = (
                          candidate.inner_text()
                          .strip()
                      )


                      log(
                          f"Candidato {index}: "
                          f"{text[:500]}"
                      )


                      try:

                          candidate.click(
                              timeout=3000
                          )

                      except Exception:

                          candidate.click(
                              timeout=3000,
                              force=True,
                          )


                      page.wait_for_timeout(
                          1200
                      )


                      log(
                          f"{code}: "
                          "selezione click eseguita."
                      )


                      return True

                  except Exception:
                      pass


              # Se non troviamo una struttura cliccabile,
              # usiamo la tastiera.

              log(
                  f"{code}: "
                  "provo selezione tastiera."
              )


              try:

                  page.keyboard.press(
                      "ArrowDown"
                  )

                  page.wait_for_timeout(
                      500
                  )

                  page.keyboard.press(
                      "Enter"
                  )

                  page.wait_for_timeout(
                      1500
                  )


                  log(
                      f"{code}: "
                      "selezione tastiera eseguita."
                  )


                  return True

              except Exception as exc:

                  log(
                      f"{code}: "
                      "selezione tastiera fallita:"
                  )

                  log(repr(exc))


              return False


          def main():

              # ==================================================
              # 1. DOWNLOAD STATIONS
              # ==================================================

              log("")
              log(
                  "1. DOWNLOAD STATIONS"
              )
              log("----------------------------------------")


              try:

                  response = requests.get(
                      STATIONS_URL,
                      timeout=60,
                      headers={
                          "User-Agent": USER_AGENT,
                          "Accept": "application/json",
                          "Accept-Language":
                              "it-IT,it;q=0.9,en;q=0.8",
                      },
                  )


                  log(
                      f"HTTP status: "
                      f"{response.status_code}"
                  )


                  response.raise_for_status()


                  stations = response.json()


              except Exception as exc:

                  log(
                      "ERRORE DOWNLOAD STATIONS"
                  )

                  log(repr(exc))

                  return 1


              if not isinstance(
                  stations,
                  dict,
              ):

                  log(
                      "ERRORE: stations.json "
                      "non è un dizionario."
                  )

                  return 1


              log(
                  f"Stazioni presenti: "
                  f"{len(stations)}"
              )


              if ORIGIN not in stations:

                  log(
                      f"ERRORE: {ORIGIN} "
                      "non trovato."
                  )

                  return 1


              markets = (
                  stations[ORIGIN].get(
                      "Markets"
                  )
                  or {}
              )


              log(
                  f"Mercati {ORIGIN}: "
                  f"{len(markets)}"
              )


              if DESTINATION not in markets:

                  log(
                      f"ERRORE: {DESTINATION} "
                      "non presente nei Markets "
                      f"di {ORIGIN}."
                  )

                  return 1


              market = markets[
                  DESTINATION
              ]


              log("")
              log(
                  f"{ORIGIN} -> {DESTINATION}"
              )
              log("----------------------------------------")


              log(
                  f"Enabled: "
                  f"{market.get('Enabled')}"
              )


              log(
                  f"FlightType: "
                  f"{market.get('FlightType')}"
              )


              log(
                  f"MinFlightDate: "
                  f"{market.get('MinFlightDate')}"
              )


              log(
                  f"MaxFlightDate: "
                  f"{market.get('MaxFlightDate')}"
              )


              if not market.get("Enabled"):

                  log(
                      "ERRORE: tratta non abilitata."
                  )

                  return 1


              min_date = market.get(
                  "MinFlightDate"
              )

              max_date = market.get(
                  "MaxFlightDate"
              )


              test_date = (
                  date.today()
                  + timedelta(days=1)
              )


              if min_date:

                  test_date = max(
                      test_date,
                      date.fromisoformat(
                          min_date
                      ),
                  )


              if max_date:

                  max_date_obj = (
                      date.fromisoformat(
                          max_date
                      )
                  )


                  if test_date > max_date_obj:

                      log(
                          "ERRORE: nessuna data "
                          "valida disponibile."
                      )

                      return 1


              departure_date = (
                  test_date.isoformat()
              )


              log("")
              log(
                  "RICERCA DI TEST"
              )
              log("----------------------------------------")


              log(
                  f"Origine:      {ORIGIN}"
              )


              log(
                  f"Destinazione: {DESTINATION}"
              )


              log(
                  f"Data:         {departure_date}"
              )


              log(
                  "Tipo:         SOLO ANDATA"
              )


              log(
                  "Passeggeri:   1"
              )


              # ==================================================
              # 2. BROWSER
              # ==================================================

              log("")
              log(
                  "2. APERTURA FRONTEND VOLOTEA"
              )
              log("----------------------------------------")


              api_key = os.environ.get(
                  "VOLOTEA_API_KEY",
                  "",
              ).strip()


              if api_key:

                  log(
                      "VOLOTEA_API_KEY: configurata"
                  )

              else:

                  log(
                      "VOLOTEA_API_KEY: "
                      "non configurata"
                  )


              captured_requests = []
              captured_responses = []


              with sync_playwright() as p:

                  browser = p.chromium.launch(
                      headless=True
                  )


                  context = browser.new_context(
                      locale="it-IT",
                      user_agent=USER_AGENT,
                      viewport={
                          "width": 1366,
                          "height": 900,
                      },
                      extra_http_headers={
                          "Accept-Language":
                              "it-IT,it;q=0.9,en;q=0.8",
                      },
                  )


                  page = context.new_page()


                  # ==================================================
                  # NETWORK REQUEST
                  # ==================================================

                  def handle_request(
                      request
                  ):

                      if SEARCH_PATH not in request.url:
                          return


                      headers = (
                          request.all_headers()
                      )


                      safe_headers = {}


                      for key, value in headers.items():

                          if key.lower() in (
                              "authorization",
                              "x-api-key",
                              "x-session-token",
                              "cookie",
                          ):

                              safe_headers[key] = (
                                  "[PRESENTE]"
                              )

                          else:

                              safe_headers[key] = value


                      item = {
                          "method":
                              request.method,
                          "url":
                              request.url,
                          "headers":
                              safe_headers,
                      }


                      post_data = (
                          request.post_data
                      )


                      if post_data:

                          try:

                              item["post_data"] = (
                                  json.loads(
                                      post_data
                                  )
                              )

                          except Exception:

                              item["post_data"] = (
                                  post_data[:30000]
                              )


                      captured_requests.append(
                          item
                      )


                      log("")
                      log(
                          "========================================"
                      )
                      log(
                          "FLIGHTS/SEARCH INTERCETTATA"
                      )
                      log(
                          "========================================"
                      )


                      log(
                          f"METHOD: "
                          f"{request.method}"
                      )


                      log(
                          f"URL: "
                          f"{request.url}"
                      )


                      dump_json(
                          "HEADER:",
                          safe_headers,
                          20000,
                      )


                      if "post_data" in item:

                          dump_json(
                              "PAYLOAD:",
                              item["post_data"],
                              30000,
                          )


                  # ==================================================
                  # NETWORK RESPONSE
                  # ==================================================

                  def handle_response(
                      response
                  ):

                      if SEARCH_PATH not in response.url:
                          return


                      item = {
                          "status":
                              response.status,
                          "url":
                              response.url,
                      }


                      try:

                          body = response.body()


                          item["size"] = len(
                              body
                          )


                          content_type = (
                              response.headers.get(
                                  "content-type",
                                  "",
                              )
                          )


                          item[
                              "content_type"
                          ] = content_type


                          if "json" in (
                              content_type.lower()
                          ):

                              try:

                                  item["json"] = (
                                      json.loads(
                                          body
                                      )
                                  )

                              except Exception:
                                  pass


                      except Exception as exc:

                          item["error"] = repr(
                              exc
                          )


                      captured_responses.append(
                          item
                      )


                      log("")
                      log(
                          "========================================"
                      )
                      log(
                          "RISPOSTA FLIGHTS/SEARCH"
                      )
                      log(
                          "========================================"
                      )


                      log(
                          f"HTTP STATUS: "
                          f"{response.status}"
                      )


                      log(
                          f"URL: "
                          f"{response.url}"
                      )


                      log(
                          f"SIZE: "
                          f"{item.get('size', 0)} bytes"
                      )


                      if "json" in item:

                          dump_json(
                              "RISPOSTA JSON:",
                              item["json"],
                              30000,
                          )


                  page.on(
                      "request",
                      handle_request,
                  )


                  page.on(
                      "response",
                      handle_response,
                  )


                  # ==================================================
                  # 3. APERTURA
                  # ==================================================

                  log("")
                  log(
                      f"Apertura: "
                      f"{BOOKING_URL}"
                  )


                  try:

                      page.goto(
                          BOOKING_URL,
                          wait_until="domcontentloaded",
                          timeout=90000,
                      )

                  except Exception as exc:

                      log(
                          "ATTENZIONE apertura "
                          "frontend:"
                      )

                      log(repr(exc))


                  page.wait_for_timeout(
                      8000
                  )


                  log("")
                  log(
                      f"URL finale: {page.url}"
                  )


                  log(
                      f"Titolo: "
                      f"{page.title()}"
                  )


                  # ==================================================
                  # 4. COOKIE
                  # ==================================================

                  log("")
                  log(
                      "3. GESTIONE COOKIE"
                  )
                  log("----------------------------------------")


                  cookie_selectors = [
                      "button:has-text('Aceptar sólo las esenciales')",
                      "button:has-text('Accept only necessary')",
                      "button:has-text('Accetta solo i necessari')",
                      "button:has-text('Accept essential only')",
                      "button[aria-label*='necessary']",
                      "button[aria-label*='essenziali']",
                  ]


                  for selector in cookie_selectors:

                      try:

                          locator = page.locator(
                              selector
                          ).first


                          if locator.count() == 0:
                              continue


                          if not locator.is_visible():
                              continue


                          log(
                              f"Cookie banner trovato: "
                              f"{selector}"
                          )


                          try:

                              locator.click(
                                  timeout=3000
                              )

                          except Exception:

                              locator.click(
                                  timeout=3000,
                                  force=True,
                              )


                          page.wait_for_timeout(
                              1500
                          )


                          log(
                              "Cookie banner chiuso."
                          )


                          break

                      except Exception:
                          pass


                  # ==================================================
                  # 5. FORM INIZIALE
                  # ==================================================

                  log("")
                  log(
                      "4. FORM INIZIALE"
                  )
                  log("----------------------------------------")


                  inspect_inputs(
                      page
                  )


                  # ==================================================
                  # 6. SELECTORS
                  # ==================================================

                  origin_selectors = [
                      "#input-text_sf-origin",
                      "input[name*='origin']",
                      "input[id*='origin']",
                      "input[placeholder*='Partenza']",
                      "input[placeholder*='partenza']",
                      "input[placeholder*='airport']",
                      "input[aria-label*='Partenza']",
                      "input[aria-label*='partenza']",
                  ]


                  destination_selectors = [
                      "#input-text_sf-destination",
                      "input[name*='destination']",
                      "input[id*='destination']",
                      "input[placeholder*='Arrivo']",
                      "input[placeholder*='arrivo']",
                      "input[placeholder*='airport']",
                      "input[aria-label*='Arrivo']",
                      "input[aria-label*='arrivo']",
                  ]


                  # ==================================================
                  # 7. ORIGIN
                  # ==================================================

                  log("")
                  log(
                      "5. COMPILAZIONE PARTENZA"
                  )
                  log("----------------------------------------")


                  if not clear_and_type(
                      page,
                      origin_selectors,
                      ORIGIN,
                      "Campo partenza",
                  ):

                      browser.close()
                      return 1


                  page.wait_for_timeout(
                      2000
                  )


                  inspect_text(
                      page,
                      [
                          "VRN",
                          "Verona",
                          "Italy",
                      ],
                  )


                  select_airport(
                      page,
                      ORIGIN,
                      "Verona",
                      "6. SELEZIONE PARTENZA",
                  )


                  page.wait_for_timeout(
                      1500
                  )


                  # ==================================================
                  # 8. DESTINATION
                  # ==================================================

                  log("")
                  log(
                      "7. COMPILAZIONE DESTINAZIONE"
                  )
                  log("----------------------------------------")


                  if not clear_and_type(
                      page,
                      destination_selectors,
                      DESTINATION,
                      "Campo destinazione",
                  ):

                      browser.close()
                      return 1


                  page.wait_for_timeout(
                      2000
                  )


                  inspect_text(
                      page,
                      [
                          "CTA",
                          "Catania",
                          "Italy",
                      ],
                  )


                  select_airport(
                      page,
                      DESTINATION,
                      "Catania",
                      "8. SELEZIONE DESTINAZIONE",
                  )


