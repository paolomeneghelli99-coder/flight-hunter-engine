name: Volotea Test

on:
  workflow_dispatch:

jobs:
  test-volotea:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Test Volotea
        env:
          VOLOTEA_API_KEY: ${{ secrets.VOLOTEA_API_KEY }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "TEST VOLOTEA - RICERCA REALE"
          echo "========================================"

          cat > /tmp/test_volotea.py <<'PYTHON'
          import json
          import os
          import sys
          from datetime import date, timedelta

          import requests
          from playwright.sync_api import sync_playwright


          STATIONS_URL = (
              "https://json.volotea.com/"
              "dist/stations/stations.json"
          )

          BOOKING_URL = "https://book.volotea.com/"

          SEARCH_PATH = "/api/spa/voe/v1/flights/search"

          ORIGIN = "VRN"
          DESTINATION = "CTA"

          USER_AGENT = (
              "Mozilla/5.0 "
              "(Linux; Android 6.0; Nexus 5 Build/MRA58N) "
              "AppleWebKit/537.36 "
              "(KHTML, like Gecko) "
              "Chrome/147.0.0.0 "
              "Mobile Safari/537.36"
          )


          def log(message=""):
              print(message, flush=True)


          def visible_locator(page, selectors):
              for selector in selectors:
                  try:
                      locator = page.locator(selector)

                      count = locator.count()

                      for i in range(count):
                          candidate = locator.nth(i)

                          if candidate.is_visible():
                              return candidate, selector

                  except Exception:
                      pass

              return None, None


          def dump_visible_inputs(page):
              log("")
              log("INPUT VISIBILI")
              log("----------------------------------------")

              try:
                  inputs = page.locator("input")

                  count = inputs.count()

                  visible = 0

                  for i in range(count):
                      element = inputs.nth(i)

                      if not element.is_visible():
                          continue

                      visible += 1

                      try:
                          attrs = element.evaluate(
                              """
                              el => ({
                                  index: el.dataset.testIndex || null,
                                  type: el.type,
                                  name: el.name,
                                  id: el.id,
                                  placeholder: el.placeholder,
                                  value: el.value,
                                  aria: el.getAttribute("aria-label")
                              })
                              """
                          )

                          log(
                              f"VISIBLE INPUT #{visible}: "
                              + json.dumps(
                                  attrs,
                                  ensure_ascii=False,
                              )
                          )

                      except Exception:
                          pass

              except Exception as exc:
                  log("Errore analisi input:")
                  log(repr(exc))


          def main():

              # ==================================================
              # 1. STATIONS
              # ==================================================

              log("")
              log("1. DOWNLOAD STATIONS")
              log("----------------------------------------")

              try:
                  response = requests.get(
                      STATIONS_URL,
                      timeout=60,
                      headers={
                          "User-Agent": USER_AGENT,
                          "Accept": "application/json",
                          "Accept-Language":
                              "it-IT,it;q=0.9,en;q=0.8",
                      },
                  )

                  log(
                      f"HTTP status: {response.status_code}"
                  )

                  response.raise_for_status()

                  stations = response.json()

              except Exception as exc:
                  log("ERRORE DOWNLOAD STATIONS")
                  log(repr(exc))
                  return 1


              if ORIGIN not in stations:
                  log(f"ERRORE: {ORIGIN} non trovato.")
                  return 1


              markets = (
                  stations[ORIGIN].get("Markets")
                  or {}
              )


              if DESTINATION not in markets:
                  log(
                      f"ERRORE: {DESTINATION} "
                      f"non presente per {ORIGIN}."
                  )
                  return 1


              market = markets[DESTINATION]


              log("")
              log(
                  f"{ORIGIN} -> {DESTINATION}"
              )
              log("----------------------------------------")

              log(
                  f"Enabled: {market.get('Enabled')}"
              )

              log(
                  f"FlightType: {market.get('FlightType')}"
              )

              log(
                  f"MinFlightDate: "
                  f"{market.get('MinFlightDate')}"
              )

              log(
                  f"MaxFlightDate: "
                  f"{market.get('MaxFlightDate')}"
              )


              if not market.get("Enabled"):
                  log("ERRORE: tratta non abilitata.")
                  return 1


              min_date = market.get("MinFlightDate")
              max_date = market.get("MaxFlightDate")


              test_date = (
                  date.today()
                  + timedelta(days=1)
              )


              if min_date:
                  test_date = max(
                      test_date,
                      date.fromisoformat(min_date),
                  )


              if max_date:
                  max_date_obj = date.fromisoformat(
                      max_date
                  )

                  if test_date > max_date_obj:
                      log(
                          "ERRORE: nessuna data valida."
                      )
                      return 1


              departure_date = test_date.isoformat()


              log("")
              log("RICERCA DI TEST")
              log("----------------------------------------")
              log(f"Origine: {ORIGIN}")
              log(f"Destinazione: {DESTINATION}")
              log(f"Data: {departure_date}")
              log("Tipo: SOLA ANDATA")


              # ==================================================
              # 2. BROWSER
              # ==================================================

              captured_requests = []
              captured_responses = []


              with sync_playwright() as p:

                  browser = p.chromium.launch(
                      headless=True
                  )


                  context = browser.new_context(
                      locale="it-IT",
                      user_agent=USER_AGENT,
                      extra_http_headers={
                          "Accept-Language":
                              "it-IT,it;q=0.9,en;q=0.8",
                      },
                  )


                  page = context.new_page()


                  # ==================================================
                  # API REQUEST
                  # ==================================================

                  def handle_request(request):

                      if SEARCH_PATH not in request.url:
                          return


                      headers = request.all_headers()

                      safe_headers = {}

                      for key, value in headers.items():

                          if key.lower() in (
                              "authorization",
                              "x-api-key",
                              "x-session-token",
                              "cookie",
                          ):
                              safe_headers[key] = "[PRESENTE]"
                          else:
                              safe_headers[key] = value


                      item = {
                          "method": request.method,
                          "url": request.url,
                          "headers": safe_headers,
                      }


                      post_data = request.post_data

                      if post_data:

                          try:
                              item["post_data"] = json.loads(
                                  post_data
                              )
                          except Exception:
                              item["post_data"] = post_data[:10000]


                      captured_requests.append(item)


                      log("")
                      log("========================================")
                      log("FLIGHTS/SEARCH INTERCETTATA")
                      log("========================================")

                      log(
                          f"METHOD: {request.method}"
                      )

                      log(
                          f"URL: {request.url}"
                      )

                      log("")
                      log("HEADER:")

                      for key in sorted(safe_headers):
                          log(
                              f"  {key}: "
                              f"{safe_headers[key]}"
                          )

                      log("")
                      log("PAYLOAD:")

                      if "post_data" in item:
                          log(
                              json.dumps(
                                  item["post_data"],
                                  indent=2,
                                  ensure_ascii=False,
                              )
                          )
                      else:
                          log("Payload non disponibile.")


                  # ==================================================
                  # API RESPONSE
                  # ==================================================

                  def handle_response(response):

                      if SEARCH_PATH not in response.url:
                          return


                      item = {
                          "status": response.status,
                          "url": response.url,
                      }


                      try:
                          body = response.body()

                          item["size"] = len(body)

                          content_type = (
                              response.headers.get(
                                  "content-type",
                                  "",
                              )
                          )

                          item["content_type"] = content_type


                          if "json" in content_type.lower():

                              try:
                                  item["json"] = json.loads(body)
                              except Exception:
                                  pass

                      except Exception as exc:
                          item["error"] = repr(exc)


                      captured_responses.append(item)


                      log("")
                      log("========================================")
                      log("RISPOSTA FLIGHTS/SEARCH")
                      log("========================================")

                      log(
                          f"HTTP STATUS: "
                          f"{response.status}"
                      )

                      log(
                          f"SIZE: "
                          f"{item.get('size', 0)} bytes"
                      )


                      if "json" in item:

                          log("")
                          log("JSON RICEVUTO:")

                          try:
                              log(
                                  json.dumps(
                                      item["json"],
                                      indent=2,
                                      ensure_ascii=False,
                                  )[:30000]
                              )
                          except Exception:
                              pass


                  page.on(
                      "request",
                      handle_request,
                  )

                  page.on(
                      "response",
                      handle_response,
                  )


                  # ==================================================
                  # 3. APERTURA
                  # ==================================================

                  log("")
                  log("2. APERTURA FRONTEND")
                  log("----------------------------------------")

                  try:
                      page.goto(
                          BOOKING_URL,
                          wait_until="domcontentloaded",
                          timeout=90000,
                      )

                  except Exception as exc:
                      log(
                          "ATTENZIONE apertura frontend:"
                      )
                      log(repr(exc))


                  page.wait_for_timeout(8000)


                  log(
                      f"URL finale: {page.url}"
                  )


                  # ==================================================
                  # 4. INPUT VISIBILI
                  # ==================================================

                  log("")
                  log("3. ANALISI FORM")
                  log("----------------------------------------")

                  dump_visible_inputs(page)


                  # ==================================================
                  # 5. PARTENZA
                  # ==================================================

                  log("")
                  log("4. COMPILAZIONE PARTENZA")
                  log("----------------------------------------")


                  origin_field, origin_selector = visible_locator(
                      page,
                      [
                          "#input-text_sf-origin",
                          "input[name='origin']",
                          "input[id='origin']",
                      ],
                  )


                  if origin_field is None:
                      log(
                          "ERRORE: campo partenza "
                          "visibile non trovato."
                      )

                      page.screenshot(
                          path="/tmp/volotea-error.png",
                          full_page=True,
                      )

                      browser.close()

                      return 1


                  log(
                      f"Campo partenza: "
                      f"{origin_selector}"
                  )


                  try:

                      origin_field.click()

                      page.wait_for_timeout(500)

                      origin_field.fill("")


                      origin_field.type(
                          ORIGIN,
                          delay=100,
                      )

                      page.wait_for_timeout(2000)


                      log(
                          "Partenza digitata: "
                          f"{ORIGIN}"
                      )


                  except Exception as exc:

                      log(
                          "ERRORE compilazione partenza:"
                      )

                      log(repr(exc))

                      browser.close()

                      return 1


                  # ==================================================
                  # 6. SELEZIONE AEROPORTO PARTENZA
                  # ==================================================

                  log("")
                  log("SELEZIONE AEROPORTO PARTENZA")
                  log("----------------------------------------")


                  try:

                      body_text = page.locator(
                          "body"
                      ).inner_text(
                          timeout=10000
                      )


                      log(
                          "Ricerca opzione VRN "
                          "nel menu..."
                      )


                      candidates = [
                          page.get_by_text(
                              "Verona",
                              exact=False,
                          ),
                          page.get_by_text(
                              "VRN",
                              exact=True,
                          ),
                          page.get_by_text(
                              "Verona (VRN)",
                              exact=False,
                          ),
                      ]


                      selected = False


                      for candidate in candidates:

                          try:

                              count = candidate.count()

                              for i in range(count):

                                  option = candidate.nth(i)

                                  if option.is_visible():

                                      log(
                                          "Opzione partenza "
                                          "trovata."
                                      )

                                      option.click()

                                      selected = True

                                      break

                              if selected:
                                  break

                          except Exception:
                              pass


                      if not selected:

                          log(
                              "Opzione VRN non trovata "
                              "automaticamente."
                          )

                          log(
                              "Estratto pagina:"
                          )

                          log(
                              body_text[:5000]
                          )

                          browser.close()

                          return 1


                  except Exception as exc:

                      log(
                          "Errore selezione VRN:"
                      )

                      log(repr(exc))

                      browser.close()

                      return 1


                  page.wait_for_timeout(1000)


                  # ==================================================
                  # 7. DESTINAZIONE
                  # ==================================================

                  log("")
                  log("5. COMPILAZIONE DESTINAZIONE")
                  log("----------------------------------------")


                  destination_field, destination_selector = (
                      visible_locator(
                          page,
                          [
                              "#input-text_sf-destination",
                              "input[name='destination']",
                              "input[id='destination']",
                          ],
                      )
                  )


                  if destination_field is None:

                      log(
                          "ERRORE: campo destinazione "
                          "visibile non trovato."
                      )

                      browser.close()

                      return 1


                  log(
                      f"Campo destinazione: "
                      f"{destination_selector}"
                  )


                  try:

                      destination_field.click()

                      destination_field.fill("")

                      destination_field.type(
                          DESTINATION,
                          delay=100,
                      )

                      page.wait_for_timeout(2000)


                  except Exception as exc:

                      log(
                          "ERRORE compilazione destinazione:"
                      )

                      log(repr(exc))

                      browser.close()

                      return 1


                  # ==================================================
                  # 8. SELEZIONE DESTINAZIONE
                  # ==================================================

                  log("")
                  log("SELEZIONE DESTINAZIONE")
                  log("----------------------------------------")


                  try:

                      candidates = [
                          page.get_by_text(
                              "Catania",
                              exact=False,
                          ),
                          page.get_by_text(
                              "CTA",
                              exact=True,
                          ),
                          page.get_by_text(
                              "Catania (CTA)",
                              exact=False,
                          ),
                      ]


                      selected = False


                      for candidate in candidates:

                          try:

                              count = candidate.count()

                              for i in range(count):

                                  option = candidate.nth(i)

                                  if option.is_visible():

                                      log(
                                          "Opzione CTA "
                                          "trovata."
                                      )

                                      option.click()

                                      selected = True

                                      break

                              if selected:
                                  break

                          except Exception:
                              pass


                      if not selected:

                          log(
                              "Opzione CTA non trovata."
                          )

                          log(
                              page.locator(
                                  "body"
                              ).inner_text()[:5000]
                          )

                          browser.close()

                          return 1


                  except Exception as exc:

                      log(
                          "Errore selezione CTA:"
                      )

                      log(repr(exc))

                      browser.close()

                      return 1


                  # ==================================================
                  # 9. SOLO ANDATA
                  # ==================================================

                  log("")
                  log("6. CONFIGURAZIONE SOLO ANDATA")
                  log("----------------------------------------")


                  try:

                      # Cerchiamo testi tipici del controllo
                      # andata/ritorno.

                      one_way_candidates = [
                          page.get_by_text(
                              "One way",
                              exact=False,
                          ),
                          page.get_by_text(
                              "Oneway",
                              exact=False,
                          ),
                          page.get_by_text(
                              "Solo andata",
                              exact=False,
                          ),
                          page.get_by_text(
                              "One-way",
                              exact=False,
                          ),
                      ]


                      clicked_one_way = False


                      for candidate in one_way_candidates:

                          try:

                              count = candidate.count()

                              for i in range(count):

                                  element = candidate.nth(i)

                                  if element.is_visible():

                                      log(
                                          "Controllo "
                                          "solo andata trovato."
                                      )

                                      element.click()

                                      clicked_one_way = True

                                      break

                              if clicked_one_way:
                                  break

                          except Exception:
                              pass


                      if not clicked_one_way:

                          log(
                              "Controllo 'solo andata' "
                              "non trovato tramite testo."
                          )

                          log(
                              "Procedo comunque verificando "
                              "il campo ritorno."
                          )

                  except Exception as exc:

                      log(
                          "ATTENZIONE configurazione "
                          "solo andata:"
                      )

                      log(repr(exc))


                  # ==================================================
                  # 10. DATA PARTENZA
                  # ==================================================

                  log("")
                  log("7. SELEZIONE DATA")
                  log("----------------------------------------")


                  departure_field, departure_selector = (
                      visible_locator(
                          page,
                          [
                              "#input-text_sf-departure",
                              "input[placeholder='Select Date']",
                          ],
                      )
                  )


                  if departure_field is None:

                      log(
                          "ERRORE: campo data "
                          "non trovato."
                      )

                      browser.close()

                      return 1


                  log(
                      f"Campo data: "
                      f"{departure_selector}"
                  )


                  try:

                      departure_field.click()

                      page.wait_for_timeout(1000)


                      # Proviamo prima a trovare direttamente
                      # la data nel calendario.

                      day_text = test_date.strftime(
                          "%-d"
                      )


                      log(
                          f"Cerco giorno: "
                          f"{day_text}"
                      )


                      date_candidates = [
                          page.get_by_text(
                              day_text,
                              exact=True,
                          ),
                      ]


                      selected_date = False


                      for candidate in date_candidates:

                          try:

                              count = candidate.count()

                              for i in range(count):

                                  element = candidate.nth(i)

                                  if element.is_visible():

                                      try:
                                          disabled = element.is_disabled()
                                      except Exception:
                                          disabled = False

                                      if not disabled:

                                          element.click()

                                          selected_date = True

                                          break

                              if selected_date:
                                  break

                          except Exception:
                              pass


                      if not selected_date:

                          log(
                              "Giorno non selezionato "
                              "automaticamente."
                          )

                          log(
                              "Calendario:"
                          )

                          log(
                              page.locator(
                                  "body"
                              ).inner_text()[-8000:]
                          )

                          browser.close()

                          return 1


                  except Exception as exc:

                      log(
                          "ERRORE selezione data:"
                      )

                      log(repr(exc))

                      browser.close()

                      return 1


                  # ==================================================
                  # 11. SEARCH FLIGHTS
                  # ==================================================

                  log("")
                  log("8. AVVIO RICERCA")
                  log("----------------------------------------")


                  search_buttons = [
                      page.get_by_role(
                          "button",
                          name="Search flights",
                      ),
                      page.get_by_text(
                          "Search flights",
                          exact=False,
                      ),
                  ]


                  search_clicked = False


                  for candidate in search_buttons:

                      try:

                          count = candidate.count()

                          for i in range(count):

                              button = candidate.nth(i)

                              if button.is_visible():

                                  try:
                                      disabled = button.is_disabled()
                                  except Exception:
                                      disabled = False


                                  log(
                                      f"Search button "
                                      f"visibile "
                                      f"(disabled={disabled})"
                                  )


                                  if not disabled:

                                      button.click()

                                      search_clicked = True

                                      break

                          if search_clicked:
                              break

                      except Exception as exc:

                          log(
                              "Tentativo click "
                              "Search fallito:"
                          )

                          log(repr(exc))


                  if not search_clicked:

                      log(
                          "ERRORE: pulsante "
                          "Search flights non cliccabile."
                      )

                      page.screenshot(
                          path="/tmp/volotea-search-error.png",
                          full_page=True,
                      )

                      browser.close()

                      return 1


                  log(
                      "Search flights cliccato."
                  )


                  # ==================================================
                  # 12. ATTESA API
                  # ==================================================

                  log("")
                  log(
                      "9. ATTESA RISPOSTA API"
                  )
                  log("----------------------------------------")


                  page.wait_for_timeout(
                      15000
                  )


                  # ==================================================
                  # 13. RISULTATO
                  # ==================================================

                  log("")
                  log(
                      "10. RISULTATO"
                  )
                  log("----------------------------------------")


                  log(
                      "Richieste flights/search: "
                      f"{len(captured_requests)}"
                  )

                  log(
                      "Risposte flights/search: "
                      f"{len(captured_responses)}"
                  )


                  if captured_requests:

                      log("")
                      log(
                          "========================================"
                      )

                      log(
                          "SUCCESSO: flights/search INTERCETTATA"
                      )

                      log(
                          "========================================"
                      )


                      for item in captured_requests:

                          log("")
                          log(
                              "PAYLOAD COMPLETO:"
                          )

                          if "post_data" in item:

                              log(
                                  json.dumps(
                                      item["post_data"],
                                      indent=2,
                                      ensure_ascii=False,
                                  )
                              )


                      for item in captured_responses:

                          log("")

                          log(
                              f"RISPOSTA HTTP "
                              f"{item['status']}"
                          )

                          if "json" in item:

                              log(
                                  "Risposta JSON valida: SI"
                              )


                      page.screenshot(
                          path="/tmp/volotea-success.png",
                          full_page=True,
                      )


                      browser.close()

                      return 0


                  log("")
                  log(
                      "flights/search NON intercettata."
                  )


                  page.screenshot(
                      path="/tmp/volotea-no-search.png",
                      full_page=True,
                  )


                  browser.close()

                  return 2


          if __name__ == "__main__":
              sys.exit(main())
          PYTHON

          python /tmp/test_volotea.py
